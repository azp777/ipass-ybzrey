{"id":"T106","field":"T","cat":"セキュリティ","question":"サプライチェーン攻撃の説明として、適切なものはどれか。","choices":["物流倉庫のシステムを直接攻撃すること","セキュリティ対策が強固な標的企業を直接狙わず、取引先や委託先など対策が手薄な組織を経由して侵入する攻撃","電力の供給を止めて業務を妨害する攻撃","大量の商品を不正に注文して在庫を枯渇させる攻撃"],"answer":1,"exp":"サプライチェーン攻撃は、標的企業と取引のある関連会社・委託先・ソフトウェア供給元などを踏み台にして、本来の標的に侵入する攻撃です。自社だけでなく取引先全体のセキュリティレベルが問われるため、委託先の管理や、利用するソフトウェアの供給元の確認が重要になります。IPAの「情報セキュリティ10大脅威」でも上位の常連です。"},
{"id":"T107","field":"T","cat":"セキュリティ","question":"EDR（Endpoint Detection and Response）の説明として、最も適切なものはどれか。","choices":["ウイルスの侵入を水際で100％防止するソフトウェア","PC・サーバなどの端末の挙動を監視し、侵入後の不審な動きを検知して対応を支援する仕組み","電子メールを暗号化して送信する仕組み","Webサイトの改ざんを検知する仕組み"],"answer":1,"exp":"EDRは「侵入を完全には防げない」ことを前提に、端末（エンドポイント）の操作や通信のログを常時監視し、マルウェア感染などの不審な挙動を検知して、隔離・調査・復旧を支援するツールです。侵入防止を担う従来のウイルス対策ソフト（EPP）と役割を補完し合う関係にあります。"},
{"id":"T108","field":"T","cat":"セキュリティ","question":"CSIRT（Computer Security Incident Response Team）の説明として、適切なものはどれか。","choices":["情報システムの開発を専門に行うチーム","セキュリティインシデントの発生に備え、発生時には被害拡大の防止・原因調査・復旧・再発防止を担う組織","ネットワーク機器の保守を行う外部業者","社内のヘルプデスク業務全般を担当する部署"],"answer":1,"exp":"CSIRT（シーサート）は、セキュリティインシデント対応の専門チームです。平時は脆弱性情報の収集・注意喚起・訓練を行い、インシデント発生時には司令塔として検知の確認、被害拡大防止、関係機関への連絡、復旧、再発防止策の立案を担います。24時間監視を専門に行うSOC（Security Operation Center）と併せて覚えましょう。"},
{"id":"T109","field":"T","cat":"セキュリティ","question":"WAF（Web Application Firewall）が防御の対象とする攻撃として、最も適切なものはどれか。","choices":["建物への物理的な侵入","SQLインジェクションなど、Webアプリケーションの脆弱性を突く攻撃","無線LANの盗聴","従業員による内部不正"],"answer":1,"exp":"WAFは、Webアプリケーションへの通信内容を検査し、SQLインジェクションやクロスサイトスクリプティング（XSS）など、アプリケーションの脆弱性を悪用する攻撃を検知・遮断します。ネットワークレベルの通信を制御する従来のファイアウォールでは防ぎにくい、アプリケーション層への攻撃を守るのが特徴です。"},
{"id":"T110","field":"T","cat":"セキュリティ","question":"公開鍵暗号方式で、AさんがBさんに機密情報を暗号化して送る場合に使用する鍵はどれか。","choices":["Aさんの秘密鍵","Aさんの公開鍵","Bさんの秘密鍵","Bさんの公開鍵"],"answer":3,"exp":"機密性を守る暗号化では「受信者の公開鍵で暗号化し、受信者だけが持つ秘密鍵で復号」します。Bさんに送るのでBさんの公開鍵で暗号化すれば、復号できるのは対になる秘密鍵を持つBさんだけです。逆に、送信者の秘密鍵で処理するのはデジタル署名（本人性・改ざん検知）の仕組みです。この対比は最頻出です。"},
{"id":"T111","field":"T","cat":"セキュリティ","question":"デジタル署名によって確認できることの組合せとして、適切なものはどれか。","choices":["盗聴の防止と可用性の向上","送信者が本人であること（なりすましがないこと）と、内容が改ざんされていないこと","通信速度の保証と誤り訂正","ウイルス感染の有無と脆弱性の有無"],"answer":1,"exp":"デジタル署名は、送信者の秘密鍵で署名を作成し、受信者が送信者の公開鍵で検証する仕組みです。検証に成功すれば「秘密鍵の持ち主＝本人が作成した（真正性）」「内容が途中で改ざんされていない（完全性）」ことを確認できます。暗号化と異なり、盗聴防止（機密性）の機能はない点に注意しましょう。"},
{"id":"T112","field":"T","cat":"セキュリティ","question":"スミッシングの説明として、適切なものはどれか。","choices":["SMS（ショートメッセージ）を使い、宅配業者や銀行などをかたって偽サイトに誘導し、個人情報などをだまし取る攻撃","スマートフォンを物理的に盗む行為","無料Wi-Fiを設置して通信内容を盗聴する行為","肩越しに画面をのぞき見る行為"],"answer":0,"exp":"スミッシングはSMS＋フィッシングの造語で、「不在通知」「利用停止のお知らせ」などのSMSから偽サイトへ誘導し、ID・パスワードやクレジットカード情報を詐取する攻撃です。のぞき見はショルダーハッキング、偽の無料Wi-Fiは悪意のあるアクセスポイントによる盗聴で、それぞれ区別して覚えましょう。"},
{"id":"T113","field":"T","cat":"セキュリティ","question":"生体認証システムにおける「他人受入率」と「本人拒否率」の関係として、適切なものはどれか。","choices":["両方を同時にゼロにする設定が必ず存在する","判定基準を厳しくすると他人受入率は下がるが、本人拒否率は上がるというトレードオフの関係にある","他人受入率と本人拒否率は常に等しい","判定基準を厳しくすると両方とも下がる"],"answer":1,"exp":"生体認証では、判定を厳しくするほど他人を誤って受け入れる率（他人受入率：FAR）は下がりますが、本人なのに拒否してしまう率（本人拒否率：FRR）は上がります。逆に緩くするとFRRは下がりFARが上がります。両者はトレードオフの関係にあり、用途に応じてバランスを調整します。"},
{"id":"T114","field":"T","cat":"セキュリティ","question":"シャドーITに該当するものはどれか。","choices":["情報システム部門の許可を得ずに、従業員が個人契約のクラウドサービスを業務に利用する","停電時に非常用電源で稼働するサーバ","夜間に自動実行されるバックアップ処理","開発中で未公開の新システム"],"answer":0,"exp":"シャドーITは、会社の管理部門が把握・許可していないIT機器やサービス（私物端末、個人契約のクラウドストレージ、無許可のチャットツールなど）を業務に使うことです。管理外のため、情報漏えいやマルウェア感染が起きても検知・対応が遅れるリスクがあります。対策には、ルールの明確化と、業務に必要なツールを公式に提供することが有効です。"},
{"id":"T115","field":"T","cat":"基礎理論","question":"稼働率0.9の装置を2台直列に接続したシステム全体の稼働率はいくらか。","choices":["0.81","0.90","0.95","0.99"],"answer":0,"exp":"直列システムは「すべての装置が動いているときだけ稼働」なので、稼働率は掛け算です。\n0.9×0.9＝0.81。\n直列にすると全体の稼働率は単体より必ず低くなります。"},
{"id":"T116","field":"T","cat":"基礎理論","question":"稼働率0.9の装置を2台並列に接続し、どちらか一方が動いていればよいシステム全体の稼働率はいくらか。","choices":["0.81","0.90","0.99","1.00"],"answer":2,"exp":"並列システムは「両方が同時に故障したときだけ停止」します。\n1台が故障している確率＝1−0.9＝0.1\n2台とも故障する確率＝0.1×0.1＝0.01\n稼働率＝1−0.01＝0.99。\n「1から『全部壊れる確率』を引く」のが並列の公式です。"},
{"id":"T117","field":"T","cat":"基礎理論","question":"2進数の1101を10進数で表したものはどれか。","choices":["11","13","14","26"],"answer":1,"exp":"2進数は右から順に1、2、4、8…の重みをもちます。\n1101＝1×8＋1×4＋0×2＋1×1＝8＋4＋0＋1＝13。\n各桁の重み（2の累乗）を書き出してから足すと確実です。"},
{"id":"T118","field":"T","cat":"基礎理論","question":"論理演算「AND（論理積）」の説明として、適切なものはどれか。","choices":["入力のどちらか一方でも1ならば出力が1になる","入力の両方が1のときだけ出力が1になる","入力の値を反転して出力する","入力の両方が異なるときだけ出力が1になる"],"answer":1,"exp":"ANDは「両方とも1のときだけ1」です。どちらかが1で1になるのはOR（論理和）、反転はNOT（否定）、両者が異なるときに1になるのはXOR（排他的論理和）です。検索条件の絞り込み（AかつB）のイメージで覚えると定着します。"},
{"id":"T119","field":"T","cat":"基礎理論","question":"通信速度が100Mビット/秒の回線を使って、500Mバイトのファイルを転送するのに必要な理論上の最短時間は何秒か。ここで、1バイト＝8ビットとし、回線は100％の効率で使えるものとする。","choices":["5秒","20秒","40秒","80秒"],"answer":2,"exp":"単位をビットにそろえるのがポイントです。\n500Mバイト＝500×8＝4,000Mビット\n4,000Mビット÷100Mビット/秒＝40秒。\nバイトとビットの換算（×8）を忘れないよう注意しましょう。実際は回線の利用効率が100％未満なので、効率が示された場合はさらに割り算します。"},
{"id":"T120","field":"T","cat":"基礎理論","question":"1テラバイト（TB）に相当するものはどれか。","choices":["約1,000メガバイト","約1,000ギガバイト","約1,000キロバイト","約1,000ペタバイト"],"answer":1,"exp":"補助単位は k（キロ）→M（メガ）→G（ギガ）→T（テラ）→P（ペタ）の順に1,000倍ずつ大きくなります。したがって1TB≒1,000GBです。小さい方の単位（ミリ→マイクロ→ナノ→ピコ）も併せて頻出なので、順番を確実に覚えましょう。"},
{"id":"T121","field":"T","cat":"基礎理論","question":"1個のさいころを1回振ったとき、出た目が偶数かつ4以上である確率はいくらか。","choices":["1/6","1/3","1/2","2/3"],"answer":1,"exp":"「偶数かつ4以上」を満たす目は4と6の2つです。\n確率＝該当する場合の数÷すべての場合の数＝2÷6＝1/3。\n条件を満たす目を具体的に書き出すのが確実です。"},
{"id":"T122","field":"T","cat":"基礎理論","question":"MTBFが90時間、MTTRが10時間のシステムの稼働率はいくらか。","choices":["0.10","0.81","0.90","0.99"],"answer":2,"exp":"稼働率＝MTBF÷（MTBF＋MTTR）で求めます。\n90÷（90＋10）＝90÷100＝0.9。\nMTBF（平均故障間隔）は「動いている平均時間」、MTTR（平均修理時間）は「直している平均時間」です。全体の時間のうち動いている割合が稼働率になります。"},
{"id":"T123","field":"T","cat":"ネットワーク","question":"5G（第5世代移動通信システム）の特徴の組合せとして、適切なものはどれか。","choices":["高速大容量・低遅延・多数同時接続","長距離通信・高消費電力・少数接続","音声通話専用・低速・高遅延","有線接続・固定通信・大型アンテナ必須"],"answer":0,"exp":"5Gの3大特徴は「高速大容量」「高信頼・低遅延」「多数同時接続」です。高精細動画の伝送、遠隔手術や自動運転のようなリアルタイム制御、大量のIoT機器の同時接続などへの活用が期待されています。3つセットで覚えましょう。"},
{"id":"T124","field":"T","cat":"ネットワーク","question":"DNSの役割として、適切なものはどれか。","choices":["メールを暗号化する","ドメイン名とIPアドレスを対応付けて変換する","ファイルを圧縮して転送する","不正な通信を遮断する"],"answer":1,"exp":"DNS（Domain Name System）は、人間が覚えやすいドメイン名（example.co.jpなど）と、機器が通信に使うIPアドレスを相互に変換する仕組みです。インターネットの「電話帳」に例えられます。Webサイトの閲覧やメール送信の裏側で常に使われています。"},
{"id":"T125","field":"T","cat":"ネットワーク","question":"VPN（Virtual Private Network）の説明として、最も適切なものはどれか。","choices":["社内専用の高速な物理回線を新たに敷設する技術","インターネットなどの共用ネットワーク上に、暗号化などによって仮想的な専用線を実現する技術","無線LANの電波を増幅する技術","複数のWebサイトを1台のサーバで運用する技術"],"answer":1,"exp":"VPNは、インターネットのような共用ネットワーク上で、認証と暗号化を組み合わせて仮想的な専用線を作る技術です。専用線を敷設するより低コストで、拠点間接続やテレワーク時の社内ネットワークへの安全なアクセスに広く使われています。"},
{"id":"T126","field":"T","cat":"ネットワーク","question":"URLが「https://」で始まるWebサイトについて、確認できることとして適切なものはどれか。","choices":["サイトの運営者が信頼できる企業であること","ブラウザとWebサーバ間の通信が暗号化されていること","サイトにウイルスが存在しないこと","サイトの表示速度が速いこと"],"answer":1,"exp":"httpsはTLS（SSL）によって通信が暗号化されていることを示します。入力したパスワードやカード番号が通信経路上で盗聴・改ざんされにくくなります。ただし「通信が暗号化されている」ことと「サイト運営者が信頼できる」ことは別問題で、フィッシングサイトもhttpsを使う時代です。内容の真偽は別途確認が必要です。"},
{"id":"T127","field":"T","cat":"ネットワーク","question":"LPWA（Low Power Wide Area）の特徴として、適切なものはどれか。","choices":["消費電力が少なく、広範囲の通信ができるため、IoT機器のデータ収集に適している","超高速・大容量の動画伝送に適している","有線LANの規格である","近距離の機器同士を接続する規格である"],"answer":0,"exp":"LPWAは「低消費電力・広域」が特徴の無線通信で、電池1つで数年動作し、数km〜数十kmの通信が可能です。通信速度は低速ですが、水道メータの検針、農場のセンサ、河川の水位監視など、広い範囲から少量のデータを集めるIoT用途に適しています。高速大容量は5G、近距離はBluetoothなどの担当です。"},
{"id":"T128","field":"T","cat":"ネットワーク","question":"IPv6がIPv4に代わって普及が進められている主な理由として、適切なものはどれか。","choices":["通信料金が無料になるから","IPv4のアドレス数が枯渇しており、IPv6は事実上無尽蔵のアドレスを利用できるから","IPv6の方が通信距離が長いから","IPv4は暗号化通信ができないから"],"answer":1,"exp":"IPv4のアドレスは約43億個（32ビット）しかなく、インターネットの普及により枯渇しました。IPv6は128ビットのアドレス空間をもち、事実上無尽蔵にアドレスを割り当てられます。IoTで膨大な数の機器がつながる時代に対応するための移行です。"},
{"id":"T129","field":"T","cat":"システム構成要素","question":"クラウドサービスのSaaS、PaaS、IaaSのうち、利用者に提供される範囲の説明として適切なものはどれか。","choices":["SaaSはハードウェアのみ、IaaSはアプリケーションまで提供される","SaaSはアプリケーションまで、PaaSはアプリケーションの開発・実行環境まで、IaaSはサーバやストレージなどの基盤までが提供される","3つとも提供範囲は同じで、料金だけが異なる","PaaSは物理サーバそのものが利用者に発送される"],"answer":1,"exp":"提供範囲は IaaS＜PaaS＜SaaS の順に広がります。IaaSは仮想サーバ・ストレージなどのインフラ、PaaSはその上の開発・実行環境（OSやミドルウェア）まで、SaaSは完成したアプリケーション（メール、会計ソフトなど）までを提供します。「どこまで自分で管理するか」で区別しましょう。"},
{"id":"T130","field":"T","cat":"システム構成要素","question":"エッジコンピューティングの説明として、最も適切なものはどれか。","choices":["すべてのデータをクラウドの中央サーバに集めて処理する方式","データの発生源であるIoT機器の近くにサーバを配置して処理を行い、応答の高速化や通信量の削減を図る方式","パソコンの画面の端にアプリを常駐させる技術","ネットワークの端末同士を直接接続する方式"],"answer":1,"exp":"エッジコンピューティングは、データが発生する現場（エッジ）の近くで処理を行う方式です。クラウドまでの往復が不要になるため、自動運転や工場制御のような即時性が求められる処理に有効で、クラウドへ送る通信量も削減できます。クラウドと組み合わせて役割分担させるのが一般的です。"},
{"id":"T131","field":"T","cat":"システム構成要素","question":"サーバの仮想化の利点として、最も適切なものはどれか。","choices":["物理サーバの台数を増やせる","1台の物理サーバ上で複数の仮想サーバを動かせるため、ハードウェア資源を効率的に利用できる","ソフトウェアのライセンスが不要になる","停電しても稼働し続けられる"],"answer":1,"exp":"仮想化は、1台の物理サーバを論理的に分割し、複数の仮想サーバとして動かす技術です。サーバごとの遊休資源をまとめて有効活用でき、台数削減による設置スペース・電力・運用コストの削減につながります。仮想サーバの複製や移動が容易な点も、障害対策や開発環境の構築で役立ちます。"},
{"id":"T132","field":"T","cat":"データベース","question":"関係データベースの主キーの説明として、適切なものはどれか。","choices":["表の中で最も古いデータを示す列","表の中の行（レコード）を一意に識別できる列または列の組合せ","数値だけを格納できる列","他の表を参照するための列"],"answer":1,"exp":"主キーは、表の各行を一意（ユニーク）に識別するための列（または列の組合せ）です。値の重複や空値（NULL）は許されません。例えば社員表なら社員番号が主キーになります。他の表の主キーを参照する列は外部キーと呼ばれ、表同士の関連付けに使われます。"},
{"id":"T133","field":"T","cat":"データベース","question":"データベースのトランザクション処理における「コミット」の説明として、適切なものはどれか。","choices":["一連の処理をすべて取り消して元の状態に戻すこと","一連の処理がすべて正常に完了したとき、その更新内容を確定させること","データベースの複製を作ること","データを暗号化して保存すること"],"answer":1,"exp":"トランザクションは「振込＝出金と入金」のように、分割できない一連の処理単位です。すべて成功したら更新を確定するのがコミット、途中で失敗したら全部取り消して元に戻すのがロールバックです。これにより「出金だけされて入金されない」といった中途半端な状態を防ぎます。"},
{"id":"T134","field":"T","cat":"データベース","question":"フルバックアップと差分バックアップを併用する運用において、障害発生時の復旧手順として適切なものはどれか。","choices":["最新の差分バックアップだけを復元する","最新のフルバックアップを復元した後、最新の差分バックアップを復元する","すべての差分バックアップを古い順に復元する","フルバックアップだけを復元すれば最新の状態に戻る"],"answer":1,"exp":"差分バックアップは「直近のフルバックアップ以降に変更されたすべてのデータ」を毎回保存します。復旧は「最新のフル＋最新の差分」の2つで済みます。一方、増分バックアップは「前回のバックアップ以降の変更分」なので、復旧にはフル＋その後の増分すべてが必要です。両者の違いは頻出です。"},
{"id":"T135","field":"T","cat":"セキュリティ","question":"ブロックチェーンの特徴として、最も適切なものはどれか。","choices":["取引記録を1つの中央サーバで集中管理する技術","取引記録をブロックとして鎖状につなぎ、ネットワークの参加者で分散して管理することで、改ざんを困難にする技術","データを高速に圧縮する技術","無線通信の届く範囲を拡大する技術"],"answer":1,"exp":"ブロックチェーンは、取引記録をまとめたブロックをハッシュ値で鎖のようにつなぎ、参加者全員で同じ台帳を分散管理する技術です。過去の記録を改ざんすると後続のブロックとの整合性が崩れるため、改ざんが極めて困難です。暗号資産のほか、トレーサビリティ（産地追跡）や契約の自動執行（スマートコントラクト）にも応用されています。"},
{"id":"S72","field":"S","cat":"経営戦略マネジメント","question":"DX（デジタルトランスフォーメーション）の説明として、最も適切なものはどれか。","choices":["紙の書類をスキャンして電子ファイルとして保存すること","デジタル技術とデータを活用して、製品・サービスやビジネスモデル、業務・組織・企業文化までも変革し、競争上の優位性を確立すること","すべての業務システムをクラウドに移行すること","社内の連絡手段を電子メールからチャットに変えること"],"answer":1,"exp":"DXの本質は「変革」です。単なるデジタル化（紙の電子化＝デジタイゼーション、業務のデジタル化＝デジタライゼーション）にとどまらず、ビジネスモデルや組織・文化のレベルまで変革して競争優位を築くことを指します。ア・ウ・エはDXに至る手段の一部にすぎません。"},
{"id":"S73","field":"S","cat":"経営戦略マネジメント","question":"データ駆動型（データドリブン）経営の説明として、適切なものはどれか。","choices":["経営者の経験と勘だけを頼りに意思決定を行うこと","収集・蓄積したデータの分析結果を根拠として意思決定を行うこと","データセンターを自社で保有して経営すること","すべての意思決定をAIに委ねて人間は関与しないこと"],"answer":1,"exp":"データドリブン経営は、売上・顧客・センサなどのデータを収集・分析し、その結果を根拠に意思決定する経営スタイルです。経験と勘（KKD）に頼る場合に比べ、環境変化への迅速で客観的な対応がしやすくなります。AIはあくまで分析・支援の道具で、最終判断への人間の関与は前提です。"},
{"id":"S74","field":"S","cat":"ビジネスインダストリ","question":"サブスクリプションの説明として、適切なものはどれか。","choices":["製品を1回ごとに買い切りで販売する方式","一定期間の利用権に対して定額の料金を支払う方式","オークションで最高値を付けた人に販売する方式","広告収入だけで運営し利用者は無料の方式"],"answer":1,"exp":"サブスクリプションは、月額・年額など定額で一定期間サービスを利用できる課金モデルです。動画・音楽配信、ソフトウェア（SaaS）などで主流になっています。事業者には継続的で予測しやすい収益、利用者には初期費用を抑えて常に最新版を使えるという利点があります。解約率（チャーンレート）の管理が重要です。"},
{"id":"S75","field":"S","cat":"ビジネスインダストリ","question":"シェアリングエコノミーの例として、最も適切なものはどれか。","choices":["個人が所有する自動車を、使わない時間帯に他の人に貸し出すサービス","企業が新車を製造して販売店で販売すること","中古車を買い取って再販売する事業","自動車の保険を販売すること"],"answer":0,"exp":"シェアリングエコノミーは、個人などが保有する遊休資産（モノ・場所・スキル・時間）を、インターネットのプラットフォームを介して他者と共有・貸借する経済の仕組みです。カーシェア、民泊、スキルのマッチングなどが代表例です。遊休資産の有効活用という視点がポイントです。"},
{"id":"S76","field":"S","cat":"経営戦略マネジメント","question":"ネットワーク外部性の説明として、適切なものはどれか。","choices":["ネットワーク機器を社外に設置すること","利用者が増えるほど、そのサービスの利用者にとっての価値が高まる性質","通信回線を複数の企業で共同利用すること","社外のネットワークから社内システムに接続すること"],"answer":1,"exp":"ネットワーク外部性は「使う人が多いほど価値が上がる」性質です。SNSやメッセージアプリは、友人が多く使っているほど便利になるのが典型例です。この性質があるサービスでは、早期に利用者数を確保した事業者が市場を独占しやすく、プラットフォーマーの強さの源泉になっています。"},
{"id":"S77","field":"S","cat":"ビジネスインダストリ","question":"フィンテックの例として、最も適切なものはどれか。","choices":["銀行の店舗窓口を増やして対面サービスを強化する","スマートフォンのアプリによるQRコード決済や、AIを活用した資産運用アドバイス","現金輸送車の警備を強化する","紙の通帳のデザインを一新する"],"answer":1,"exp":"フィンテックは金融（Finance）と技術（Technology）の融合を指し、スマホ決済、ネットバンキング、AIによる与信・資産運用（ロボアドバイザ）、クラウドファンディング、暗号資産などが該当します。ITによって金融サービスを革新するものを選びましょう。"},
{"id":"S78","field":"S","cat":"ビジネスインダストリ","question":"D2C（Direct to Consumer）の説明として、適切なものはどれか。","choices":["卸売業者や小売店を介して商品を販売する形態","メーカーが自社のECサイトなどを通じて、消費者に直接商品を販売する形態","消費者同士が中古品を売買する形態","企業間で原材料を取引する形態"],"answer":1,"exp":"D2Cは、メーカー（ブランド）が中間流通を介さず、自社ECサイトやSNSを通じて消費者へ直接販売するモデルです。中間マージンの削減に加え、顧客データを直接得られるため、商品開発やマーケティングに活かせるのが強みです。消費者同士の取引はC2C（フリマアプリなど）です。"},
{"id":"S79","field":"S","cat":"法務","question":"個人情報保護法における「要配慮個人情報」に該当するものはどれか。","choices":["氏名と電話番号","人種、信条、病歴、犯罪の経歴など、不当な差別や偏見が生じないように取扱いに特に配慮を要する情報","勤務先の部署名","メールアドレス"],"answer":1,"exp":"要配慮個人情報は、人種・信条・社会的身分・病歴・犯罪の経歴・犯罪被害の事実などです。取得には原則として本人の同意が必要で、オプトアウト方式（本人の求めに応じて停止する方式）による第三者提供は認められないなど、通常の個人情報より厳しい規律が課されます。"},
{"id":"S80","field":"S","cat":"法務","question":"匿名加工情報の説明として、適切なものはどれか。","choices":["個人情報を暗号化して保存したもの","特定の個人を識別できないように加工し、元の個人情報に復元できないようにした情報","本人の氏名をイニシャルに置き換えただけの情報","社外秘のマークを付けた文書"],"answer":1,"exp":"匿名加工情報は、①特定の個人を識別できないように加工し、②元の個人情報を復元できないようにしたものです。一定のルールの下で本人の同意なく第三者提供や利活用ができるため、ビッグデータ分析への活用が期待されています。暗号化（ア）は復元可能なので該当しません。"},
{"id":"S81","field":"S","cat":"法務","question":"著作権法による保護の対象となるものはどれか。","choices":["プログラムのアルゴリズム（解法）そのもの","作成されたプログラム（ソースコード）","プログラミング言語の仕様","計算の結果得られた数値"],"answer":1,"exp":"著作権法は「思想又は感情を創作的に表現したもの」を保護します。プログラムは表現物として保護対象ですが、アルゴリズム（解法）・プログラミング言語・規約（プロトコル）は表現ではなくアイディアなので保護対象外と明記されています。アイディアを保護したい場合は特許権（発明）の出番です。"},
{"id":"S82","field":"S","cat":"法務","question":"不正アクセス禁止法で禁止されている行為に該当するものはどれか。","choices":["他人のID・パスワードを無断で使用してシステムにログインする行為","会社のPCで業務中に私的なWebサイトを閲覧する行為","フリーソフトを私物PCにインストールする行為","電車内でスマートフォンを使用する行為"],"answer":0,"exp":"不正アクセス禁止法は、①他人の識別符号（ID・パスワード）を無断利用してのログイン（なりすまし）、②脆弱性を突いた侵入、③これらを助長する行為（他人のパスワードの無断提供、フィッシングサイトの設置など）を禁止しています。イは社内規程の問題であり、この法律の対象ではありません。"},
{"id":"S83","field":"S","cat":"法務","question":"労働者派遣契約において、派遣労働者に業務上の指揮命令を行うのは誰か。","choices":["派遣元の事業主","派遣先の事業主","労働基準監督署","派遣労働者自身"],"answer":1,"exp":"労働者派遣では、雇用契約は派遣元と労働者の間にありますが、業務の指揮命令は派遣先が行います。これが「雇用と使用の分離」という派遣の特徴です。一方、請負では注文者は受託側の労働者に直接指揮命令できません。指揮命令したい場合に請負契約を使うと偽装請負になる点が頻出です。"},
{"id":"S84","field":"S","cat":"法務","question":"請負契約の特徴として、適切なものはどれか。","choices":["受託者は仕事の完成義務を負い、注文者は受託者の労働者に直接指揮命令できない","注文者が受託者の労働者に直接指揮命令できる","労働時間に応じて必ず報酬が支払われ、完成義務はない","契約書の作成が法律で禁止されている"],"answer":0,"exp":"請負は「仕事の完成」を約束する契約で、受託者は完成責任と契約不適合責任を負います。労働者への指揮命令は受託側の管理者が行い、注文者が直接指揮命令すると偽装請負として違法になります。完成義務を負わず善良な管理者の注意をもって事務を処理するのは準委任契約です。"},
{"id":"S85","field":"S","cat":"法務","question":"不正競争防止法で保護される「営業秘密」の3要件の組合せとして、適切なものはどれか。","choices":["新規性・進歩性・産業上の利用可能性","秘密管理性・有用性・非公知性","独自性・経済性・国際性","機密性・完全性・可用性"],"answer":1,"exp":"営業秘密として保護されるには、①秘密として管理されている（秘密管理性）、②事業活動に有用（有用性）、③公然と知られていない（非公知性）の3要件が必要です。アは特許の要件、エは情報セキュリティの3要素（CIA）で、混同を狙った出題がよくあります。"},
{"id":"S86","field":"S","cat":"法務","question":"OSS（オープンソースソフトウェア）の一般的な特徴として、適切なものはどれか。","choices":["ソースコードが公開されており、ライセンス条件に従えば改変や再配布ができる","著作権が放棄されているため、どんな使い方をしても制約はない","無償で利用できるが、ソースコードは公開されていない","個人での利用が禁止されている"],"answer":0,"exp":"OSSはソースコードが公開され、ライセンス（GPL、Apacheライセンスなど）の条件に従って利用・改変・再配布ができるソフトウェアです。著作権は放棄されておらず、ライセンス条件（改変部分の公開義務など）は種類によって異なります。「無償＝制約なし」ではない点が引っかけどころです。"},
{"id":"S87","field":"S","cat":"企業活動","question":"自己資本が500百万円、当期純利益が50百万円であるとき、ROE（自己資本利益率）は何％か。","choices":["1％","5％","10％","20％"],"answer":2,"exp":"ROE＝当期純利益÷自己資本×100で求めます。\n50÷500×100＝10％。\nROEは「株主が出したお金でどれだけ効率よく利益を上げたか」を示す指標で、投資家が重視します。総資産を分母にするROA（総資産利益率）との区別も頻出です。"},
{"id":"S88","field":"S","cat":"企業活動","question":"売上高が1,000万円、売上原価が600万円のときの売上総利益（粗利益）はいくらか。","choices":["400万円","600万円","1,000万円","1,600万円"],"answer":0,"exp":"売上総利益＝売上高−売上原価＝1,000−600＝400万円。\n利益は「売上総利益→営業利益（−販管費）→経常利益（±営業外損益）→当期純利益」の順に計算されます。どの段階の利益を問われているかを確認する習慣をつけましょう。"},
{"id":"S89","field":"S","cat":"企業活動","question":"ある事業に投資した場合、成功する確率が30％で利益は1,000万円、失敗する確率が70％で損失は200万円と見込まれる。この投資の期待値はいくらか。","choices":["−60万円","160万円","300万円","800万円"],"answer":1,"exp":"期待値＝（確率×金額）の合計です。\n成功：0.3×1,000＝300万円\n失敗：0.7×（−200）＝−140万円\n期待値＝300−140＝160万円。\n意思決定問題では、選択肢ごとの期待値を計算して最も大きいものを選びます。"},
{"id":"S90","field":"S","cat":"経営戦略マネジメント","question":"KGI、KPI、CSFの関係の説明として、最も適切なものはどれか。","choices":["KGIは日々の活動指標、KPIは最終目標である","KGIは最終目標の達成度を測る指標、CSFは目標達成のための重要成功要因、KPIはCSFの達成度を測る中間指標である","3つはすべて同じ意味で、業界によって呼び方が違うだけである","CSFは財務指標のみを指す"],"answer":1,"exp":"KGI（重要目標達成指標）は「売上高10億円」のような最終ゴールの指標、CSF（重要成功要因）は「新規顧客の獲得」のような達成のカギとなる要因、KPI（重要業績評価指標）は「月間商談件数100件」のようにCSFの進捗を測る中間指標です。ゴール（KGI）から逆算してCSF→KPIへ落とし込む関係を押さえましょう。"},
{"id":"S91","field":"S","cat":"経営戦略マネジメント","question":"SWOT分析における「機会（Opportunity）」に該当するものはどれか。","choices":["自社の高い技術力","自社の販売網の弱さ","市場の拡大や規制緩和など、自社に有利な外部環境の変化","競合他社の新製品投入による脅威"],"answer":2,"exp":"SWOT分析は、内部環境の強み（S）・弱み（W）と、外部環境の機会（O）・脅威（T）に整理する手法です。「機会」は自社にとって追い風となる外部要因です。技術力は内部の強み、販売網の弱さは内部の弱み、競合の攻勢は外部の脅威に分類されます。内部か外部か、プラスかマイナスかの2軸で判定しましょう。"},
{"id":"S92","field":"S","cat":"経営戦略マネジメント","question":"PPM（プロダクトポートフォリオマネジメント）において、市場成長率が低く、市場占有率が高い事業の分類はどれか。","choices":["花形","金のなる木","問題児","負け犬"],"answer":1,"exp":"PPMは市場成長率と市場占有率の2軸で事業を4分類します。「金のなる木」は成長率が低い（＝追加投資が少なくて済む）が占有率が高い（＝安定した収益）事業で、ここで得た資金を「問題児」（成長率高・占有率低）や「花形」（両方高）に投資するのが定石です。両方低い「負け犬」は撤退の検討対象です。"},
{"id":"S93","field":"S","cat":"経営戦略マネジメント","question":"コアコンピタンスの説明として、適切なものはどれか。","choices":["他社が容易にまねできない、自社の中核となる強み・能力","業界で標準的に使われている技術","外部に委託している業務","会社の中心となる事業所の所在地"],"answer":0,"exp":"コアコンピタンスは、競合他社が簡単には模倣できない自社独自の中核的な強み（技術力、ノウハウ、ブランドなど）です。経営戦略では、この強みを軸に事業を展開し、強みでない部分はアウトソーシングするといった選択と集中の判断につながります。"},
{"id":"S94","field":"S","cat":"経営戦略マネジメント","question":"アンゾフの成長マトリクスにおいて、既存の製品を新しい市場（新しい顧客層や地域）に販売する戦略はどれか。","choices":["市場浸透","市場開拓","製品開発","多角化"],"answer":1,"exp":"アンゾフの成長マトリクスは「製品（既存/新規）×市場（既存/新規）」の4象限です。既存製品×新市場＝市場開拓（例：国内商品の海外展開）、既存×既存＝市場浸透、新製品×既存市場＝製品開発、新製品×新市場＝多角化です。具体例とセットで4つとも覚えましょう。"},
{"id":"S95","field":"S","cat":"経営戦略マネジメント","question":"マーケティングの4Pと、それに対応する顧客視点の4Cの組合せとして、適切なものはどれか。","choices":["Product（製品）― Customer Value（顧客価値）","Price（価格）― Convenience（利便性）","Place（流通）― Cost（顧客コスト）","Promotion（販促）― Control（管理）"],"answer":0,"exp":"売り手視点の4Pと買い手視点の4Cは、Product―Customer Value（顧客価値）、Price―Cost（顧客が負担するコスト）、Place―Convenience（入手の利便性）、Promotion―Communication（対話）と対応します。「価格＝顧客にとってはコスト」「流通＝顧客にとっては利便性」という視点の転換がポイントです。"},
{"id":"S96","field":"S","cat":"経営戦略マネジメント","question":"RFM分析で顧客の評価に用いる3つの指標の組合せとして、適切なものはどれか。","choices":["最終購買日・購買頻度・購買金額","年齢・性別・居住地","認知・興味・購買","品質・価格・納期"],"answer":0,"exp":"RFM分析は、Recency（最終購買日：最近買ったか）、Frequency（購買頻度：よく買うか）、Monetary（購買金額：いくら使ったか）の3指標で顧客をランク分けする手法です。優良顧客の抽出や、離反しかけた顧客への再アプローチなど、顧客ごとの施策の使い分けに活用されます。"},
{"id":"S97","field":"S","cat":"ビジネスインダストリ","question":"ロングテールの説明として、最も適切なものはどれか。","choices":["売れ筋の上位商品だけに品ぞろえを絞り込む戦略","インターネット販売では陳列や在庫の制約が小さいため、販売機会の少ないニッチな商品でも多品種そろえることで全体の売上を大きくできるという考え方","商品の納期を長く設定すること","1人の顧客と長期間の契約を結ぶこと"],"answer":1,"exp":"ロングテールは、販売数量順に商品を並べたグラフの「尻尾（テール）」に当たる、個々にはあまり売れない多数の商品群の売上合計が、ヒット商品に匹敵する規模になり得るという考え方です。実店舗と違い陳列スペースの制約がないネット販売だから成り立つモデルで、上位2割に集中するパレートの法則（80:20）と対比されます。"},
{"id":"S98","field":"S","cat":"経営戦略マネジメント","question":"カスタマージャーニーマップの説明として、適切なものはどれか。","choices":["顧客が商品を認知してから購入・利用・推奨に至るまでの行動・思考・感情の変化を時系列で可視化したもの","顧客の自宅から店舗までの道順を示した地図","配送トラックの走行ルートを最適化する仕組み","顧客の年齢分布を示したグラフ"],"answer":0,"exp":"カスタマージャーニーマップは、顧客体験を「認知→検討→購入→利用→推奨」といった段階に分け、各段階での顧客の行動・接点（タッチポイント）・感情を時系列で整理したものです。顧客視点で課題や改善機会を発見し、マーケティング施策の設計に活かします。"},
{"id":"S99","field":"S","cat":"ビジネスインダストリ","question":"CRM（Customer Relationship Management）の目的として、最も適切なものはどれか。","choices":["生産設備の稼働率を高める","顧客との関係を管理・強化し、顧客満足度と顧客生涯価値（LTV）を高める","従業員の勤怠を管理する","部品の調達コストを削減する"],"answer":1,"exp":"CRMは、顧客情報や購買履歴・問合せ履歴を一元管理し、顧客一人ひとりに合った対応を続けることで、長期的な信頼関係を築き、顧客生涯価値（LTV：1人の顧客が生涯にわたってもたらす利益）を最大化する経営手法・システムです。営業活動の支援に特化したものはSFAと呼ばれます。"},
{"id":"S100","field":"S","cat":"経営戦略マネジメント","question":"複数の企業が、それぞれの独立性を保ったまま、技術開発や販売などで協力関係を結ぶことを表す用語はどれか。","choices":["アライアンス","合併","子会社化","事業清算"],"answer":0,"exp":"アライアンス（企業提携）は、資本関係の有無にかかわらず、各社が独立性を維持したまま協力する形態です（技術提携、共同開発、販売提携など）。合併や買収（M&A）は経営権や法人格の統合を伴う点で異なります。自社にない経営資源を素早く補完できるのが利点です。"},
{"id":"S101","field":"S","cat":"経営戦略マネジメント","question":"ブルーオーシャン戦略の説明として、適切なものはどれか。","choices":["競争の激しい既存市場で、価格競争によってシェアを奪う戦略","競争のない新しい市場を創造し、競争自体を無意味にする戦略","海運業に特化して事業を展開する戦略","環境保護を最優先にする経営戦略"],"answer":1,"exp":"ブルーオーシャン戦略は、血みどろの競争が繰り広げられる既存市場（レッドオーシャン）を避け、新しい価値の提供によって競争のない未開拓市場（ブルーオーシャン）を切り開く戦略です。価格競争の消耗戦から抜け出し、高い収益性を狙います。"},
{"id":"M41","field":"M","cat":"システム開発技術","question":"アジャイル開発の特徴として、最も適切なものはどれか。","choices":["最初にすべての要件を確定させ、工程を後戻りせずに順番に進める","短い期間の開発サイクルを繰り返し、動くソフトウェアを少しずつ完成させながら、変化する要求に柔軟に対応する","開発をすべて海外の企業に委託する","テストを省略して開発期間を短縮する"],"answer":1,"exp":"アジャイル開発は、1〜4週間程度の短いサイクル（イテレーション／スプリント）で「動くソフトウェア」を繰り返しリリースし、顧客のフィードバックを取り込みながら開発を進める手法です。要件の変化への対応を重視します。最初に全要件を固めて順に進めるのはウォータフォールモデル（ア）です。"},
{"id":"M42","field":"M","cat":"システム開発技術","question":"スクラムにおいて、プロダクトの価値を最大化することに責任をもち、作成する機能の優先順位（プロダクトバックログ）を決定する役割はどれか。","choices":["プロダクトオーナー","スクラムマスター","開発者","プロジェクトマネージャ"],"answer":0,"exp":"スクラムの3つの役割のうち、プロダクトオーナーは「何を作るか」の責任者で、プロダクトバックログの内容と優先順位を決めます。スクラムマスターはスクラムの仕組みがうまく回るよう支援する役割、開発者は実際にプロダクトを作る役割です。3役割の責任範囲の区別が頻出です。"},
{"id":"M43","field":"M","cat":"システム開発技術","question":"スクラム開発における「スプリント」の説明として、適切なものはどれか。","choices":["プロジェクト全体の最終期限","1〜4週間程度の固定された長さで繰り返される開発の単位期間","システムの応答速度を測定するテスト","開発メンバーの休暇期間"],"answer":1,"exp":"スプリントは、スクラムにおける固定長（通常1〜4週間）の開発サイクルです。スプリントごとに計画（スプリントプランニング）→開発→成果の確認（スプリントレビュー）→進め方の振り返り（レトロスペクティブ）を繰り返し、毎回「動くソフトウェア」の完成を目指します。"},
{"id":"M44","field":"M","cat":"システム開発技術","question":"XP（エクストリームプログラミング）のプラクティスの1つで、2人の開発者が1台のコンピュータに向かい、会話しながら共同でプログラムを作成する手法はどれか。","choices":["ペアプログラミング","リファクタリング","テスト駆動開発","継続的インテグレーション"],"answer":0,"exp":"ペアプログラミングは、2人1組で1台のPCを使い、1人がコードを書き、もう1人がその場でレビューしながら開発する手法です。品質向上と知識共有が利点です。リファクタリングは動作を変えずに内部構造を改善すること、テスト駆動開発はテストを先に書いてから実装する手法、継続的インテグレーションはコードの結合とテストを自動で頻繁に行う仕組みです。"},
{"id":"M45","field":"M","cat":"ソフトウェア開発管理技術","question":"DevOpsの説明として、最も適切なものはどれか。","choices":["開発部門と運用部門が密接に連携・協力し、ツールによる自動化も活用して、システムの改善とリリースを迅速かつ頻繁に行う取組み","開発をすべて自動化して人間を関与させない仕組み","運用部門を廃止して開発部門に統合する組織改編","デバイスとオペレータの略で、機器の操作方法を指す"],"answer":0,"exp":"DevOpsはDevelopment（開発）とOperations（運用）を組み合わせた造語です。従来対立しがちだった両部門が協力し、ビルド・テスト・デプロイの自動化などを活用して、リリースのサイクルを速く・頻繁に回す文化・取組みを指します。アジャイル開発と相性がよい考え方です。"},
{"id":"M46","field":"M","cat":"プロジェクトマネジメント","question":"作業A（3日）の後に作業B（5日）と作業C（2日）を並行して行い、両方が完了したら作業D（4日）を行う。このプロジェクトの最短所要日数は何日か。","choices":["9日","12日","14日","10日"],"answer":1,"exp":"並行作業は「長い方」が完了しないと次に進めません。\nA（3日）→ BとCの並行部分は長い方のB（5日）→ D（4日）\n3＋5＋4＝12日。\n最も時間のかかる経路（A→B→D）がクリティカルパスで、この経路の作業が遅れるとプロジェクト全体が遅れます。"},
{"id":"M47","field":"M","cat":"プロジェクトマネジメント","question":"開発規模が60人月のプロジェクトを6か月で完了させたい。1人の要員は1か月で1人月の作業ができるとすると、必要な要員数は何人か。","choices":["6人","10人","12人","60人"],"answer":1,"exp":"必要要員数＝総工数÷期間＝60人月÷6か月＝10人。\n「人月」は1人が1か月働く作業量の単位です。実際には要員を増やしてもコミュニケーションコストが増えて単純比例しない点も、実務では重要な論点です。"},
{"id":"M48","field":"M","cat":"プロジェクトマネジメント","question":"WBS（Work Breakdown Structure）を作成する目的として、最も適切なものはどれか。","choices":["プロジェクトの成果物と作業を階層的に分解し、管理可能な単位まで細分化して全体の範囲を明確にする","メンバーの給与を計算する","システムの画面デザインを決定する","障害の原因を分析する"],"answer":0,"exp":"WBSは、プロジェクトで作るべき成果物と必要な作業をトップダウンで階層的に分解した図です。作業の漏れ・重複を防ぎ、見積り・スケジュール作成・担当割当ての基礎になります。細分化した最小単位はワークパッケージと呼ばれます。"},
{"id":"M49","field":"M","cat":"プロジェクトマネジメント","question":"ガントチャートの説明として、適切なものはどれか。","choices":["作業間の依存関係を矢印で表し、クリティカルパスを求める図","縦軸に作業項目、横軸に時間をとり、各作業の予定期間と実績を横棒で表した図","項目を出現頻度順に並べた棒グラフと累積比率の折れ線を組み合わせた図","組織の指揮命令系統を表した図"],"answer":1,"exp":"ガントチャートは、作業ごとの開始・終了時期と進捗を横棒で視覚化した工程管理図です。進捗の把握が直感的にできる一方、作業間の依存関係やクリティカルパスの分析には向かず、それにはアローダイアグラム（PERT図）を使います。両者の使い分けが頻出です。"},
{"id":"M50","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクト憲章の説明として、適切なものはどれか。","choices":["プロジェクトの完了後に作成する反省点をまとめた文書","プロジェクトを正式に立ち上げることを承認し、目的・体制・プロジェクトマネージャの権限などを定めた文書","システムの操作方法を説明する文書","日々の作業実績を記録する日報"],"answer":1,"exp":"プロジェクト憲章は、プロジェクトの開始を組織として正式に承認する文書で、目的・背景、成果目標、制約条件、プロジェクトマネージャの任命と権限などを定めます。これによってプロジェクトマネージャは組織の資源を使う正当な権限を得ます。立上げプロセスで作成される点がポイントです。"},
{"id":"M51","field":"M","cat":"サービスマネジメント","question":"SLA（Service Level Agreement）の説明として、適切なものはどれか。","choices":["サービスの提供者と利用者の間で、サービスの品質目標（稼働率や障害復旧時間など）を定めた合意","ソフトウェアの使用許諾契約","従業員の労働条件を定めた就業規則","システムの設計書"],"answer":0,"exp":"SLAは、提供するITサービスの品質を「稼働率99.9％以上」「障害復旧は4時間以内」のように数値で定めた、提供者と利用者の合意文書です。目標を達成できたかを測定・評価し、サービスの改善につなげる活動全体はSLM（サービスレベル管理）と呼ばれます。"},
{"id":"M52","field":"M","cat":"サービスマネジメント","question":"ITサービスマネジメントにおける「インシデント管理」の主な目的として、適切なものはどれか。","choices":["障害の根本原因を特定して恒久的な対策を講じる","サービスの中断や品質低下が発生したとき、可能な限り迅速にサービスを復旧させて業務への影響を最小限に抑える","新しいソフトウェアを開発する","サーバ室の入退室を管理する"],"answer":1,"exp":"インシデント管理の目的は「迅速な復旧」です。再起動や代替手段でまず業務を再開させることを優先します。一方、根本原因を究明して恒久対策を行うのは問題管理の役割です。「応急処置＝インシデント管理、原因究明＝問題管理」という対比で覚えましょう。"},
{"id":"M53","field":"M","cat":"サービスマネジメント","question":"チャットボットをサービスデスクに導入する主な利点として、最も適切なものはどれか。","choices":["すべての問合せに人間より正確に回答できる","よくある問合せに24時間自動で対応でき、オペレータはより複雑な問合せに集中できる","問合せの件数を強制的に減らすことができる","利用者の個人情報を収集できる"],"answer":1,"exp":"チャットボットは、定型的な問合せ（パスワードリセットの手順など）に24時間365日自動応答できるため、利用者の待ち時間を減らし、オペレータを複雑な対応に振り向けられます。ただし万能ではなく、答えられない問合せを人間へ引き継ぐ設計（エスカレーション）が重要です。"},
{"id":"M54","field":"M","cat":"システム監査","question":"内部統制における「職務の分離（職務分掌）」の例として、適切なものはどれか。","choices":["申請者と承認者を別の人にする","業務の効率化のため、発注と検収を同じ担当者が行う","全員が同じ管理者パスワードを共有する","監査を担当部署が自分自身で行う"],"answer":0,"exp":"職務の分離は、1人がすべての手続を完結できないように役割を分ける統制で、不正や誤りの防止・発見を目的とします。申請と承認、発注と検収、開発と運用などを別の人・部署に分けるのが典型です。イ・ウ・エはいずれも相互けん制が働かず、不正の温床になり得ます。"},
{"id":"M55","field":"M","cat":"システム監査","question":"システム監査人に求められる要件として、最も適切なものはどれか。","choices":["監査対象のシステムを開発した本人であること","監査対象の部門から独立した立場で、客観的に監査を実施すること","監査対象部門の上司であること","経営者の指示どおりの監査結果を報告すること"],"answer":1,"exp":"システム監査人には、監査対象からの独立性（外観上・精神上）と客観性が求められます。自分が開発したシステムや所属部門を監査すると、身内びいきの評価になるおそれがあるためです。監査結果は事実と証拠（監査証拠）に基づいて報告し、経営者への忖度があってはなりません。"},
{"id":"S102","field":"S","cat":"企業活動","question":"A社では、環境の変化が激しい市場に対応するため、計画に時間をかけるのではなく、現場の観察に基づいて状況を判断し、素早く意思決定して行動するサイクルを繰り返すことにした。この考え方に該当するものはどれか。","choices":["PDCAサイクル","OODAループ","ウォータフォール","ベンチマーキング"],"answer":1,"exp":"OODAループはObserve（観察）→Orient（状況判断）→Decide（意思決定）→Act（行動）を高速で回す枠組みで、想定外の変化への即応に向きます。PDCAは計画（Plan）から始まる改善サイクルで、安定した業務の継続的改善に向くという対比で覚えましょう。"},
{"id":"S103","field":"S","cat":"企業活動","question":"従業員20人で月間4,000個の製品を生産していた工場が、業務改善によって従業員16人で月間4,800個を生産できるようになった。1人当たりの労働生産性は改善前の何倍になったか。","choices":["1.2倍","1.5倍","2.0倍","3.0倍"],"answer":1,"exp":"労働生産性＝生産量÷人数。\n改善前：4,000÷20＝200個/人。改善後：4,800÷16＝300個/人。\n300÷200＝1.5倍。分母と分子の両方が変わる点に注意して、それぞれ計算してから比較します。"},
{"id":"S104","field":"S","cat":"企業活動","question":"ROA（総資産利益率）の説明として、適切なものはどれか。","choices":["自己資本に対する当期純利益の割合","総資産に対する利益の割合であり、企業が保有する資産全体をどれだけ効率的に使って利益を生んだかを示す","売上高に対する営業利益の割合","流動負債に対する流動資産の割合"],"answer":1,"exp":"ROA＝利益÷総資産×100。借入金も含めた総資産でどれだけ稼いだかを示します。自己資本に対する利益率はROE、売上高に対する割合は利益率、流動資産÷流動負債は流動比率です。分母が何かで区別しましょう。"},
{"id":"S105","field":"S","cat":"企業活動","question":"製造ラインの品質管理において、測定値の時系列変化を上方管理限界線と下方管理限界線とともにプロットし、工程の異常を検出するために用いる図はどれか。","choices":["管理図","パレート図","特性要因図","系統図"],"answer":0,"exp":"管理図は、工程が統計的に安定した状態かを監視する図で、管理限界線を超えた点や特定のパターンが現れたら異常と判断します。パレート図は重点項目の把握、特性要因図は原因の整理に使います。"},
{"id":"S106","field":"S","cat":"企業活動","question":"BCPの観点から、企業が平常時に行っておくべき活動として、最も適切なものはどれか。","choices":["災害が発生してから対応方法を検討する","重要業務の特定、代替手段の確保、連絡体制の整備を行い、訓練によって実効性を確認しておく","全ての業務を同じ優先度で復旧できるように準備する","BCPの内容は経営層だけで共有し、従業員には知らせない"],"answer":1,"exp":"BCPは策定して終わりではなく、①優先して継続・復旧すべき中核事業の特定、②代替オフィスやバックアップなどの事前対策、③教育・訓練による実効性の確認、④定期的な見直し（BCM）が重要です。全業務を同時に復旧するのではなく優先順位を付けるのがポイントです。"},
{"id":"S107","field":"S","cat":"企業活動","question":"リスキリングの事例として、最も適切なものはどれか。","choices":["営業部門の従業員に、DX推進に必要なデータ分析スキルを習得させる研修を行う","従業員の勤務年数に応じて役職を上げる","新入社員に名刺交換のマナーを教える","従業員の健康診断を毎年実施する"],"answer":0,"exp":"リスキリングは、技術革新やビジネスモデルの変化に対応するため、新しい業務に必要なスキルを学び直させることです。DX時代の人材戦略として重視されており、シラバスにも追加された注目用語です。"},
{"id":"S108","field":"S","cat":"法務","question":"A社の従業員Bが、業務時間外に自宅のPCで趣味として作成した小説の著作権の帰属について、適切なものはどれか。ここで、就業規則等に特段の定めはないものとする。","choices":["A社に帰属する","従業員Bに帰属する","A社とBの共有となる","国に帰属する"],"answer":1,"exp":"職務著作（法人著作）として会社に帰属するのは、「法人の発意に基づき」「職務上」作成した著作物の場合です。業務と無関係に個人が創作したものは、当然その個人に著作権が帰属します。職務著作の成立要件を事例で問う問題は頻出です。"},
{"id":"S109","field":"S","cat":"法務","question":"他社の有名ブランドと紛らわしいロゴを自社商品に付けて販売する行為を規制する法律として、適切なものはどれか。","choices":["特許法","不正競争防止法","労働基準法","製造物責任法"],"answer":1,"exp":"周知な商品表示と混同を生じさせる行為（ブランドのただ乗り）は不正競争防止法が規制します。登録された商標そのものの無断使用なら商標法違反にもなります。「登録の有無」で商標法か不正競争防止法かを判断する視点を持ちましょう。"},
{"id":"S110","field":"S","cat":"法務","question":"A社はシステム開発をB社に委託した。B社の従業員CがA社のオフィスに常駐して開発を行っているが、Cへの作業指示はB社のリーダーが行っている。この契約形態として適切なものはどれか。","choices":["労働者派遣契約","請負契約","出向","雇用契約"],"answer":1,"exp":"作業場所がどこであっても、指揮命令を受託側（B社）が行い、仕事の完成に責任を負うのは請負契約です。もしA社が直接Cに指示すると、派遣契約なしに指揮命令する「偽装請負」となり違法です。指揮命令権の所在が判断ポイントです。"},
{"id":"S111","field":"S","cat":"法務","question":"通販サイトを運営するA社が、商品購入者のメールアドレスに広告メールを送る場合の対応として、特定電子メール法に照らして適切なものはどれか。","choices":["同意の有無にかかわらず、全ての顧客に広告メールを送ってよい","あらかじめ送信に同意した顧客に対してのみ送信し、受信拒否（配信停止）の方法を表示する","受信拒否の連絡があった顧客にも送り続けてよい","送信者の氏名や連絡先は表示しなくてよい"],"answer":1,"exp":"特定電子メール法は広告宣伝メールについて、①事前同意（オプトイン）、②送信者情報の表示、③配信停止手段の提供と拒否者への送信禁止を義務付けています。「オプトイン規制」という言葉とセットで覚えましょう。"},
{"id":"S112","field":"S","cat":"法務","question":"大手企業A社が、取引上の力関係を利用して、下請の中小企業B社に対して一方的に代金を減額した。この行為を規制する法律の組合せとして、最も適切なものはどれか。","choices":["著作権法、特許法","独占禁止法、中小受託取引適正化法","労働基準法、労働者派遣法","景品表示法、特定商取引法"],"answer":1,"exp":"優越的地位の濫用は独占禁止法が禁止し、委託取引における代金の減額・支払遅延などは中小受託取引適正化法（旧下請法）が規制します。シラバスVer.6.5で「下請法」から名称変更された点も要チェックです。"},
{"id":"S113","field":"S","cat":"法務","question":"実際よりも著しく優良であるかのように商品を宣伝する「優良誤認表示」を禁止している法律はどれか。","choices":["景品表示法","資金決済法","個人情報保護法","公益通報者保護法"],"answer":0,"exp":"景品表示法は、優良誤認表示（品質を偽る）・有利誤認表示（価格などの取引条件を偽る）や過大な景品類を規制し、消費者の合理的な選択を守ります。広告であることを隠すステルスマーケティングも同法の規制対象です。"},
{"id":"S114","field":"S","cat":"経営戦略マネジメント","question":"自社の経営資源を、経済価値・希少性・模倣困難性・組織の4つの観点で評価し、持続的な競争優位の源泉となるかを分析する手法はどれか。","choices":["SWOT分析","VRIO分析","3C分析","RFM分析"],"answer":1,"exp":"VRIOはValue（経済価値）・Rarity（希少性）・Imitability（模倣困難性）・Organization（組織）の頭文字で、経営資源の競争優位性を内部分析する枠組みです。SWOTより資源の「質」に踏み込む分析と覚えましょう。"},
{"id":"S115","field":"S","cat":"経営戦略マネジメント","question":"ある製品の売上が急成長し、競合他社の参入も増えている。プロダクトライフサイクルにおけるこの時期の戦略として、最も適切なものはどれか。","choices":["生産を縮小し、撤退の時期を検討する","ブランドの確立とシェア拡大に投資する","研究開発を始める","在庫を全て処分する"],"answer":1,"exp":"売上が急伸し競合が増えるのは成長期の特徴です。この時期は市場拡大に乗ってシェアを獲得することが重要で、広告・生産能力への投資を強化します。導入期=認知獲得、成熟期=シェア維持と差別化、衰退期=撤退判断、と時期ごとの定石を整理しましょう。"},
{"id":"S116","field":"S","cat":"経営戦略マネジメント","question":"競争の激しい既存市場を避け、これまでにない価値を提供することで競争のない新しい市場を創造する戦略はどれか。","choices":["コストリーダーシップ戦略","ブルーオーシャン戦略","同質化戦略","ニッチ戦略"],"answer":1,"exp":"ブルーオーシャン戦略は、血みどろの競争市場（レッドオーシャン）を離れ、新価値の提供で無競争の市場を切り開く戦略です。既存市場の隙間を狙うニッチ戦略との違い（隙間か、新市場の創造か）を意識しましょう。"},
{"id":"S117","field":"S","cat":"経営戦略マネジメント","question":"小売業A社は、メーカーや卸売業者と販売実績・在庫情報をリアルタイムで共有し、原材料の調達から店頭販売までの流れ全体を最適化して、欠品と過剰在庫の削減を実現した。この取組に該当するものはどれか。","choices":["SCM","CRM","ERP","ナレッジマネジメント"],"answer":0,"exp":"SCM（サプライチェーンマネジメント）は、企業の枠を越えて供給の連鎖全体で情報を共有し、リードタイム短縮や在庫最適化を図る取組です。顧客との関係管理はCRM、社内資源の統合管理はERPという使い分けを事例で判断できるようにしましょう。"},
{"id":"S118","field":"S","cat":"経営戦略マネジメント","question":"ベテラン従業員が個人的に蓄積してきた営業ノウハウを文書化・データベース化し、組織全体で共有・活用できるようにする取組はどれか。","choices":["ナレッジマネジメント","アウトソーシング","ダイバーシティマネジメント","ファシリティマネジメント"],"answer":0,"exp":"ナレッジマネジメントは、個人の暗黙知を形式知に変換して組織の知識として共有・活用する経営手法です。暗黙知⇔形式知の変換プロセスを整理したSECIモデルとセットで押さえましょう。"},
{"id":"S119","field":"S","cat":"経営戦略マネジメント","question":"バリューチェーン分析の説明として、適切なものはどれか。","choices":["企業の活動を、購買・製造・出荷・販売・サービスなどの主活動と人事・技術開発などの支援活動に分け、どの活動で付加価値が生み出されているかを分析する","市場を成長率とシェアの2軸で分析する","顧客を購買履歴で分類する","競合他社の財務諸表を分析する"],"answer":0,"exp":"バリューチェーン（価値連鎖）分析は、企業活動を価値を生む一連の活動として分解し、強み・弱みやコストの発生箇所を特定する手法です。どの工程で差別化できるかを見極め、戦略立案につなげます。"},
{"id":"S120","field":"S","cat":"経営戦略マネジメント","question":"テレビCMや雑誌広告で消費者の購買意欲を直接高め、消費者からの指名買いによって小売店に商品を置いてもらう販売促進戦略はどれか。","choices":["プッシュ戦略","プル戦略","ニッチ戦略","同質化戦略"],"answer":1,"exp":"プル戦略は広告などで消費者の需要を「引っ張る」戦略です。一方、販売店への営業強化やリベートで製品を市場へ「押し出す」のがプッシュ戦略。働きかける相手が消費者か販売店かで区別します。"},
{"id":"S121","field":"S","cat":"経営戦略マネジメント","question":"経営陣が自社の株式を買い取って独立するMBOを実施する主な目的として、最も適切なものはどれか。","choices":["株式市場からの短期的な業績圧力を受けずに、長期視点で経営改革を行う","従業員の給与を削減する","会社を清算する","新株を発行して資金を調達する"],"answer":0,"exp":"MBO（マネジメントバイアウト）により株式を非公開化すると、株主の短期的な利益要求から離れて抜本的な改革に取り組めます。敵対的買収への防衛策としても使われます。目標管理制度のMBOと同じ略語なので文脈で判断しましょう。"},
{"id":"S122","field":"S","cat":"技術戦略マネジメント","question":"新規事業の立上げにおいて、必要最小限の機能をもつ試作品（MVP）を素早く作って市場に出し、顧客の反応を計測して学び、製品の改良や方向転換（ピボット）を繰り返す手法はどれか。","choices":["ウォータフォール開発","リーンスタートアップ","ベンチマーキング","シックスシグマ"],"answer":1,"exp":"リーンスタートアップは「構築→計測→学習」のループを高速で回し、無駄な作り込みを避けながら市場に受け入れられる製品を探索する起業・新規事業の手法です。MVP（Minimum Viable Product）とピボットがキーワードです。"},
{"id":"S123","field":"S","cat":"技術戦略マネジメント","question":"社内外のエンジニアやデザイナーがチームを組み、限られた時間で集中的にアイディアの具体化やプロトタイプ開発を行い、成果を競うイベントはどれか。","choices":["ハッカソン","キャズム","デルファイ法","ワークショップ"],"answer":0,"exp":"ハッカソンはハック＋マラソンの造語で、短期集中型の開発イベントです。オープンイノベーションの手段として、新しい発想の発掘や人材交流に活用されています。"},
{"id":"S124","field":"S","cat":"技術戦略マネジメント","question":"地図サービスを提供するA社が、自社の地図表示機能をAPIとして外部に公開したところ、飲食店検索や配車サービスなど多くの他社サービスに組み込まれ、新たな収益と市場が生まれた。この現象を表す用語はどれか。","choices":["デジタルディバイド","APIエコノミー","シャドーIT","カニバリゼーション"],"answer":1,"exp":"APIエコノミーは、自社機能のAPI公開を通じて他社サービスとの連携が広がり、単独では実現できない価値や経済圏が生まれることです。地図・決済・認証APIなどが代表例です。"},
{"id":"S125","field":"S","cat":"技術戦略マネジメント","question":"ビジネスモデルキャンバスの説明として、適切なものはどれか。","choices":["顧客セグメント、価値提案、収益の流れなど9つの要素で、ビジネスモデルの全体像を1枚の図に整理する手法","プロジェクトの作業を階層的に分解する手法","財務諸表を分析する手法","組織図を作成する手法"],"answer":0,"exp":"ビジネスモデルキャンバスは、9つのブロック（顧客セグメント・価値提案・チャネル・顧客との関係・収益の流れ・リソース・主要活動・パートナー・コスト構造）で事業の仕組みを俯瞰する図です。新規事業の設計や見直しに使われます。"},
{"id":"S126","field":"S","cat":"ビジネスインダストリ","question":"食品メーカーA社は、原材料の産地から製造・流通・販売までの履歴を記録し、問題発生時に追跡できる仕組みを構築した。この仕組みを表す用語はどれか。","choices":["トレーサビリティ","アウトソーシング","フランチャイズ","リコール"],"answer":0,"exp":"トレーサビリティ（追跡可能性）は、生産から消費までの履歴を追跡できる仕組みです。食品の安全問題や製品不具合の際に、原因究明と迅速な回収を可能にします。RFIDやQRコードが実現手段として使われます。"},
{"id":"S127","field":"S","cat":"ビジネスインダストリ","question":"営業部門において、商談の進捗状況、訪問履歴、案件の受注確度などを一元管理し、営業活動の効率化と組織的な営業力強化を図るシステムはどれか。","choices":["SFA","POS","EDI","HEMS"],"answer":0,"exp":"SFA（Sales Force Automation：営業支援システム）は営業活動の情報を可視化・共有するシステムです。顧客情報全般を管理するCRMと連携して使われます。POSは販売時点情報管理、EDIは企業間の電子データ交換です。"},
{"id":"S128","field":"S","cat":"ビジネスインダストリ","question":"製造業A社と部品供給元B社は、受発注や請求のデータを標準的な形式で電子的に交換する仕組みを導入し、紙の伝票や手入力をなくした。この仕組みはどれか。","choices":["EDI","SNS","BBS","VR"],"answer":0,"exp":"EDI（Electronic Data Interchange）は企業間の商取引データを標準形式で電子交換する仕組みで、入力ミスの削減と業務のスピードアップを実現します。ネット通販のような消費者向け取引（EC）と区別しましょう。"},
{"id":"S129","field":"S","cat":"ビジネスインダストリ","question":"実店舗をもつ小売業が、アプリで電子クーポンを配信して店舗への来店を促す施策はどれに該当するか。","choices":["O2O","BPR","CDN","OJT"],"answer":0,"exp":"O2O（Online to Offline）は、オンライン（アプリ・SNS）からオフライン（実店舗）へ顧客を誘導する施策です。さらに進んで、ネットと店舗の境界をなくし一体の体験を提供する考え方はOMOと呼ばれます。"},
{"id":"S130","field":"S","cat":"ビジネスインダストリ","question":"暗号資産（仮想通貨）に関する記述として、適切なものはどれか。","choices":["国が価値を保証する法定通貨である","ブロックチェーン技術などを基盤とし、インターネット上で取引されるデジタルな資産であり、価格が大きく変動することがある","現金と違って盗難や流出のリスクは一切ない","日本では取引が禁止されている"],"answer":1,"exp":"暗号資産はブロックチェーンを基盤とするデジタル資産で、法定通貨のような国家の価値保証はなく、価格変動が大きいのが特徴です。交換業者は資金決済法に基づく登録制で、流出事件も起きているためリスク理解が重要です。"},
{"id":"S131","field":"S","cat":"ビジネスインダストリ","question":"自動車に通信機能を搭載し、走行データを保険会社が取得して運転の安全度に応じて保険料を変動させるサービスが登場している。このように自動車と通信を組み合わせて情報サービスを提供する仕組みを表す用語はどれか。","choices":["テレマティクス","メタバース","デジタルサイネージ","ドローン"],"answer":0,"exp":"テレマティクスは通信（テレコミュニケーション）と情報科学（インフォマティクス）の造語で、車両と通信を組み合わせたサービスの総称です。走行データ連動型保険（テレマティクス保険）やカーナビの渋滞情報などが例です。"},
{"id":"S132","field":"S","cat":"システム戦略","question":"EA（エンタープライズアーキテクチャ）の目的として、最も適切なものはどれか。","choices":["組織全体の業務とシステムの現状と理想像を体系的に整理し、全体最適の観点から改善を進める","個々の部門が自由にシステムを導入できるようにする","プログラムの実行速度を高める","サーバの設置場所を決める"],"answer":0,"exp":"EAは、業務・データ・アプリケーション・技術の4つの体系で組織全体を整理し、「あるべき姿」への移行計画を立てる手法です。部分最適の寄せ集めではなく全体最適を目指すのがポイントです。"},
{"id":"S133","field":"S","cat":"システム戦略","question":"経理部門の請求書処理業務について、現状の業務の流れを図で可視化し、ボトルネックを特定して改善し、その効果を測定して更に改善を続ける取組はどれか。","choices":["BPM","BYOD","CGM","LPWA"],"answer":0,"exp":"BPM（ビジネスプロセスマネジメント）は、業務プロセスの可視化（モデル化）→実行→測定→改善を継続的に回す管理手法です。一度きりの抜本的再設計であるBPRとの違い（継続的か抜本的か）が問われます。"},
{"id":"S134","field":"S","cat":"システム戦略","question":"社内のスケジュール共有、会議室予約、文書の共同編集、電子会議などの機能によって、組織内の協働作業を支援するソフトウェアはどれか。","choices":["グループウェア","ファームウェア","シェアウェア","ミドルウェア"],"answer":0,"exp":"グループウェアは組織内のコミュニケーションと情報共有を支援するソフトウェアです。ファームウェアは機器内蔵の制御ソフト、ミドルウェアはOSとアプリの中間で共通機能を提供するソフトと、「〜ウェア」の区別を整理しておきましょう。"},
{"id":"S135","field":"S","cat":"システム戦略","question":"個人が自らのパーソナルデータを信頼できる事業者に預け、本人の同意した範囲で企業に提供して、その対価として便益を受け取る仕組みはどれか。","choices":["情報銀行","データウェアハウス","エスクローサービス","オンラインストレージ"],"answer":0,"exp":"情報銀行は、個人のデータを本人に代わって管理し、本人の指示や事前同意の範囲で第三者に提供する仕組みです。データ利活用と個人の権利保護を両立させる日本発の制度として、シラバスに掲載されています。"},
{"id":"S136","field":"S","cat":"システム企画","question":"販売管理システムの要件定義において、「繁忙期でも注文登録の応答時間を2秒以内とする」という要求はどれに分類されるか。","choices":["機能要件","非機能要件","業務要件","移行要件"],"answer":1,"exp":"応答時間・処理能力・稼働率・セキュリティなど「機能そのもの以外」の品質・制約に関する要求が非機能要件です。「注文を登録できる」なら機能要件です。非機能要件の軽視は稼働後のトラブルにつながるため、要件定義段階での明確化が重要です。"},
{"id":"S137","field":"S","cat":"システム企画","question":"システム開発の契約において、発注者が作業時間に応じた報酬を支払い、受託者は仕事の完成義務を負わない契約形態はどれか。","choices":["請負契約","準委任契約","売買契約","賃貸借契約"],"answer":1,"exp":"準委任契約は業務の遂行自体（善良な管理者の注意義務）を約束する契約で、完成責任はありません。要件定義やコンサルティングの工程で使われます。一方、請負契約は仕事の完成に責任を負い、開発・製造の工程で使われます。工程による契約タイプの使い分けが頻出です。"},
{"id":"S138","field":"S","cat":"システム企画","question":"システムの調達において、RFIを発行する目的として、最も適切なものはどれか。","choices":["ベンダーと契約を締結するため","市場の製品・技術・実績などの情報を収集し、調達の実現性や選択肢を把握するため","システムの検収を行うため","開発の進捗を報告させるため"],"answer":1,"exp":"RFI（情報提供依頼書）は、RFP（提案依頼書）を出す前の情報収集段階で発行します。どんな製品・サービス・技術があるかを把握し、調達方針や候補ベンダーの絞り込みに役立てます。"},
{"id":"S139","field":"S","cat":"システム企画","question":"ITサービスの投資対効果を評価する指標のうち、システムの導入から廃棄までにかかる総費用を表すものはどれか。","choices":["TCO","ROE","KPI","SLA"],"answer":0,"exp":"TCO（Total Cost of Ownership：総所有費用）は、初期費用（イニシャルコスト）に加えて運用・保守・教育などの継続費用（ランニングコスト）まで含めた総額です。導入判断では初期費用だけでなくTCOで比較することが重要です。"},
{"id":"M56","field":"M","cat":"システム開発技術","question":"入力欄に「1〜100の整数」を受け付けるプログラムのテストにおいて、有効な値の代表として50、無効な値の代表として0と101を選んでテストした。このテスト設計の考え方はどれか。","choices":["同値分割","ホワイトボックステスト","リグレッションテスト","負荷テスト"],"answer":0,"exp":"同値分割は、同じ結果になるはずの入力の集まり（有効同値クラス：1〜100、無効同値クラス：0以下と101以上）から代表値を選んでテストする、ブラックボックステストの設計技法です。境界のすぐ内外（0,1,100,101）を狙う境界値分析とセットで覚えましょう。"},
{"id":"M57","field":"M","cat":"システム開発技術","question":"稼働中の販売管理システムについて、消費税率の変更に対応するためのプログラム修正を行った。この作業はどれに分類されるか。","choices":["要件定義","ソフトウェア保守","受入れテスト","システム化計画"],"answer":1,"exp":"稼働後のシステムに対する修正・変更はすべてソフトウェア保守です。バグ修正（是正保守）だけでなく、法改正対応（適応保守）や機能改善（完全化保守）も含まれます。「稼働後かどうか」が判断基準です。"},
{"id":"M58","field":"M","cat":"システム開発技術","question":"ソフトウェアの品質特性のうち、「保守性」の説明として適切なものはどれか。","choices":["必要な機能が正しく動作する度合い","障害の起こりにくさの度合い","プログラムの修正や変更のしやすさの度合い","他の環境への移しやすさの度合い"],"answer":2,"exp":"保守性は修正・変更のしやすさです。可読性の高いコードやモジュール化された構造は保守性を高めます。機能適合性・信頼性・移植性など、他の品質特性との対応も整理しておきましょう。"},
{"id":"M59","field":"M","cat":"システム開発技術","question":"開発規模の見積りにおいて、過去に開発した類似システムの実績データを基にして、今回の開発工数を見積もる方法はどれか。","choices":["ファンクションポイント法","類推見積法","プログラムステップ法","デルファイ法"],"answer":1,"exp":"類推見積法は過去の類似プロジェクトとの比較で見積もる方法で、企画段階など情報が少ない時期に有効です。機能の数から算出するのはファンクションポイント法、コード行数から算出するのはプログラムステップ（LOC）法です。"},
{"id":"M60","field":"M","cat":"システム開発技術","question":"設計書のレビューにおいて、レビュー対象の作成者が説明役となり、参加者が質問しながら欠陥を検出していく形式のレビューはどれか。","choices":["ウォークスルー","ペネトレーションテスト","ブレーンストーミング","スタンドアップミーティング"],"answer":0,"exp":"ウォークスルーは作成者主導で成果物を順に説明し、参加者と一緒に欠陥を見つけるレビュー形式です。第三者の進行役（モデレーター）を置いてより公式に行う形式はインスペクションと呼ばれます。"},
{"id":"M61","field":"M","cat":"システム開発技術","question":"受入れテストに関する記述として、適切なものはどれか。","choices":["開発ベンダーが単独で実施し、発注者は関与しない","発注者が主体となり、実際の業務の流れに沿ってシステムが要求どおりに動作するかを確認する","プログラムの内部構造を網羅的に検証する","開発の最初の工程で実施する"],"answer":1,"exp":"受入れテストは納品物が契約・要求どおりかを発注者側が確認する最終テストで、これに合格すると検収となります。運用部門・利用部門が実業務のシナリオで検証することが重要です。"},
{"id":"M62","field":"M","cat":"ソフトウェア開発管理技術","question":"スクラム開発において、スプリントの最後に完成した動くソフトウェアをステークホルダに見せて、フィードバックを得るイベントはどれか。","choices":["デイリースクラム","スプリントレビュー","スプリントレトロスペクティブ","スプリントプランニング"],"answer":1,"exp":"スプリントレビューは成果物（インクリメント）をデモしてフィードバックを得る場です。デイリースクラムは毎日の短い状況共有、レトロスペクティブは仕事の進め方の振り返り、プランニングはスプリント計画の立案。4イベントの目的の違いが頻出です。"},
{"id":"M63","field":"M","cat":"ソフトウェア開発管理技術","question":"スクラムにおけるプロダクトバックログの説明として、適切なものはどれか。","choices":["プロダクトに必要な機能や要求を優先順位を付けて並べた一覧であり、プロダクトオーナーが管理する","開発者の勤務時間の記録","完成したソフトウェアのバグ一覧","サーバの障害履歴"],"answer":0,"exp":"プロダクトバックログは「作りたいものリスト」で、価値の高い順に並べられ、常に見直されます。優先順位の決定はプロダクトオーナーの責任です。スプリントで実施する分を抜き出したものがスプリントバックログです。"},
{"id":"M64","field":"M","cat":"ソフトウェア開発管理技術","question":"開発者がコードをリポジトリに登録するたびに、自動的にビルドとテストが実行され、問題があれば即座に通知される仕組みを導入した。この実践はどれか。","choices":["継続的インテグレーション","リバースエンジニアリング","ウォークスルー","ファシリティマネジメント"],"answer":0,"exp":"CI（継続的インテグレーション）は、頻繁な統合と自動ビルド・自動テストで不具合を早期発見する実践です。リリースまでの流れを自動化するCD（継続的デリバリー）と合わせてCI/CDと呼ばれ、DevOpsの中核です。"},
{"id":"M65","field":"M","cat":"ソフトウェア開発管理技術","question":"ソフトウェア開発の発注者と受注者の間で、「要件定義」「設計」などの用語の意味や作業範囲の認識がずれないように、開発プロセスの共通の物差しとして参照されるガイドラインはどれか。","choices":["共通フレーム","ITIL","PMBOK","JIS Q 15001"],"answer":0,"exp":"共通フレーム（SLCP-JCF）は、ソフトウェアライフサイクルの工程・作業・用語を定義した日本のガイドラインで、取引の透明化と認識合わせに使われます。ITILは運用、PMBOKはプロジェクトマネジメントの体系です。"},
{"id":"M66","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクトの進行中に、当初の合意範囲を超える機能追加の要望が次々と寄せられ、スケジュールとコストが膨らみ始めた。プロジェクトマネージャが取るべき対応として、最も適切なものはどれか。","choices":["要望はすべて無条件で受け入れる","変更管理の手続きに従い、影響を評価した上でステークホルダと調整して採否を決定する","要望はすべて無視する","プロジェクトを直ちに中止する"],"answer":1,"exp":"スコープが際限なく膨らむ現象をスコープクリープといいます。対策は変更管理プロセスの徹底：変更要求を文書化→スケジュール・コスト・品質への影響を評価→関係者で採否を判断、という手順を踏むことです。"},
{"id":"M67","field":"M","cat":"プロジェクトマネジメント","question":"リスクの定性的分析において、リスクの優先順位付けに用いる2つの要素の組合せとして、最も適切なものはどれか。","choices":["発生確率と影響度","開発費用と人員数","作業時間と休憩時間","売上高と利益率"],"answer":0,"exp":"リスクは「起こりやすさ（発生確率）×起きたときの痛さ（影響度）」で評価し、両方が高いものから優先的に対応します。これを整理した表を発生確率・影響度マトリックスといいます。"},
{"id":"M68","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクトの各作業について、A（3日）→B（4日）→D（3日）の経路と、A（3日）→C（6日）→D（3日）の経路がある。作業DはBとCの両方の完了後に開始できる。このプロジェクトのクリティカルパスと最短所要日数の組合せはどれか。","choices":["A→B→D、10日","A→C→D、12日","A→B→D、12日","A→C→D、10日"],"answer":1,"exp":"経路ごとの合計は、A→B→D＝3＋4＋3＝10日、A→C→D＝3＋6＋3＝12日。所要日数が最も長い経路がクリティカルパスなので、A→C→Dの12日です。「長い方が全体の所要日数を決める」ことを忘れずに。"},
{"id":"M69","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクトのコミュニケーションマネジメントの活動として、最も適切なものはどれか。","choices":["ステークホルダごとに必要な情報・報告の頻度・伝達手段を計画し、進捗報告会や情報共有の仕組みを運営する","メンバーの給与を計算する","プログラムの単体テストを実施する","サーバ機器を調達する"],"answer":0,"exp":"コミュニケーションマネジメントは、誰に・何を・いつ・どんな手段で伝えるかを計画・実行する活動です。関係者間の認識ずれや情報遅延はプロジェクト失敗の主要因のため、報告ルールの設計が重要です。"},
{"id":"M70","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクト完了時に、うまくいった点や問題点などの経験を文書化して組織に蓄積する主な目的はどれか。","choices":["今後のプロジェクトで同じ失敗を繰り返さず、成功事例を再利用するため","メンバーの人事評価を下げるため","契約金額を増額するため","プロジェクトの記録を廃棄するため"],"answer":0,"exp":"完了時に得られた教訓（レッスンズラーンド）を文書化して共有することで、組織のプロジェクトマネジメント能力が向上します。プロジェクトの有期性ゆえに、経験を組織資産として残すことが重要です。"},
{"id":"M71","field":"M","cat":"プロジェクトマネジメント","question":"進捗の遅れを取り戻すために、クリティカルパス上の作業に要員を追加投入して期間の短縮を図る技法はどれか。","choices":["クラッシング","ファストトラッキング","スコープクリープ","ローリングウェーブ計画"],"answer":0,"exp":"クラッシングは資源（要員・費用）の追加投入による期間短縮です。一方、順番に行う予定の作業を並行実施して短縮するのがファストトラッキング。どちらもクリティカルパス上の作業に適用しないと全体は縮まりません。"},
{"id":"M72","field":"M","cat":"サービスマネジメント","question":"SLAに記載する項目の例として、最も適切なものはどれか。","choices":["サービスの月間稼働率99.5％以上、障害時の復旧目標時間4時間以内","開発担当者の氏名と住所","プログラムのソースコード","会社の組織図"],"answer":0,"exp":"SLAにはサービスの範囲と品質目標を具体的な数値で定めます。稼働率・復旧時間・サポート受付時間・応答時間などが代表例です。数値で合意するからこそ、達成状況を客観的に評価（SLM）できます。"},
{"id":"M73","field":"M","cat":"サービスマネジメント","question":"サービスデスクの一次対応で解決できない技術的な問合せを、専門知識をもつ二次サポート部門に引き継ぐことを表す用語はどれか。","choices":["エスカレーション","デリゲーション","マイグレーション","インテグレーション"],"answer":0,"exp":"エスカレーションは、上位者や専門部署への引継ぎです。技術的に高度な案件を引き継ぐ機能的エスカレーションと、権限が必要な案件を管理職へ上げる階層的エスカレーションがあります。"},
{"id":"M74","field":"M","cat":"サービスマネジメント","question":"本番稼働中のサーバにセキュリティパッチを適用するに当たり、ITサービスマネジメントの観点から適切な進め方はどれか。","choices":["影響評価や承認の手続きを経ずに、気付いた担当者がすぐに適用する","変更管理のプロセスに従って影響を評価し、承認を得た上で、リリース管理の手順で計画的に適用する","パッチは一切適用しない","利用者に無断で深夜に適用し、記録も残さない"],"answer":1,"exp":"本番環境への変更は、変更管理（影響評価と承認）→リリース及び展開管理（計画的な導入）の手順を踏みます。無断・無計画な変更は障害の主要原因です。セキュリティと安定運用を両立させる定石として覚えましょう。"},
{"id":"M75","field":"M","cat":"サービスマネジメント","question":"データセンターのファシリティマネジメントにおける施策として、適切なものの組合せはどれか。\na 無停電電源装置（UPS）の設置\nb 入退室管理と監視カメラの設置\nc プログラムの単体テスト\nd 空調設備による温度管理","choices":["a、b、d","a、b、c","b、c、d","a、c、d"],"answer":0,"exp":"ファシリティマネジメントは施設・設備環境の整備です。電源対策（UPS・自家発電）、物理的セキュリティ（入退室管理）、空調・耐震などが該当します。cの単体テストは開発活動であり、施設管理ではありません。"},
{"id":"M76","field":"M","cat":"システム監査","question":"システム監査人が、販売システムのアクセス管理状況を検証するために行う行為として、最も適切なものはどれか。","choices":["アクセス権限の設定一覧や付与申請の記録を査閲し、規程どおり運用されているかを確かめる","自らアクセス権限を変更して修正する","監査対象部門の主張をそのまま受け入れて報告する","システムの開発作業を代行する"],"answer":0,"exp":"監査人の役割は独立した立場での点検・評価・助言であり、自ら修正・運用作業を行うことではありません。記録の査閲やインタビューで監査証拠を入手し、事実に基づいて評価します。改善の実施は被監査部門の役割です。"},
{"id":"M77","field":"M","cat":"システム監査","question":"経費精算システムにおいて、申請者自身が承認も行える設定になっていることが監査で発見された。この状況の問題点として、最も適切なものはどれか。","choices":["処理速度が遅くなる","職務分掌が機能しておらず、不正や誤りを牽制できない","画面のデザインが統一されていない","サーバの消費電力が増える"],"answer":1,"exp":"申請と承認を同一人物ができる状態は、内部統制の基本である職務分掌（相互けん制）の欠如です。架空経費の申請などの不正を本人が「承認」できてしまいます。システム上の権限設定で分離を強制することが対策です。"},
{"id":"T136","field":"T","cat":"基礎理論","question":"2進数の1010と0110を加算した結果を2進数で表したものはどれか。","choices":["1100","1110","10000","10100"],"answer":2,"exp":"10進数に直すと10＋6＝16。16は2進数で10000です。\n筆算でも、右の桁から 0+0=0、1+1=10（繰上り）、0+1+繰上り1=10（繰上り）、1+0+繰上り1=10 → 10000。2進数の足し算は「1+1で繰上り」がルールです。"},
{"id":"T137","field":"T","cat":"基礎理論","question":"命題「雨が降っている、かつ、風が強い」が偽となるのはどの場合か。","choices":["雨が降っていて風も強い場合だけ","雨が降っていないか、又は風が強くない場合","雨が降っていない場合だけ","風が強くない場合だけ"],"answer":1,"exp":"AND（かつ）は両方が真のときだけ真です。したがって偽になるのは「少なくとも一方が偽」のとき、つまり「雨でない、または風が強くない」場合です。ANDの否定はORになる（ド・モルガンの法則）ことも合わせて覚えましょう。"},
{"id":"T138","field":"T","cat":"基礎理論","question":"当たりが2本、はずれが8本入ったくじがある。1本引いたとき、当たりを引く確率はいくらか。","choices":["1/2","1/5","1/8","1/10"],"answer":1,"exp":"確率＝当たりの本数÷全体の本数＝2÷10＝1/5。基本の「該当パターン数÷全パターン数」で解けます。ITパスポートの確率は、くじ・サイコロ・カードなど単純な設定がほとんどです。"},
{"id":"T139","field":"T","cat":"基礎理論","question":"標準偏差の説明として、適切なものはどれか。","choices":["データの最大値と最小値の差","データの散らばりの度合いを表す指標であり、値が大きいほどデータは平均から離れて散らばっている","データを小さい順に並べたときの中央の値","最も多く出現する値"],"answer":1,"exp":"標準偏差はデータのばらつきの指標です。平均が同じでも、標準偏差が大きければ値は広く散らばり、小さければ平均近くに集中しています。最大−最小は範囲（レンジ）、中央の値は中央値、最頻の値は最頻値です。"},
{"id":"T140","field":"T","cat":"基礎理論","question":"あるクラス40人のうち、英語が得意な人が25人、数学が得意な人が20人、両方得意な人が10人いる。英語も数学も得意でない人は何人か。","choices":["5人","10人","15人","20人"],"answer":0,"exp":"少なくとも一方が得意な人＝25＋20−10（重複分を引く）＝35人。\n両方とも得意でない人＝40−35＝5人。ベン図を描いて「足して重なりを引く」のが集合問題の定石です。"},
{"id":"T141","field":"T","cat":"基礎理論","question":"文字コードUnicode（UTF-8）の特徴として、最も適切なものはどれか。","choices":["日本語だけを表現できる文字コードである","世界中の多様な言語の文字を一つの体系で扱うことを目的とした文字コードである","数字だけを表現できる","画像データを表現するための規格である"],"answer":1,"exp":"Unicodeは世界の文字を統一的に扱う文字コード体系で、UTF-8はその代表的な符号化方式です。Webページの標準として広く使われています。文字化けは、文字コードの解釈の不一致で起こります。"},
{"id":"T142","field":"T","cat":"AI・生成AI","question":"ECサイトの購買データを用いて、正解ラベルを与えずに顧客を購買傾向の似たグループに自動で分類したい。この目的に適した機械学習の手法はどれか。","choices":["教師あり学習による分類","教師なし学習によるクラスタリング","強化学習","回帰分析による売上予測"],"answer":1,"exp":"正解を与えずにデータの構造からグループを見つけるのは教師なし学習のクラスタリングです。「正解ラベルの有無」が教師あり／なしの判断基準。事例文に「正解を与えず」「自動で分類」とあれば教師なし学習を選びます。"},
{"id":"T143","field":"T","cat":"AI・生成AI","question":"ロボットが歩行動作を獲得する学習において、転ばずに長く歩けたときに高い報酬を与え、試行錯誤を通じて最適な動作を学習させた。この手法はどれか。","choices":["教師あり学習","教師なし学習","強化学習","転移学習"],"answer":2,"exp":"行動の結果に報酬を与え、報酬を最大化する行動を試行錯誤で学ばせるのが強化学習です。「報酬」「試行錯誤」がキーワード。囲碁AIやゲームAI、ロボット制御が代表的な応用例です。"},
{"id":"T144","field":"T","cat":"AI・生成AI","question":"生成AIが回答を作る際に、社内文書などの外部データベースを検索して関連情報を取得し、その内容を根拠として回答を生成させる技術はどれか。","choices":["RAG（検索拡張生成）","OCR","RPA","CAPTCHA"],"answer":0,"exp":"RAG（Retrieval-Augmented Generation）は、検索で取得した最新・固有の情報を生成AIに与えて回答させる技術です。学習していない社内情報にも答えられ、ハルシネーションの抑制にも役立つため、企業のAI活用で広く使われています。"},
{"id":"T145","field":"T","cat":"AI・生成AI","question":"汎用の大規模言語モデルを、自社のコールセンターの応対記録で追加学習させ、自社業務に特化した応答ができるように調整した。この手法はどれか。","choices":["ファインチューニング","データクレンジング","正規化","デフラグメンテーション"],"answer":0,"exp":"ファインチューニングは、事前学習済みモデルに特定分野のデータで追加学習を行い、目的のタスクに適応させる手法です。ゼロから学習するより少ないデータと計算資源で専門化できます。"},
{"id":"T146","field":"T","cat":"AI・生成AI","question":"従業員が業務で生成AIサービスを利用する際の社内ルールとして、最も適切なものはどれか。","choices":["顧客の個人情報を自由に入力してよい","機密情報・個人情報の入力を禁止し、出力内容は事実確認と著作権面の確認をしてから利用する","AIの出力はそのまま社外文書として使用する","利用状況を会社に隠して各自の判断で使う"],"answer":1,"exp":"生成AIの業務利用では、①入力段階：機密・個人情報を学習に使われるリスクへの対策、②出力段階：ハルシネーションの事実確認と著作権侵害の確認、③組織として利用ルールを定めて共有、が基本です。禁止一辺倒でなくルール化して活用する方向が主流です。"},
{"id":"T147","field":"T","cat":"アルゴリズムとプログラミング","question":"次の手続を実行したとき、出力されるxの値はどれか。\n\n① x に 10 を代入する\n② y に 3 を代入する\n③ x が y より大きい間、次を繰り返す：「x から y を引いた値を x に代入する」\n④ x の値を出力する","choices":["1","3","4","7"],"answer":0,"exp":"トレースします。x=10, y=3。\n1回目：x=10−3=7（7>3なので継続）\n2回目：x=7−3=4（4>3なので継続）\n3回目：x=4−3=1（1>3でないので終了）→ 出力は1。\n条件を満たす「間」繰り返す点に注意して、1回ずつ値を書き出すのが確実です。"},
{"id":"T148","field":"T","cat":"アルゴリズムとプログラミング","question":"整列済みの1,000件のデータから2分探索法で目的のデータを探すとき、比較回数は最大でおよそ何回か。","choices":["10回","100回","500回","1,000回"],"answer":0,"exp":"2分探索は1回の比較で範囲が半分になるため、最大比較回数は「2の何乗で件数を超えるか」です。2の10乗＝1,024≧1,000なので約10回。線形探索なら最大1,000回ですから、圧倒的に高速です。"},
{"id":"T149","field":"T","cat":"アルゴリズムとプログラミング","question":"プリンタへの印刷指示が、指示した順番どおりに処理される仕組みに使われているデータ構造はどれか。","choices":["スタック","キュー","木構造","ハッシュ表"],"answer":1,"exp":"先に指示したものから順に処理されるのはFIFO（先入れ先出し）＝キューです。印刷スプールや通信の待ち行列で使われます。直前の操作を取り消す「元に戻す（Undo）」機能は後入れ先出しのスタックが使われる、という対比も頻出です。"},
{"id":"T150","field":"T","cat":"アルゴリズムとプログラミング","question":"プログラムにおける関数（サブルーチン）を利用する利点として、最も適切なものはどれか。","choices":["同じ処理を1か所にまとめることで、プログラムの重複を減らし、修正箇所を局所化できる","プログラムの実行が必ず速くなる","変数を使う必要がなくなる","テストが不要になる"],"answer":0,"exp":"関数は処理のまとまりに名前を付けて再利用する仕組みです。同じ処理のコピーが散らばらないため、可読性と保守性が向上します。呼び出し時に渡す値が引数、返ってくる値が戻り値です。"},
{"id":"T151","field":"T","cat":"アルゴリズムとプログラミング","question":"隣り合う要素の大小を比較して交換する操作を繰り返し、データを整列させるアルゴリズムはどれか。","choices":["バブルソート","2分探索","線形探索","ハッシュ法"],"answer":0,"exp":"バブルソートは隣同士の比較・交換を繰り返す最も基本的な整列法で、泡（バブル）が浮かぶように大きい値が端へ移動していきます。単純ですがデータ量が多いと遅く、高速な手法にはクイックソートなどがあります。"},
{"id":"T152","field":"T","cat":"コンピュータ構成要素","question":"クロック周波数が同じCPUで、コア数が2から4に増えた場合の効果として、最も適切なものはどれか。","choices":["1つの処理の実行速度が必ず2倍になる","複数の処理を同時に実行しやすくなり、並列処理の性能向上が期待できる","消費電力が必ず半分になる","記憶容量が2倍になる"],"answer":1,"exp":"コアはCPU内の処理ユニットで、増えるほど同時並行の処理に強くなります。ただし1つの処理（シングルスレッド）自体が速くなるわけではなく、並列化できる処理で効果を発揮します。"},
{"id":"T153","field":"T","cat":"コンピュータ構成要素","question":"PCの動作が遅いため、メモリ（主記憶）を8Gバイトから16Gバイトに増設した。この対策で改善が期待できる状況として、最も適切なものはどれか。","choices":["インターネット回線の速度が遅い","複数のアプリケーションを同時に起動するとメモリ不足になり、動作が極端に遅くなる","ディスプレイの解像度が低い","スピーカーの音質が悪い"],"answer":1,"exp":"主記憶が不足すると、OSは補助記憶を主記憶の代わりに使う（仮想記憶のスワップ）ため動作が急激に遅くなります。メモリ増設はこの状況に有効です。回線速度・解像度・音質はメモリ容量とは無関係です。"},
{"id":"T154","field":"T","cat":"コンピュータ構成要素","question":"USB Type-Cに関する記述として、適切なものはどれか。","choices":["コネクタに上下の区別があり、向きを確認して挿す必要がある","上下の区別がないコネクタで、データ転送のほか映像出力や大きな電力の供給（USB PD）にも対応できる","無線でデータを転送する規格である","音声専用の端子である"],"answer":1,"exp":"USB Type-Cはリバーシブル（上下どちらでも挿せる）コネクタで、規格の組合せによりデータ転送・映像出力・USB PDによる急速充電まで1本で対応できます。ノートPCの充電端子としても普及しています。"},
{"id":"T155","field":"T","cat":"コンピュータ構成要素","question":"キャッシュメモリを搭載する目的として、適切なものはどれか。","choices":["補助記憶の容量を増やすため","CPUと主記憶の速度差によるCPUの待ち時間を減らし、処理を高速化するため","電源断に備えてデータを保存するため","ディスプレイの表示色を増やすため"],"answer":1,"exp":"CPUは主記憶よりはるかに高速なため、そのまま読み書きすると待ち時間が生じます。使用頻度の高いデータを高速なキャッシュメモリに置くことで待ちを減らします。容量の階層（レジスタ＜キャッシュ＜主記憶＜補助記憶）も再確認を。"},
{"id":"T156","field":"T","cat":"システム構成要素","question":"Webシステムを、画面表示を担当するプレゼンテーション層、業務処理を担当するアプリケーション層、データ管理を担当するデータ層に分けて構成する方式はどれか。","choices":["3層クライアントサーバシステム","ピアツーピアシステム","スタンドアロンシステム","デュアルシステム"],"answer":0,"exp":"3層クライアントサーバは、役割を3つの層に分離した構成です。層ごとに変更・拡張ができるため保守性・拡張性が高く、Webシステムの標準的な構成となっています。"},
{"id":"T157","field":"T","cat":"システム構成要素","question":"2台のハードディスクに同じデータを同時に書き込み、1台が故障してもデータを失わないようにするRAIDの方式はどれか。","choices":["RAID0（ストライピング）","RAID1（ミラーリング）","デフラグメンテーション","スワッピング"],"answer":1,"exp":"RAID1（ミラーリング）は2台に同じ内容を書き込む冗長化で、耐障害性が向上します（容量効率は半分）。RAID0（ストライピング）は複数台に分散書き込みして高速化する方式で、冗長性はありません。目的（速度か安全か）で使い分けます。"},
{"id":"T158","field":"T","cat":"システム構成要素","question":"社内の10台の物理サーバを仮想化技術で3台の物理サーバに集約した場合に期待できる効果として、最も適切なものはどれか。","choices":["ソフトウェアのバグがなくなる","サーバ購入費・設置スペース・消費電力の削減と、リソースの柔軟な割当てができる","ネットワークが不要になる","データのバックアップが不要になる"],"answer":1,"exp":"サーバ仮想化の主な利点は、ハードウェアの集約によるコスト・電力・スペースの削減、リソース配分の柔軟性、仮想マシン単位での複製・移行のしやすさです。バグやバックアップの必要性がなくなるわけではありません。"},
{"id":"T159","field":"T","cat":"システム構成要素","question":"アクセスが集中するWebサイトで、複数のWebサーバに処理を振り分けて1台当たりの負担を軽減する仕組みはどれか。","choices":["負荷分散","ミラーリング","デフラグメンテーション","ストリーミング"],"answer":0,"exp":"負荷分散（ロードバランシング）は、専用装置（ロードバランサ）などがリクエストを複数サーバに振り分ける仕組みです。性能向上に加え、一部サーバの故障時にも他のサーバでサービスを継続できる利点があります。"},
{"id":"T160","field":"T","cat":"ソフトウェア","question":"毎週日曜にフルバックアップ、月〜土曜は前日からの変更分だけを保存する増分バックアップを取得している。水曜日の業務終了後に障害が発生した場合、復旧に必要なバックアップの組合せはどれか。","choices":["水曜の増分バックアップだけ","日曜のフルバックアップだけ","日曜のフルバックアップと、月・火・水曜の増分バックアップ","月・火・水曜の増分バックアップだけ"],"answer":2,"exp":"増分バックアップは「前回のバックアップ以降の変更分」だけを保存するため、復旧にはフル＋その後の全ての増分が必要です。差分バックアップ（フル以降の変更を毎回全部保存）なら、フル＋最新の差分1つで復旧できます。両方式の違いが頻出です。"},
{"id":"T161","field":"T","cat":"ソフトウェア","question":"表計算ソフトで、セルA1〜A10の値のうち70以上のセルの個数を数えたい。使用する関数として適切なものはどれか。","choices":["合計を求める関数（SUM）","条件付きでセルを数える関数（COUNTIF）","平均を求める関数（AVERAGE）","最大値を求める関数（MAX）"],"answer":1,"exp":"条件に合うセルの「個数」を数えるのは条件付き個数（COUNTIF）です。条件付きの「合計」ならSUMIF。何を求めたいか（個数・合計・平均）と、条件の有無で関数を選び分けます。"},
{"id":"T162","field":"T","cat":"ソフトウェア","question":"OSSを業務システムに利用する際の留意点として、最も適切なものはどれか。","choices":["OSSはライセンス条件を確認せずに自由に組み込んでよい","ライセンスの種類によっては、改変して配布する際に自社のソースコード公開が必要になる場合があるため、条件を確認して利用する","OSSには一切の不具合がない","OSSを使うと必ず有償サポートが付いてくる"],"answer":1,"exp":"OSSにはGPL（コピーレフト型）、Apache/MIT（非コピーレフト型）など複数のライセンスがあり、義務の内容が異なります。特にGPL系は派生物のソース公開義務があるため、商用製品への組込みでは事前確認が不可欠です。原則無保証である点も要注意です。"},
{"id":"T163","field":"T","cat":"ハードウェア","question":"倉庫内の温度を常時計測してクラウドに送信するIoTシステムを構築する。温度を電気信号に変換する部品と、データを長距離・低消費電力で送る無線技術の組合せとして、適切なものはどれか。","choices":["アクチュエータとHDMI","温度センサとLPWA","スピーカとUSB","プロジェクタとNFC"],"answer":1,"exp":"物理量の計測はセンサ、IoT向けの低消費電力・広域無線はLPWAです。「計測＝センサ、駆動＝アクチュエータ」「近距離＝NFC/BLE、広域省電力＝LPWA」という部品と通信の役割対応を押さえれば、IoT構成問題は解けます。"},
{"id":"T164","field":"T","cat":"ハードウェア","question":"3Dプリンタの説明として、適切なものはどれか。","choices":["立体物の形状を読み取ってデジタルデータ化する装置","3次元データを基に、樹脂などの材料を積み重ねて立体物を造形する装置","立体映像を空中に投影する装置","3枚の用紙に同時に印刷する装置"],"answer":1,"exp":"3Dプリンタは3次元CADデータなどから立体物を造形する装置で、試作品（プロトタイプ）の迅速な作成などに活用されます。立体形状の読み取りは3Dスキャナの役割です。"},
{"id":"T165","field":"T","cat":"情報デザイン","question":"公共施設のWebサイトを、高齢者や視覚に障害のある人にも利用しやすくする施策として、適切なものの組合せはどれか。\na 画像に代替テキストを付ける\nb 文字と背景のコントラストを十分に確保する\nc 文字サイズを固定して変更できないようにする\nd キーボードだけでも操作できるようにする","choices":["a、b、d","a、b、c","a、c、d","b、c、d"],"answer":0,"exp":"アクセシビリティ向上策の定番は、代替テキスト（読み上げソフト対応）、十分なコントラスト、文字サイズの拡大許容、キーボード操作対応などです。cの「文字サイズ固定」は拡大を妨げるため逆効果です。"},
{"id":"T166","field":"T","cat":"情報デザイン","question":"スマートフォン向けサイトを先に設計し、その後にPC向けの画面を設計する考え方はどれか。","choices":["モバイルファースト","ウォータフォール","デザインの原則","ペーパープロトタイプ"],"answer":0,"exp":"モバイルファーストは、利用の主流であるスマートフォンでの体験を最優先に設計するアプローチです。画面幅に応じてレイアウトを自動調整するレスポンシブWebデザインと組み合わせて使われます。"},
{"id":"T167","field":"T","cat":"情報メディア","question":"サンプリング周波数44.1kHz、量子化ビット数16ビット、ステレオ（2チャンネル）で1秒間録音した場合のデータ量はおよそいくらか。ここで、圧縮は行わないものとする。","choices":["約88Kバイト","約176Kバイト","約1.4Mバイト","約44Kバイト"],"answer":1,"exp":"1秒当たり＝44,100回×16ビット×2ch＝1,411,200ビット。バイトに直すと÷8で176,400バイト≒176Kバイト。「サンプリング周波数×量子化ビット数×チャンネル数÷8」の型で解けます。音のデジタル化は標本化→量子化→符号化の順です。"},
{"id":"T168","field":"T","cat":"情報メディア","question":"音楽や映像の配信サービスで、コンテンツの不正コピーや無断利用を防ぐために使われる技術の総称はどれか。","choices":["DRM","OCR","GUI","RSS"],"answer":0,"exp":"DRM（Digital Rights Management：デジタル著作権管理）は、暗号化や視聴期限の設定などでデジタルコンテンツの利用を制御する技術の総称です。DVDの録画制御に使われるCPRMもDRMの一種です。"},
{"id":"T169","field":"T","cat":"データベース","question":"E-R図の説明として、適切なものはどれか。","choices":["データベース設計において、実体（エンティティ)と実体間の関連（リレーションシップ）を図で表現したもの","プログラムの処理の流れを表した図","ネットワークの配線図","プロジェクトの進捗を表す図"],"answer":0,"exp":"E-R図は「顧客」「注文」などの実体と、「顧客は注文を行う」といった関連を整理する設計図で、関係データベースの表設計の基になります。1対多などの多重度も表現します。"},
{"id":"T170","field":"T","cat":"データベース","question":"注文表の中に顧客名と顧客住所を毎回記録していたところ、同じ顧客の住所変更時に大量の行を修正する必要が生じた。この問題を解決するデータベース設計の手法はどれか。","choices":["正規化を行い、顧客情報を顧客表に分離して注文表からは顧客番号で参照する","全てのデータを1つの表にまとめる","住所の列を削除する","表の名前を変更する"],"answer":0,"exp":"データの重複による更新時の矛盾（更新時異状）は、正規化で解決します。顧客情報を別表に分け、注文表には顧客番号（外部キー）だけを置けば、住所変更は顧客表の1行の修正で済みます。"},
{"id":"T171","field":"T","cat":"データベース","question":"社員表から「部署コードが'101'の行」だけを取り出し、その中から「氏名と入社年の列」だけを表示した。行った関係演算の組合せはどれか。","choices":["選択と射影","結合と正規化","挿入と削除","排他制御とコミット"],"answer":0,"exp":"条件に合う行の絞り込みが「選択」、必要な列の取り出しが「射影」です。SQLではWHERE句が選択、SELECT句の列指定が射影に対応します。複数の表をつなぐのは「結合」です。"},
{"id":"T172","field":"T","cat":"データベース","question":"データベースのインデックスを作成する主な目的はどれか。","choices":["データを暗号化するため","検索処理を高速化するため","データの重複を許すため","バックアップを不要にするため"],"answer":1,"exp":"インデックスは本の索引に当たるもので、目的のデータの位置を素早く特定できるようにします。検索は速くなる一方、更新時には索引の保守が必要になるためやみくもに作ればよいわけではない、という点も知っておきましょう。"},
{"id":"T173","field":"T","cat":"データベース","question":"データベースの障害復旧において、バックアップ取得後の更新内容をログの更新後情報を使って再現し、障害発生直前の状態に戻す処理はどれか。","choices":["ロールフォワード","ロールバック","排他制御","正規化"],"answer":0,"exp":"媒体障害などでバックアップから復元した後、ログ（ジャーナル）の更新後情報で取得後の更新を再適用するのがロールフォワードです。処理途中の失敗を開始前に巻き戻すロールバック（更新前情報を使用）と対で覚えましょう。"},
{"id":"T174","field":"T","cat":"ネットワーク","question":"通信プロトコルにおけるポート番号の役割として、適切なものはどれか。","choices":["通信相手のコンピュータを識別する","通信先のコンピュータ上で動作するどのサービス（アプリケーション）に届けるかを識別する","電波の周波数を指定する","ケーブルの種類を指定する"],"answer":1,"exp":"IPアドレスが「建物の住所」なら、ポート番号は「部屋番号」です。同じサーバ上のWeb（80/443）、メール送信（25）など、どのサービス宛かを区別します。IPアドレスとポート番号の役割分担を整理しましょう。"},
{"id":"T175","field":"T","cat":"ネットワーク","question":"在宅勤務者が自宅から社内ネットワークに安全に接続するために、インターネット上に暗号化された仮想的な専用通信路を確立する技術はどれか。","choices":["VPN","DNS","NTP","RSS"],"answer":0,"exp":"VPN（Virtual Private Network）は、公衆回線上に暗号化されたトンネルを作り、専用線のように安全な通信を実現します。テレワークの標準的な接続手段です。なお、ゼロトラストの考え方ではVPN内部も無条件には信頼しません。"},
{"id":"T176","field":"T","cat":"ネットワーク","question":"Webサイトに一度ログインすると、次回のアクセス時にもログイン状態が維持されている。この仕組みを実現するためにブラウザ側に保存されているものはどれか。","choices":["cookie","キャッシュメモリ","BIOS","ファームウェア"],"answer":0,"exp":"cookieはWebサーバの指示でブラウザに保存される小さなデータで、セッションの識別情報を保持することでログイン状態の維持や設定の記憶を実現します。行動追跡（ターゲティング広告）にも使われるため、プライバシーの観点でも出題されます。"},
{"id":"T177","field":"T","cat":"ネットワーク","question":"家庭のルータが、1つのグローバルIPアドレスを複数の家庭内機器で共有できるようにするために行っているアドレス変換の仕組みはどれか。","choices":["NAT","DNS","MIME","VLAN"],"answer":0,"exp":"NAT（ネットワークアドレス変換）は、プライベートIPアドレスとグローバルIPアドレスを相互変換する仕組みです。IPv4アドレスの節約を支えてきた技術で、家庭・企業のルータで標準的に使われています。"},
{"id":"T178","field":"T","cat":"ネットワーク","question":"自宅に無線LANルータを設置する際のセキュリティ設定として、最も適切なものはどれか。","choices":["暗号化を設定せず、誰でも接続できるようにする","WPA2又はWPA3による暗号化を有効にし、初期パスワードを推測されにくいものに変更する","管理画面のパスワードを初期値のまま使い続ける","ファームウェアは購入時のまま更新しない"],"answer":1,"exp":"無線LANの基本対策は、①WPA2/WPA3の暗号化、②推測されにくいパスワードへの変更（機器の管理パスワードも）、③ファームウェアの更新です。暗号化なしでは通信の盗聴やただ乗りのリスクがあります。"},
{"id":"T179","field":"T","cat":"ネットワーク","question":"理論上の最大通信速度が1Gビット/秒の回線で、実際の転送速度が理論値の40％だった場合、2Gバイトのファイルの転送におよそ何秒かかるか。","choices":["16秒","40秒","80秒","160秒"],"answer":1,"exp":"実効速度＝1Gビット/秒×0.4＝0.4Gビット/秒。\nデータ量＝2Gバイト×8＝16Gビット。\n16÷0.4＝40秒。「バイト→ビットの×8」と「利用効率を掛けてから割る」の2段構えで解きます。"},
{"id":"T180","field":"T","cat":"セキュリティ","question":"情報セキュリティにおけるリスクアセスメントの実施手順として、適切な順序はどれか。","choices":["リスク対応 → リスク特定 → リスク分析","リスク特定 → リスク分析 → リスク評価","リスク評価 → リスク特定 → リスク分析","リスク分析 → リスク対応 → リスク特定"],"answer":1,"exp":"リスクアセスメントは、①リスク特定（何が起こり得るか洗い出す）→②リスク分析（発生確率と影響の大きさを見積もる）→③リスク評価（対応の要否と優先順位を決める）の順です。その後にリスク対応（回避・低減・共有・保有）を行います。"},
{"id":"T181","field":"T","cat":"セキュリティ","question":"Webアプリケーションの脆弱性を突くSQLインジェクションなどの攻撃を、Webサーバの前段で検知・遮断する対策はどれか。","choices":["WAF","UPS","RAID","NAS"],"answer":0,"exp":"WAF（Web Application Firewall）はWebアプリケーション層への攻撃に特化した防御装置です。通常のファイアウォール（通信の送信元・宛先で制御）では防げない、アプリの入力データを悪用する攻撃に対応します。防御の層の違いを整理しましょう。"},
{"id":"T182","field":"T","cat":"セキュリティ","question":"従業員が標的型攻撃メールの添付ファイルを開いてしまった場合の対応として、最も適切なものはどれか。","choices":["誰にも報告せず様子を見る","PCをネットワークから切り離し、直ちに情報システム部門やCSIRTなどの担当窓口に報告する","PCを再起動すれば問題ない","メールを削除すれば感染もなくなる"],"answer":1,"exp":"開封後の初動は「隔離と報告」です。ネットワークからの切り離しで感染拡大と情報送信を防ぎ、専門チーム（CSIRT）が調査・対応します。報告の遅れが被害を拡大させるため、「開いてしまったら即報告」を組織文化にすることが重要です。"},
{"id":"T183","field":"T","cat":"セキュリティ","question":"ゼロトラストの考え方に基づくアクセス管理の例として、最も適切なものはどれか。","choices":["社内LANからのアクセスは全て無条件に許可する","アクセスのたびに利用者と端末の状態を検証し、必要最小限の権限だけを付与する","一度ログインした利用者は退職まで再認証しない","ファイアウォールの内側では対策を行わない"],"answer":1,"exp":"ゼロトラストは「境界の内側でも信頼しない」モデルです。毎回の検証（認証・端末の健全性確認）と最小権限の原則がその実践です。クラウドとテレワークの普及で境界型防御が通用しにくくなった背景と併せて理解しましょう。"},
{"id":"T184","field":"T","cat":"セキュリティ","question":"ランサムウェア対策としてのバックアップの「3-2-1ルール」の説明として、適切なものはどれか。","choices":["3日ごとに2回、1時間かけてバックアップする","データの複製を3部作り、2種類の異なる媒体に保存し、そのうち1部は遠隔地などネットワークから切り離された場所に保管する","3人の担当者が2台のPCで1つのファイルを管理する","バックアップは3年間で2回だけ、1月に実施する"],"answer":1,"exp":"3-2-1ルールは「3部・2種類の媒体・1部はオフサイト（オフライン）」の原則です。ランサムウェアはネットワーク上のバックアップごと暗号化するため、切り離された保管先が最後の砦になります。書換え不可のイミュータブルバックアップも有効です。"}

{"f":"G","t":"苦手意識は「順番」で消える","sub":"このアプリの使い方と勉強のコツ","body":"ITが苦手に感じるのは、能力の問題ではなく「知らない言葉のまま問題を解こうとした」だけのことがほとんどです。テキストは正確に書こうとするあまり、初学者には言葉が硬すぎるのです。\n\nこのアプリでは、次の順番で進めれば大丈夫です。\n\n① この入門講座を上から順に読む（例え話中心なので気楽に）\n② 講座の最後の「この単元の問題を解く」で数問だけ解く\n③ 間違えても気にしない。解説を読んで「へえ」と思えたら合格\n④ 全講座を読み終えたら、演習タブで分野別に量をこなす\n⑤ 仕上げに模試\n\n大事なのは「わからない問題に長く悩まないこと」。ITパスポートは4択です。2択まで絞れれば上出来、という気持ちで進みましょう。用語タブの⭐マークは通勤などのすき間時間の流し読みに使ってください。","points":["いきなり過去問ではなく、講座→少量の問題の順で進める","間違いは「弱点克服」に自動でたまるので、忘れても大丈夫","1日15分でOK。続けることが最優先"],"q":[]},
{"f":"G","t":"試験の全体像と合格戦略","sub":"満点は不要。6割で合格できる試験","body":"ITパスポートは100問・120分の試験ですが、合格ラインは「総合600/1000点」、つまり6割です。しかも4割は間違えてよいのです。\n\n出題は3分野に分かれます。\n・ストラテジ系（経営全般）35問程度……会社のお金や戦略の話\n・マネジメント系（IT管理）20問程度……開発やプロジェクトの話\n・テクノロジ系（IT技術）45問程度……コンピュータの仕組みの話\n\n注意点はひとつ。「各分野で300/1000点（3割）以上」という足切りがあることです。テクノロジ系だけ捨てる、といった戦略は使えません。逆にいえば、どの分野も3割を超えつつ全体で6割取れば合格です。\n\n実はIT未経験でも、ストラテジ系は社会人経験がそのまま武器になります。テクノロジ系はこの入門講座でゼロから固めましょう。計算問題は全体の1割程度しか出ないので、パターンを覚えた分だけ得点源になります。","points":["合格基準：総合600点以上かつ各分野300点以上","4割間違えても受かる試験。完璧主義は不要","計算問題は少ない。文章問題（用語の意味）が主戦場"],"q":[]},
{"f":"T","t":"2進数——コンピュータの数の数え方","sub":"0と1しか使えない世界のルール","body":"コンピュータは電気のON/OFFしか区別できないので、数を「0と1だけ」で数えます。これが2進数です。\n\n私たちの10進数は「9の次で桁が上がる」ルール。2進数は「1の次でもう桁が上がる」ルールです。\n0、1、10、11、100、101……と数えます。\n\n【10進数→2進数】2で割った余りをメモして、下から読む\n例：13 → 13÷2=6余り1、6÷2=3余り0、3÷2=1余り1、1÷2=0余り1 → 下から読んで「1101」\n\n【2進数→10進数】桁の重み（右から1、2、4、8、16…）を掛けて足す\n例：1101 → 8×1＋4×1＋2×0＋1×1 ＝ 13\n\nついでに単位も覚えましょう。1桁分が1ビット、8ビット＝1バイトです。8ビットあれば2の8乗＝256通りを表せます。大きさの単位はキロ（千）→メガ（百万）→ギガ（十億）→テラ、小さい方はミリ→マイクロ→ナノ→ピコです。","points":["10進→2進は「2で割って余りを下から読む」","2進→10進は「右から1,2,4,8…を掛けて足す」","8ビット=1バイト=256通り。単位の系列（K/M/G/T、m/μ/n/p）は暗記"],"q":["T01","T03","T69","T07"]},
{"f":"T","t":"コンピュータの中身はキッチン","sub":"CPU・メモリ・ストレージの役割分担","body":"コンピュータの内部は、キッチンに例えるとスッと理解できます。\n\n・CPU＝料理人。実際に作業（計算）をする主役。腕の速さがクロック周波数で、料理人の人数がコア数です。\n・メモリ（主記憶）＝まな板・調理台。今まさに使う材料を広げる場所。広いほど同時にいろいろ作業できますが、電源を切ると全部片付きます（揮発性）。\n・ストレージ（SSD/HDD）＝冷蔵庫。材料や作り置きを保存する場所。電源を切っても消えません。SSDは高速な最新型冷蔵庫、HDDは大容量で安い昔ながらの冷蔵庫です。\n・キャッシュメモリ＝手元の小皿。よく使う調味料を手元に置いておくと速い、という工夫。CPUとまな板の間の速度差を埋めます。\n・GPU＝大量の見習い料理人チーム。単純作業（画像処理やAI計算）を全員で一斉にやるのが得意。\n\n「速い順に、レジスタ＞キャッシュ＞主記憶＞ストレージ。速いものほど小容量で高価」——この階層構造が試験で頻出です。","points":["CPU=料理人（クロック周波数=速さ、コア=人数）","メモリ=まな板（揮発性）、ストレージ=冷蔵庫（不揮発性）","速度順：レジスタ＞キャッシュ＞主記憶＞補助記憶"],"q":["T14","T15","T16","T19","T18","T74"]},
{"f":"T","t":"OSとファイル——パソコンの「管理人」","sub":"WindowsやiOSは何をしている？","body":"OS（WindowsやmacOS、スマホのiOS/Android）は、マンションの管理人のような存在です。\n\n住人（アプリ）が「印刷したい」「保存したい」と言うたびに、管理人が設備（CPU・メモリ・プリンタ）への取次ぎをしてくれます。だからアプリはどの部屋でも同じように動けるのです。複数のアプリを同時に動かす交通整理（マルチタスク）も管理人の仕事です。\n\nファイルの整理は「階層」で行います。フォルダ（ディレクトリ）の中にフォルダを作る、あの仕組みです。\n・一番上の階＝ルートディレクトリ\n・今開いている場所＝カレントディレクトリ\n・住所を最上階から全部書く書き方＝絶対パス\n・今いる場所から見た道順の書き方＝相対パス\n\nまた、周辺機器を使うための通訳ソフトをデバイスドライバといいます。挿すだけで自動設定されるのがプラグアンドプレイです。","points":["OSは資源管理の基本ソフト。アプリ（応用ソフト）と区別する","絶対パス=ルートから全部、相対パス=現在地から","OSSは「無料で使えて改変・再配布OK、ただし無保証」のソフト"],"q":["T26","T27","T30","T77"]},
{"f":"T","t":"稼働率——壊れにくさを数字にする","sub":"直列と並列、2つの公式だけ","body":"「システムが動いている時間の割合」が稼働率です。0.9なら「90％の時間は動いている」という意味です。\n\n計算問題は実質2パターンしかありません。\n\n【直列】機器が数珠つなぎで、全部動かないとダメな構成\n→ 稼働率を掛け算するだけ。\n例：0.9×0.9＝0.81（1台より下がる。弱点が増えるから）\n\n【並列】2台のうちどちらか動けばOKな構成\n→「全滅する確率」を出して1から引く。\n例：故障率は各0.1。両方壊れる確率＝0.1×0.1＝0.01。稼働率＝1−0.01＝0.99（1台より上がる。保険があるから）\n\n直列は下がる、並列は上がる。この感覚だけで選択肢を2つに絞れます。\n\n関連用語も一緒に。MTBF＝故障と故障の間の平均時間（長いほど優秀）、MTTR＝修理の平均時間（短いほど優秀）。稼働率＝MTBF÷(MTBF＋MTTR)です。故障時に安全側に倒す設計をフェールセーフ、誤操作を防ぐ設計をフールプルーフといいます。","points":["直列=掛け算、並列=1−(故障率の積)","MTBF長い=信頼性が高い、MTTR短い=保守性が高い","フェールセーフ（安全側へ）とフールプルーフ（誤操作防止）の区別"],"q":["T21","T75","T76","T22","T20"]},
{"f":"T","t":"データベース——巨大なExcel表","sub":"主キー・SQL・トランザクション","body":"データベース（関係データベース）は、ざっくり言えば「壊れにくい巨大なExcelの表」です。行が1件のデータ、列が項目です。\n\n・主キー＝出席番号。行を1つに特定できる列で、重複も空欄もダメ。\n・外部キー＝他の表の出席番号を書いたメモ。「注文表」に「顧客番号」を書いておけば、顧客表とつながります。\n・正規化＝同じ情報を2か所に書かない整理術。住所を注文表にも顧客表にも書くと、引っ越しのとき片方だけ直して矛盾が起きます。\n\n表からデータを取り出す操作は3つ：行を絞るのが「選択」、列を絞るのが「射影」、表をつなぐのが「結合」。\n\nそして銀行振込のような一連の処理をトランザクションといいます。「出金だけ成功して入金失敗」を防ぐため、全部成功か全部取消しか（原子性）を保証します。同時に同じデータを書き換えて壊れないようにロックする仕組みが排他制御、障害時に処理前へ巻き戻すのがロールバックです。","points":["主キー=重複・空値NG。外部キーで表と表をつなぐ","選択=行、射影=列、結合=表をつなぐ","トランザクションは「全部か、ゼロか」（ACID特性）"],"q":["T40","T41","T42","T43","T44","T45","T80","T81"]},
{"f":"T","t":"ネットワーク——インターネットは郵便","sub":"IPアドレス・DNS・ルータ","body":"インターネットの仕組みは、郵便に例えるのが一番の近道です。\n\n・IPアドレス＝住所。ネット上の機器1台1台に割り振られる番号です。\n・パケット＝小分けにした荷物。大きなデータは小包に分けて送り、届いてから組み立てます。\n・ルータ＝郵便局。「この宛先ならあっち方面」と、住所を見て荷物を次々に転送します。\n・DNS＝電話帳。人間が覚えやすい名前（example.com）を、機械用の住所（IPアドレス）に変換します。\n・DHCP＝転入手続きの係。ネットにつないだ機器に住所（IPアドレス）を自動で発行します。\n\n「DNSは名前→住所の変換、DHCPは住所の自動発行」。この2つの取り違えを狙う問題が毎回のように出ます。\n\n社内など内輪で使う住所がプライベートIPアドレス、世界で通用する住所がグローバルIPアドレス。5Gは「速い・遅れない・大人数同時OK」の最新携帯回線、Wi-Fiは無線LANの愛称です。","points":["DNS=名前解決（電話帳）、DHCP=IPアドレス自動割当て（取り違え注意！）","ルータは宛先（IPアドレス）を見て転送する郵便局","通信速度計算：バイト→ビットは×8してから割る"],"q":["T46","T47","T51","T52","T54","T82","T83"]},
{"f":"T","t":"メールとWebの仕組み","sub":"SMTP・POP・HTTPS・cookie","body":"メールの配達も郵便と同じ構図です。\n\n送信はSMTPという配達ルール、受信はPOP（自宅の郵便受けから取り出す）やIMAP（局留めのまま読む）というルールを使います。「送るのはSMTP、受け取るのはPOP/IMAP」とだけ覚えれば十分です。\n\n宛先欄は3種類。To（本来の宛先）、Cc（写し。全員にアドレスが見える）、Bcc（こっそり写し。他の人には見えない）。一斉送信でお客様のアドレスをCcに入れてしまう事故が実際に多いので、実務でも大事な知識です。\n\nWebの方は、ブラウザとサーバがHTTPというルールで会話します。鍵マークが付くHTTPSは、通信を暗号化した安全版。ただし「通信が安全」なだけで「サイトの中身が本物」の保証ではありません。偽サイトも鍵マークを持てます。\n\ncookieは、サイトがブラウザに残す小さなメモ。「ログイン済み」を覚えてもらえるのはこのおかげです。","points":["送信=SMTP、受信=POP/IMAP","Bccは他の受信者からアドレスが見えない","HTTPS=通信の暗号化。中身の信頼性までは保証しない"],"q":["T48","T49","T50","T90"]},
{"f":"T","t":"セキュリティ①——泥棒の手口を知る","sub":"マルウェア・フィッシング・標的型攻撃","body":"セキュリティは「家の防犯」に置き換えると全体像がつかめます。まずは泥棒の手口から。\n\n・マルウェア＝悪意あるソフトの総称。中でも、勝手に増えて広がるのがワーム、便利ソフトのふりして忍び込むのがトロイの木馬、ファイルを人質に身代金を要求するのがランサムウェアです。\n・フィッシング＝偽の銀行サイトへ誘い込んで暗証番号を入力させる「振り込め詐欺のネット版」。\n・標的型攻撃＝あなたの会社を狙い撃ちにして、取引先を装ったメールを送る手口。ばらまき型より見抜きにくい。\n・ソーシャルエンジニアリング＝技術を使わない攻撃。肩越しの盗み見や、システム管理者を名乗る電話など、人の油断を突きます。\n・パスワードリスト攻撃＝よそで漏れたパスワードを使い回し先で試す手口。「使い回し」が最大の弱点です。\n・ゼロデイ攻撃＝修理パッチが出る前の欠陥（脆弱性）を突く攻撃。\n\n名前と手口が1対1で問われるので、この講座の例えごと覚えてしまいましょう。","points":["ワーム=自己増殖、トロイの木馬=偽装侵入、ランサムウェア=人質+身代金","フィッシング=偽サイト誘導、ソーシャルエンジニアリング=人の心理を突く","パスワード使い回しはリスト攻撃の餌食に"],"q":["T61","T62","T63","T85","T86","T87"]},
{"f":"T","t":"セキュリティ②——鍵と金庫で守る","sub":"暗号・認証・ファイアウォール","body":"次は守る側です。\n\n【暗号】手紙を金庫に入れて送るイメージ。\n・共通鍵暗号＝同じ鍵を2人で共有する方式。速いけれど、鍵をどう安全に渡すかが悩み。\n・公開鍵暗号＝「誰でも閉められるが、開けられるのは持ち主だけ」の南京錠。受け取りたい人が南京錠（公開鍵）を配り、届いた荷物を自分だけの鍵（秘密鍵）で開けます。\n・デジタル署名＝ロウ印の封蝋。送信者本人が封をした証拠になり（なりすまし防止）、開封や改ざんの跡も分かります。署名は送信者の秘密鍵で行う点が暗号化と逆なので注意。\n\n【認証】本人確認は3種類の証拠で行います。知識（パスワード）・所持（スマホ）・生体（指紋）。異なる2種類以上を組み合わせるのが多要素認証です。「パスワード＋秘密の質問」は両方とも知識なので多要素になりません（ひっかけ頻出！）。\n\n【建物の守り】ファイアウォール＝門番。外と中の通信を検問します。公開サーバは門の外の受付スペース（DMZ）に置き、万一やられても母屋に入られないようにします。","points":["公開鍵暗号：暗号化は受信者の公開鍵、復号は受信者の秘密鍵","デジタル署名：送信者の秘密鍵で署名→なりすまし・改ざんを検知","多要素認証=知識・所持・生体のうち2種類以上（同種2つはNG）"],"q":["T56","T57","T58","T59","T64","T67","T88","T89"]},
{"f":"T","t":"AIのきほん——機械はどう学ぶ？","sub":"機械学習・生成AI・注意点","body":"AIの「学習」は、子どもの学習に例えられます。\n\n・教師あり学習＝答え付きドリルで勉強。「これは犬、これは猫」とラベル付きの写真を大量に見せると、新しい写真も判別できるようになります。売上予測などもこれ。\n・教師なし学習＝答えなしで、自分でグループ分け。顧客を「似た者同士」に自動で分類するなど。\n・強化学習＝ほめて伸ばす。うまくいったら点数（報酬）を与え、高得点の行動を自分で見つけさせます。囲碁AIが有名。\n\nディープラーニングは、脳の神経回路をまねた「ニューラルネットワーク」を何層も重ねる方法で、AIブームの主役です。\n\n文章や画像を作り出す生成AIも試験範囲になりました。要注意キーワードは2つ。\n・ハルシネーション＝もっともらしいウソを堂々と出力する現象。人間の確認が必須。\n・プロンプトインジェクション＝AIへの指示文を細工して、開発者の意図しない動作をさせる攻撃。\n\n「AIの出力は必ず人間が確認」——これが試験でも実務でも正解です。","points":["教師あり=答え付き、教師なし=グループ分け、強化=報酬で試行錯誤","ディープラーニング=多層ニューラルネットワーク","ハルシネーション対策=人間による事実確認"],"q":["T05","T06","T70","T71","S39"]},
{"f":"T","t":"計算問題は3パターンで攻略","sub":"単位換算・通信速度・画像容量","body":"テクノロジ系の計算問題は、実はほぼ「単位の換算」しか問われていません。3つの型を覚えれば得点源になります。\n\n【型1】ビットとバイト\n8ビット＝1バイト。「バイト→ビットは×8、ビット→バイトは÷8」。これだけ。\n\n【型2】通信速度（何秒かかる？）\n手順：①データ量をビットに直す（×8）②回線速度で割る\n例：100Mビット/秒の回線で500Mバイトのファイル\n→ 500×8＝4,000Mビット → 4,000÷100＝40秒\n※「利用効率50％」とあれば、速度を半分にしてから割る。\n\n【型3】画像の容量\n手順：①画素数を数える（縦×横）②1画素のビット数を掛ける ③8で割ってバイトに直す\n例：1,000×800画素、24ビットカラー\n→ 800,000画素×24ビット÷8＝2,400,000バイト＝2.4Mバイト\n\nどの型も「まずビットかバイトか確認」が合言葉です。選択肢には×8を忘れた数字が必ず混ざっています。","points":["8ビット=1バイト。換算を最初にやる","通信時間=データ量（ビット）÷回線速度（ビット/秒）","画像容量=縦×横×色のビット数÷8"],"q":["T03","T54","T37","T07"]},
{"f":"S","t":"会社のお金——家計に例える","sub":"財務3表と損益分岐点","body":"ストラテジ系で怖がられがちなのが会計ですが、家計に置き換えれば簡単です。\n\n・損益計算書（P/L）＝1年分の家計簿。「いくら稼いで、いくら使って、いくら残ったか」。\n・貸借対照表（B/S）＝ある日の財産リスト。「貯金と持ち物（資産）」から「ローン（負債）」を引いた残りが自分の正味財産（純資産）。\n・キャッシュフロー計算書＝お財布の現金の出入り帳。黒字でも現金がなければ倒産（黒字倒産）するので、現金の動きを別に見ます。\n\n利益は段階があります。売上−原価＝売上総利益（粗利）。そこから家賃や人件費（販管費）を引くと営業利益＝本業のもうけ。\n\n損益分岐点は「もうけがゼロになる売上」。屋台のたこ焼き屋で考えると、\n・材料費（1皿ごとにかかる）＝変動費\n・屋台のレンタル代（売れなくてもかかる）＝固定費\n1皿の値段から材料費を引いた「1皿あたりのもうけ」で、レンタル代を回収できる皿数が損益分岐点です。\n計算式：損益分岐点販売数量＝固定費÷（単価−変動費単価）","points":["P/L=1年の家計簿、B/S=財産リスト、CF=現金の出入り","営業利益=売上総利益−販管費（本業のもうけ）","損益分岐点数量=固定費÷(単価−変動費単価)"],"q":["S01","S05","S54","S55"]},
{"f":"S","t":"経営戦略のカタカナ語を見分ける","sub":"SWOT・PPM・3C・4P","body":"経営戦略の用語は数が多く見えますが、「何を整理するための道具か」で見分ければ混乱しません。\n\n・SWOT分析＝自社の健康診断。内側の強み・弱み、外側の機会・脅威の4マスに書き出す。\n・3C分析＝戦う場所の下見。顧客（Customer）・競合（Competitor）・自社（Company）の3方向から眺める。\n・PPM＝事業の仕分け表。市場の成長率とシェアで、花形／金のなる木／問題児／負け犬の4つに分類。「金のなる木」で稼いだお金を「問題児」に投資するのが定石です。\n・4P＝売り方の設計図。Product（何を）Price（いくらで）Place（どこで）Promotion（どう宣伝して）売るか。\n\n覚え方のコツは「診断はSWOT、下見は3C、仕分けはPPM、売り方は4P」。\n\nそのほか、他社にまねできない自社の武器がコアコンピタンス、目標の数値化ではKGI（最終ゴール）とKPI（途中経過の目安）のセットが頻出。マラソンなら完走タイムがKGI、毎月の走行距離がKPIです。","points":["SWOT=内外×良し悪しの4マス","PPMの4分類と「金のなる木→問題児へ投資」","KGI=最終目標、KPI=中間指標（マラソンの例で覚える）"],"q":["S21","S22","S23","S24","S61","S62","S26"]},
{"f":"S","t":"法律はストーリーで覚える","sub":"知的財産・労働・個人情報","body":"法務は「誰を何から守る法律か」というストーリーで覚えると忘れません。\n\n【アイディアと作品を守る】\n・著作権＝書いた瞬間に自動発生（手続不要）。プログラムも対象。ただしアイディアやアルゴリズムは守らない。\n・特許権＝発明を役所に登録して守る。産業財産権（特許・実用新案・意匠・商標）は全部「登録制」。\n覚え方：「作品は自動、発明は登録」。\n\n【働く人を守る】\n・労働基準法＝残業させるなら36協定が必要。\n・派遣＝雇い主は派遣元、仕事の指示は派遣先。\n・請負＝「完成」を約束する契約。発注者は作業者に直接指示できない（やると偽装請負）。\n\n【個人情報を守る】\n・病歴や犯罪歴など＝要配慮個人情報。取得に本人同意が必須。\n・匿名加工情報＝個人を特定できないよう加工したデータ。同意なしで利活用OK。\n\n【不正を禁じる】\n・不正アクセス禁止法＝他人のIDでログイン、パスワードを教える行為も違反。\n・ウイルス作成罪＝作る・ばらまく・保管も罪。","points":["著作権=自動発生、産業財産権=登録が必要","派遣は「雇用=派遣元、指揮命令=派遣先」、請負は完成責任","要配慮個人情報=取得に本人同意が必須"],"q":["S11","S12","S13","S14","S15","S16","S59","S60","S58"]},
{"f":"S","t":"デジタルビジネス用語の地図","sub":"DX・クラウド・IoT・フィンテック","body":"カタカナ・アルファベットの新語は「昔はどうだったか」とセットにすると腹落ちします。\n\n・DX＝「ITを入れる」ことではなく「ITで商売のやり方ごと変える」こと。レンタルビデオ店がネット配信になったのがDXのイメージ。単なる書類の電子化はデジタル化止まりです。\n・クラウド＝ソフトやサーバを「買う」から「借りる」へ。アプリごと借りるのがSaaS、開発環境を借りるのがPaaS、機械だけ借りるのがIaaS。自前で持つのはオンプレミス。\n・IoT＝モノがネットにつながること。エアコンをスマホで操作、工場の機械が故障を自己申告、など。\n・RPA＝パソコン仕事の自動化ロボット。コピペや転記のような定型作業を肩代わり。\n・フィンテック＝金融×IT。スマホ決済や仮想通貨（暗号資産）。\n・シェアリングエコノミー＝持ち物や時間を貸し借りする経済。民泊やカーシェア。\n・ロングテール＝ネット店舗は棚が無限なので、ニッチ商品の合計が大きな売上になる話。\n\n試験では「事例を読んで用語を選ぶ」形式が多いので、例え・事例ごと覚えるのが最短です。","points":["DX=ビジネスモデルの変革（単なる電子化ではない）","SaaS/PaaS/IaaS=借りる範囲の違い。自前=オンプレミス","RPA=定型事務の自動化（非定型は苦手）"],"q":["S47","S43","S69","S33","S44","S38","S64","S66","S67"]},
{"f":"S","t":"システムを「買う側」の仕事","sub":"RFI・RFP・要件定義の流れ","body":"多くの会社にとってシステムは「作る」ものではなく「発注して買う」もの。その手順が試験に出ます。家のリフォームに例えましょう。\n\n① 企画：「キッチンが古くて不便。リフォームしたい」→ 何のためにやるか目的を固める（システム化計画）。経営戦略との整合が最優先です。\n② RFI（情報提供依頼）：数社に「どんな工法や実績がありますか？」とパンフレットを請求する段階。\n③ RFP（提案依頼書）：「予算はこれ、この機能が欲しい。提案書をください」と正式にお願いする文書。\n④ 提案書・見積書を比較してベンダー（業者）を選定、契約。\n⑤ 要件定義：業者と一緒に「コンロは3口、収納はここ」と細部を確定。ここで住む人（利用部門）が参加しないと、完成後に「使いにくい！」となります。\n\n順番は「RFI（下調べ）→RFP（正式依頼）」。逆にすると変なので、Iは情報のI＝先、と覚えましょう。\n\n要件には、機能要件（何ができるか）と非機能要件（速さ・安定性・セキュリティなど）があり、非機能の例を選ばせる問題が頻出です。","points":["調達の順番：RFI→RFP→提案評価→契約","要件定義には利用部門の参画が不可欠","非機能要件=性能・可用性・セキュリティなど（応答3秒以内 等）"],"q":["S48","S49","S50","S52","S71"]},

/* ================= 定数・状態 ================= */
const FIELDS={S:"ストラテジ系",M:"マネジメント系",T:"テクノロジ系"};
const KANA=["ア","イ","ウ","エ"];
const MOCK_CONF={total:50,S:18,M:10,T:22,minutes:60};
const FULL_CONF={total:100,S:35,M:20,T:45,minutes:120};
const LS_KEY="ipass_dojo_v1";

let store=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS_KEY));if(s&&s.hist){
    if(!s.les)s.les={};if(!s.srs)s.srs={};if(!s.flash)s.flash={};
    if(!s.streak)s.streak={last:"",days:0};
    return s;}}catch(e){}
  return {hist:{},bm:[],mocks:[],les:{},srs:{},flash:{},streak:{last:"",days:0}};
}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(store));}
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayStr(){return dstr(new Date());}
function addDays(n){return dstr(new Date(Date.now()+n*864e5));}
function daily(){
  const t=todayStr();
  if(!store.daily||store.daily.date!==t){store.daily={date:t,les:0,q:0,fl:0};save();}
  return store.daily;
}
function bump(kind){
  const d=daily();d[kind]=(d[kind]||0)+1;
  const t=todayStr(),s=store.streak;
  if(s.last!==t){s.days=(s.last===addDays(-1))?s.days+1:1;s.last=t;}
  save();
}
/* 忘却曲線: 間違い→翌日、正解のたび3日→7日→14日後、その後卒業 */
const SRS_IV=[3,7,14];
function rec(id,ok){
  const h=store.hist[id]||{o:0,x:0};
  ok?h.o++:h.x++; h.last=ok?1:0; store.hist[id]=h;
  if(!ok){store.srs[id]={due:addDays(1),st:0};}
  else if(store.srs[id]){
    const s=store.srs[id];s.st=(s.st||0)+1;
    if(s.st>SRS_IV.length)delete store.srs[id];
    else s.due=addDays(SRS_IV[s.st-1]);
  }
  bump("q");
  save();
}
function dueReviews(){const t=todayStr();return QUESTIONS.filter(q=>store.srs[q.id]&&store.srs[q.id].due<=t);}
function isWeak(id){const h=store.hist[id];return h&&(h.last===0||h.x>h.o);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ================= タブ ================= */
const view=document.getElementById("view");
const tabs=document.getElementById("tabs");
let cur="home";
tabs.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(mockTimer){if(!confirm("模試を中断してもよいですか？（結果は保存されません）"))return;stopTimer();}
  go(b.dataset.tab);
});
function go(tab){
  cur=tab;
  [...tabs.querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  window.scrollTo(0,0);
  ({home:renderHome,learn:renderLearn,practice:renderPractice,mock:renderMockTop,terms:renderTerms,stats:renderStats,links:renderLinks})[tab]();
}

/* ================= ホーム ================= */
function fieldStats(f){
  const qs=QUESTIONS.filter(q=>q.field===f);
  let done=0,ok=0,tries=0,oks=0;
  qs.forEach(q=>{const h=store.hist[q.id];if(h){done++;if(h.last===1)ok++;tries+=h.o+h.x;oks+=h.o;}});
  return {n:qs.length,done,ok,rate:tries?Math.round(oks/tries*100):0};
}
function renderHome(){
  let totalTry=0,totalOk=0,doneCnt=0;
  QUESTIONS.forEach(q=>{const h=store.hist[q.id];if(h){doneCnt++;totalTry+=h.o+h.x;totalOk+=h.o;}});
  const rate=totalTry?Math.round(totalOk/totalTry*100):0;
  const weak=QUESTIONS.filter(q=>isWeak(q.id)).length;
  let rows="";
  for(const f of ["S","M","T"]){
    const s=fieldStats(f);
    const p=Math.round(s.done/s.n*100);
    rows+=`<div class="catrow">
      <div class="t"><b>${FIELDS[f]}</b><span>${s.done}/${s.n}問 ・ 正答率${s.rate}%</span></div>
      <div class="bar"><i class="${s.rate<50?"low":s.rate<70?"mid":""}" style="width:${p}%"></i></div>
    </div>`;
  }
  const d=daily();
  const rvN=dueReviews().length;
  const lessonsLeft=LESSONS.length-Object.keys(store.les).length;
  const missions=[];
  if(lessonsLeft>0)missions.push({l:"🎓 入門講座を2本読む",cur:Math.min(d.les,2),max:2,act:"go('learn')"});
  missions.push({l:"✏️ 問題を10問解く",cur:Math.min(d.q,10),max:10,act:"startQuiz({mode:'random',count:10})"});
  missions.push({l:"⚡ フラッシュカード10枚",cur:Math.min(d.fl,10),max:10,act:"startFlash()"});
  if(rvN>0)missions.push({l:`⏰ 今日の復習を消化（残り${rvN}問）`,cur:0,max:1,act:"startQuiz({mode:'srs'})"});
  const allDone=missions.every(m=>m.cur>=m.max);
  const streak=store.streak.days>0&&(store.streak.last===todayStr()||store.streak.last===addDays(-1))?store.streak.days:0;
  let examCard;
  if(store.exam){
    const left=Math.ceil((new Date(store.exam+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/864e5);
    const hint=left>21?"入門講座と分野別演習で土台づくりの時期です":left>7?"演習+ハーフ模試で弱点をつぶす時期です":left>2?"本番模試（100問120分）で仕上げる時期です":left>=0?"⭐用語と弱点の見直しだけ。新しいことはやらない！":"";
    examCard=left>=0?`
    <div class="card" style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="text-align:center"><div style="font-size:38px;font-weight:800;line-height:1.1">${left}</div><div style="font-size:11px;opacity:.85">日後に試験</div></div>
        <div style="flex:1;font-size:13px">${hint}</div>
        <button class="btn sm" style="background:rgba(255,255,255,.2);color:#fff" onclick="delete store.exam;save();renderHome()">変更</button>
      </div>
    </div>`:`
    <div class="card"><h2>🎉 試験おつかれさまでした！</h2><button class="btn sm gray" onclick="delete store.exam;save();renderHome()">試験日をリセット</button></div>`;
  }else{
    examCard=`
    <div class="card">
      <h2>📅 試験日を決めて予約しよう</h2>
      <p style="font-size:13px">先に日程を決めるのが一発合格の近道。毎月開催・前日正午まで申込できます。</p>
      <div style="display:flex;gap:8px;margin-top:8px">
        <input type="date" id="examdate" style="flex:1;padding:10px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:14px">
        <button class="btn sm" onclick="const v=document.getElementById('examdate').value;if(v){store.exam=v;save();renderHome();}">保存</button>
      </div>
      <div class="note"><a class="link" href="https://www3.jitec.ipa.go.jp/JitesCbt/" target="_blank" rel="noopener">▶ 公式サイトで申込む（ITパスポート試験）</a></div>
    </div>`;
  }
  view.innerHTML=`
  ${examCard}
  <div class="card" style="border:2px solid ${allDone?"var(--ok)":"var(--accent)"}">
    <h2>${allDone?"🎉 今日のミッション完了！":"📋 今日のミッション"}${streak?`<span class="sp"></span><span class="chip" style="background:var(--accent-light);color:#92400e">🔥 ${streak}日連続</span>`:""}</h2>
    ${missions.map(m=>`
      <button class="rvrow" onclick="${m.act}">
        <span class="m ${m.cur>=m.max?"o":""}" style="width:24px">${m.cur>=m.max?"✓":"○"}</span>
        <span style="flex:1;text-align:left;font-size:13.5px">${m.l}</span>
        <span style="font-size:12px;color:var(--sub)">${m.cur}/${m.max}</span>
      </button>`).join("")}
    ${allDone?'<div class="note">よく頑張りました！明日もこの調子で🔥</div>':'<div class="note">タップするとすぐ始められます。全部で15分ほどです。</div>'}
  </div>
  <div class="card">
    <h2>📈 学習状況</h2>
    <div class="grid3">
      <div class="stat"><div class="v">${doneCnt}<small style="font-size:12px">/${QUESTIONS.length}</small></div><div class="l">学習済み</div></div>
      <div class="stat"><div class="v">${rate}<small style="font-size:12px">%</small></div><div class="l">累計正答率</div></div>
      <div class="stat"><div class="v">${weak}</div><div class="l">弱点問題</div></div>
    </div>
    <div style="margin-top:10px">${rows}</div>

let quiz=null;
function startQuiz(opt){
  let pool;
  switch(opt.mode){
    case "field": pool=QUESTIONS.filter(q=>q.field===opt.field);break;
    case "cat": pool=QUESTIONS.filter(q=>q.cat===opt.cat);break;
    case "weak": pool=QUESTIONS.filter(q=>isWeak(q.id));break;
    case "bm": pool=QUESTIONS.filter(q=>store.bm.includes(q.id));break;
    case "all": pool=QUESTIONS.slice();break;
    case "basic": pool=QUESTIONS.filter(q=>BASIC_IDS.includes(q.id));break;
    case "ids": pool=QUESTIONS.filter(q=>opt.ids.includes(q.id));break;
    case "srs": pool=dueReviews();break;
    default: pool=QUESTIONS.slice();
  }
  if(!pool.length){alert(opt.mode==="weak"?"弱点問題はありません。まずは演習を進めましょう！":opt.mode==="srs"?"今日の復習はありません。明日また確認しましょう！":"対象の問題がありません。");return;}
  pool=shuffle(pool);
  if(opt.count)pool=pool.slice(0,opt.count);
  quiz={list:pool,i:0,ok:0,answered:false,results:[]};
  renderQ();
}
function renderQ(){
  const q=quiz.list[quiz.i];
  const bm=store.bm.includes(q.id);
  view.innerHTML=`
  <div class="topbar">
    <button class="iconbtn" onclick="quitQuiz()">← 終了</button>
    <span class="sp"></span>
    <span style="font-size:13px;color:var(--sub)">${quiz.i+1} / ${quiz.list.length}</span>
