<style>
:root{
  --primary:#1d4ed8; --primary-dark:#1e3a8a; --primary-light:#dbeafe;
  --accent:#f59e0b; --accent-light:#fef3c7;
  --danger:#dc2626; --danger-light:#fee2e2;
  --ok:#16a34a; --ok-light:#dcfce7;
  --bg:#f3f5f9; --card:#ffffff; --text:#1f2937; --sub:#6b7280; --line:#e5e7eb;
  --radius:16px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI",Meiryo,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;font-size:15px;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 24px}
header.app{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
  padding:14px 18px 12px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.app h1{font-size:17px;font-weight:700;letter-spacing:.02em}
header.app .sub{font-size:11px;opacity:.85}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:12px;font-size:15px}
.btn{display:block;width:100%;padding:14px;background:var(--primary);color:#fff;font-weight:700;
  text-align:center;transition:opacity .15s}
.btn:active{opacity:.8}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.warn{background:var(--accent)}
.btn.gray{background:#e5e7eb;color:var(--text)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;display:inline-block;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--primary-light);border-radius:12px;padding:10px;text-align:center}
.stat .v{font-size:22px;font-weight:800;color:var(--primary-dark)}
.stat .l{font-size:11px;color:var(--sub)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:4px;transition:width .4s}
.bar>i.low{background:var(--danger)} .bar>i.mid{background:var(--accent)}
.catrow{padding:9px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catrow .t{display:flex;justify-content:space-between;font-size:13px}
.catrow .t b{font-size:13.5px}
.catrow .t span{color:var(--sub);font-size:12px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700}
.chip.cat{background:var(--primary-light);color:var(--primary-dark)}
.chip.field-S{background:#fce7f3;color:#9d174d}
.chip.field-M{background:#ffedd5;color:#9a3412}
.chip.field-T{background:#dcfce7;color:#166534}
.chip.weak{background:var(--danger-light);color:var(--danger)}
.chip.ok{background:var(--ok-light);color:var(--ok)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;padding:8px 0 6px;font-size:10.5px;color:var(--sub);
  display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:0}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--primary);font-weight:700}
.qtext{font-size:15px;white-space:pre-wrap;margin-bottom:14px}
.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14.5px;
  line-height:1.6;transition:border-color .1s}
.choice .n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.choice.sel{border-color:var(--primary);background:var(--primary-light)}
.choice.sel .n{background:var(--primary);color:#fff}
.choice.correct{border-color:var(--ok);background:var(--ok-light)}
.choice.correct .n{background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--danger);background:var(--danger-light)}
.choice.wrong .n{background:var(--danger);color:#fff}
.choice:disabled{cursor:default;opacity:1;color:var(--text)}
.judge{font-size:40px;font-weight:800;text-align:center;margin:6px 0}
.judge.ok{color:var(--ok)} .judge.ng{color:var(--danger)}
.qhead{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.qhead .sp{flex:1}
.bmbtn{background:none;font-size:22px;padding:2px 6px;filter:grayscale(1);opacity:.45}
.bmbtn.on{filter:none;opacity:1}
.pbar{height:5px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:16px;color:var(--primary-dark)}
.timer.low{color:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.qgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.qgrid button{aspect-ratio:1;border-radius:8px;background:var(--bg);font-size:11.5px;font-weight:600;
  border:1.5px solid var(--line);position:relative}
.qgrid button.done{background:var(--primary-light);border-color:var(--primary)}
.qgrid button.now{outline:2px solid var(--accent)}
.qgrid button.flag::after{content:"⚑";position:absolute;top:-4px;right:-1px;font-size:9px;color:var(--accent)}
.qgrid button.right{background:var(--ok-light);border-color:var(--ok)}
.qgrid button.miss{background:var(--danger-light);border-color:var(--danger)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:80vh;overflow-y:auto}
.score-big{text-align:center;padding:8px 0 4px}
.score-big .n{font-size:52px;font-weight:800;color:var(--primary-dark)}
.score-big .d{font-size:14px;color:var(--sub)}
.passband{text-align:center;border-radius:12px;padding:10px;font-weight:800;font-size:17px;margin:10px 0}
.passband.pass{background:var(--ok-light);color:var(--ok)}
.passband.fail{background:var(--danger-light);color:var(--danger)}
.rvrow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line);
  width:100%;background:none;text-align:left;font-size:13px;border-radius:0}
.rvrow .m{font-weight:800;width:20px;text-align:center}
.rvrow .m.o{color:var(--ok)} .rvrow .m.x{color:var(--danger)}
.rvrow .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin-top:8px}
.expbox{background:#eff6ff;border-left:4px solid var(--primary);padding:10px 12px;border-radius:0 10px 10px 0;
  font-size:13.5px;line-height:1.7;margin:4px 0 12px;white-space:pre-wrap}
.hist{font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.hist:last-child{border-bottom:none}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:24px 0}
h3.sec{font-size:13px;color:var(--sub);margin:16px 2px 8px;font-weight:600}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar .sp{flex:1}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--text)}
a.link{color:var(--primary);word-break:break-all;font-size:13.5px}
.linkrow{padding:10px 2px;border-bottom:1px solid var(--line)}
.linkrow:last-child{border-bottom:none}
.linkrow .ti{font-size:13.5px;font-weight:700;margin-bottom:2px}
.linkrow .dt{font-size:11.5px;color:var(--sub)}
table.info{width:100%;border-collapse:collapse;font-size:13px}
table.info th,table.info td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
table.info th{background:var(--primary-light);color:var(--primary-dark);white-space:nowrap;font-size:12.5px}
</style>

<script>
"use strict";
/* ================= 問題データ =================
   公開過去問題（令和元〜8年度）の頻出テーマを基に再構成。
   answer は choices の 0 始まりインデックス。 */
const QUESTIONS=[
{"id":"S01","field":"S","cat":"企業活動","question":"ある製品の販売単価は200円、1個当たりの変動費は120円、固定費は400,000円である。損益分岐点となる販売数量は何個か。","choices":["2,000個","3,334個","5,000個","6,667個"],"answer":2,"exp":"損益分岐点販売数量＝固定費÷（販売単価−変動費単価）で求めます。\n400,000÷(200−120)＝400,000÷80＝5,000個。\n1個売るごとに得られる限界利益80円で固定費を回収できる数量が損益分岐点です。"},
{"id":"S02","field":"S","cat":"企業活動","question":"CSR（Corporate Social Responsibility）の説明として、最も適切なものはどれか。","choices":["企業が、株主への配当を最大化することだけを目的として経営を行うこと","企業が、法令や社会規範を守り、環境や地域社会などの利害関係者に配慮して活動することによって、社会に対する責任を果たすこと","企業が、自社の技術やノウハウを外部に公開せず、競争優位を維持すること","企業が、経営者の親族だけで経営を行い、意思決定を迅速化すること"],"answer":1,"exp":"CSRは「企業の社会的責任」です。利益追求だけでなく、法令遵守（コンプライアンス）、環境保護、地域貢献など、株主・従業員・顧客・地域社会といった幅広いステークホルダ（利害関係者）に配慮した経営を行うことを指します。"},
{"id":"S03","field":"S","cat":"企業活動","question":"BCP（Business Continuity Plan）の説明として、適切なものはどれか。","choices":["企業の業績を管理するために、財務指標を用いて四半期ごとに評価する計画","災害や事故などの緊急事態が発生した場合でも、重要な事業を中断させず、中断しても可能な限り短い期間で復旧させるための計画","新製品を市場に投入するための販売促進計画","従業員の能力開発を計画的に行うための教育訓練計画"],"answer":1,"exp":"BCPは「事業継続計画」です。地震・水害・システム障害・感染症などの緊急事態でも、中核事業を継続または早期復旧できるよう、あらかじめ対応方針・体制・手順を定めておく計画を指します。策定・運用の活動全体はBCM（事業継続管理）と呼ばれます。"},
{"id":"S04","field":"S","cat":"企業活動","question":"PDCAサイクルのC（Check）で行う活動として、適切なものはどれか。","choices":["業務の実施計画を策定する","計画に基づいて業務を実施する","業務の実施結果を測定し、計画どおりに実施されているかを評価する","評価結果に基づいて業務の改善策を実施する"],"answer":2,"exp":"PDCAはPlan（計画）→Do（実行）→Check（評価）→Act（改善）を繰り返す管理サイクルです。Checkでは、実施結果を測定・分析して計画との差異を評価します。改善策の実施はAct、計画策定はPlan、実施はDoに当たります。"},
{"id":"S05","field":"S","cat":"企業活動","question":"ある企業の貸借対照表において、資産合計が1,000百万円、負債合計が600百万円であるとき、自己資本比率は何％か。","choices":["20％","40％","60％","67％"],"answer":1,"exp":"自己資本（純資産）＝資産−負債＝1,000−600＝400百万円。\n自己資本比率＝自己資本÷総資産×100＝400÷1,000×100＝40％。\n自己資本比率が高いほど、借入れに依存しない安定した財務体質といえます。"},
{"id":"S06","field":"S","cat":"企業活動","question":"項目を出現頻度の高い順に並べた棒グラフと、その累積比率を示す折れ線グラフを組み合わせた図であり、重点的に管理すべき項目の把握（ABC分析）に用いられるものはどれか。","choices":["ヒストグラム","散布図","パレート図","レーダチャート"],"answer":2,"exp":"パレート図は、件数の多い順に並べた棒グラフに累積比率の折れ線を重ねた図で、「上位の少数項目が全体の大部分を占める」ことを可視化します。ABC分析で重点管理対象（Aランク）を決める際に使われます。ヒストグラムは度数分布、散布図は2変数の相関、レーダチャートは複数項目のバランスを見る図です。"},
{"id":"S07","field":"S","cat":"企業活動","question":"複数の専門家に対して同じ質問を繰り返し行い、回答結果をフィードバックしながら意見を収束させていく、技術動向などの予測に用いられる手法はどれか。","choices":["ブレーンストーミング","デルファイ法","ロールプレイング","ワークデザイン法"],"answer":1,"exp":"デルファイ法は、専門家へのアンケートを「回答の集計結果を示しながら」複数回繰り返し、意見を統計的に収束させる予測手法です。ブレーンストーミングは自由にアイディアを出し合う発想法で、批判禁止・自由奔放・質より量・便乗歓迎がルールです。"},
{"id":"S08","field":"S","cat":"企業活動","question":"ダイバーシティマネジメントの説明として、最も適切なものはどれか。","choices":["従業員の勤務時間を全員一律に固定して管理すること","性別、年齢、国籍、障害の有無、価値観などの多様性を受け入れ、それを組織の競争力向上に生かす経営上の取組","自社の業務の一部を海外の企業に委託すること","従業員を職能別に分けて専門性を高めること"],"answer":1,"exp":"ダイバーシティ（多様性）マネジメントは、多様な人材の個性や価値観の違いを積極的に受け入れ、新たな発想やイノベーションにつなげて企業の成長に生かす取組です。単なる雇用機会の均等にとどまらず、競争力の源泉として多様性を活用する点がポイントです。"},
{"id":"S09","field":"S","cat":"企業活動","question":"OJT（On the Job Training）の説明として、適切なものはどれか。","choices":["職場を離れて、集合研修や通信教育などによって行う教育訓練","日常の業務を通じて、上司や先輩が部下や後輩に対して必要な知識や技能を計画的に習得させる教育訓練","自らの意思で、業務時間外に資格取得などの学習を行うこと","eラーニングシステムを利用して、自分のペースで学習を行うこと"],"answer":1,"exp":"OJTは実際の業務を通じて行う教育訓練です。職場を離れて行う集合研修などはOFF-JT（Off the Job Training）、自発的な学習は自己啓発と呼ばれます。OJTは実践的なスキルが身に付きやすい一方、指導者の力量に左右されやすい特徴があります。"},
{"id":"S10","field":"S","cat":"企業活動","question":"株式会社における最高意思決定機関はどれか。","choices":["取締役会","株主総会","監査役会","経営会議"],"answer":1,"exp":"株主総会は株式会社の最高意思決定機関で、取締役の選任・解任、定款の変更、剰余金の配当など会社の基本的事項を決定します。取締役会は業務執行の意思決定機関、監査役（会）は取締役の職務執行を監査する機関です。"},
{"id":"S11","field":"S","cat":"法務","question":"従業員が法人の業務として職務上作成するプログラムの著作権に関する記述のうち、適切なものはどれか。ここで、契約や勤務規則に特段の定めはないものとする。","choices":["著作権は、作成した従業員に帰属する","著作権は、法人に帰属する","著作権は、法人と従業員の共有となる","プログラムには著作権は発生しない"],"answer":1,"exp":"法人の発意に基づき従業員が職務上作成するプログラムの著作物は「職務著作（法人著作）」となり、特段の定めがない限り著作権は法人に帰属します。なお、プログラムは著作権法で保護される著作物ですが、プログラム言語やアルゴリズム自体は保護対象外です。"},
{"id":"S12","field":"S","cat":"法務","question":"産業財産権に含まれない権利はどれか。","choices":["特許権","実用新案権","著作権","商標権"],"answer":2,"exp":"産業財産権は特許権・実用新案権・意匠権・商標権の4つで、いずれも特許庁への出願・登録によって権利が発生します。著作権は知的財産権の一種ですが産業財産権には含まれず、著作物を創作した時点で自動的に発生します（無方式主義）。"},
{"id":"S13","field":"S","cat":"法務","question":"不正アクセス禁止法において、禁止されている行為に該当するものはどれか。","choices":["会社のPCで業務に関係のないWebサイトを閲覧する行為","他人の利用者IDとパスワードを、本人に無断で第三者に教える行為","電車内で他人のスマートフォンの画面をのぞき見る行為","大量の電子メールを送り付けてサーバを停止させる行為"],"answer":1,"exp":"不正アクセス禁止法は、①他人のID・パスワードを無断で使ってログインする行為（なりすまし）、②セキュリティホールを突く侵入行為、③他人のID・パスワードを無断で第三者に提供する行為（不正アクセス助長行為）、④フィッシングによる識別符号の取得などを禁止しています。大量メール送付によるサーバ停止は威力業務妨害等に当たります。"},
{"id":"S14","field":"S","cat":"法務","question":"個人情報保護法における「要配慮個人情報」に該当するものはどれか。","choices":["個人の氏名と電話番号","個人の病歴","個人の勤務先","個人のメールアドレス"],"answer":1,"exp":"要配慮個人情報とは、人種、信条、社会的身分、病歴、犯罪の経歴、犯罪被害の事実など、不当な差別や偏見が生じないように取扱いに特に配慮を要する個人情報です。取得には原則として本人の事前同意が必要で、オプトアウトによる第三者提供はできません。"},
{"id":"S15","field":"S","cat":"法務","question":"労働者派遣における派遣労働者の就業に関する記述のうち、適切なものはどれか。","choices":["派遣労働者への業務上の指揮命令は、派遣元事業主が行う","派遣労働者への業務上の指揮命令は、派遣先事業主が行う","派遣労働者と雇用契約を結ぶのは、派遣先事業主である","派遣労働者への賃金の支払は、派遣先事業主が行う"],"answer":1,"exp":"労働者派遣では、雇用契約は派遣元と労働者の間で結ばれ、賃金も派遣元が支払います。一方、業務上の指揮命令は派遣先が行います。「雇用関係は派遣元、指揮命令関係は派遣先」という関係を押さえておきましょう。これに対し請負では、指揮命令も請負事業者側が行います。"},
{"id":"S16","field":"S","cat":"法務","question":"請負契約に関する記述として、適切なものはどれか。","choices":["請負人は、注文者の従業員の指揮命令に従って作業を行う","請負人は、仕事の完成に対して責任を負う","請負契約では、注文者が請負人の労働者の労働時間を管理する","請負契約は、仕事の完成ではなく労働力の提供を目的とする"],"answer":1,"exp":"請負契約は「仕事の完成」を目的とする契約で、請負人は完成物に対して契約不適合責任を負います。作業者への指揮命令は請負人（受託側）が行い、注文者が直接指揮命令すると偽装請負として違法になります。労働力の提供自体を目的とするのは労働者派遣契約です。"},
{"id":"S17","field":"S","cat":"法務","question":"製造物責任法（PL法）に関する記述として、適切なものはどれか。","choices":["製造物の欠陥によって人の生命、身体又は財産に損害が生じた場合、被害者は製造業者の過失を証明しなければ損害賠償を請求できない","製造物の欠陥によって人の生命、身体又は財産に損害が生じた場合、製造業者に過失がなくても、被害者は欠陥の存在などを証明すれば損害賠償を請求できる","ソフトウェア単体の欠陥も、製造物責任法の対象となる","製造物責任法の対象となるのは、製造業者の故意による欠陥だけである"],"answer":1,"exp":"PL法では、製造物の「欠陥」により損害が生じたことを証明すれば、製造業者の過失を証明しなくても損害賠償を請求できます（無過失責任）。対象は製造・加工された動産であり、ソフトウェア単体は対象外です（ただし組み込まれた機器全体としては対象になり得ます）。"},
{"id":"S18","field":"S","cat":"法務","question":"刑法で定められている「不正指令電磁的記録に関する罪」の対象となる行為はどれか。","choices":["他人のIDとパスワードを使って無断でシステムにログインする行為","正当な理由なく、コンピュータウイルスを作成したり提供したりする行為","会社の営業秘密を不正に持ち出す行為","Webサイトに虚偽の広告を掲載する行為"],"answer":1,"exp":"不正指令電磁的記録に関する罪（いわゆるウイルス作成罪）は、正当な理由なくコンピュータウイルスなどの不正プログラムを作成・提供・供用・取得・保管する行為を処罰します。他人のIDでのログインは不正アクセス禁止法、営業秘密の不正持ち出しは不正競争防止法の対象です。"},
{"id":"S19","field":"S","cat":"法務","question":"OSS（Open Source Software）に関する記述として、適切なものはどれか。","choices":["OSSの著作権は放棄されている","OSSは、ソースコードが公開されており、ライセンス条件に従えば改変や再配布ができる","OSSを利用したシステムを、商用目的で利用することはできない","OSSには、利用に関するライセンス条件は存在しない"],"answer":1,"exp":"OSSはソースコードが公開され、ライセンス（GPL、Apache License、MITなど）の条件に従えば自由に利用・改変・再配布できるソフトウェアです。著作権は放棄されておらず、商用利用も可能です。原則として無保証であり、サポートは自己責任またはサポート企業の利用となります。"},
{"id":"S20","field":"S","cat":"法務","question":"公益通報者保護法の説明として、適切なものはどれか。","choices":["個人情報を取り扱う事業者の義務を定めた法律","労働者が事業者の法令違反行為を通報したことを理由とする解雇などの不利益な取扱いから、通報者を保護する法律","国民が行政機関の保有する情報の開示を請求できる権利を定めた法律","消費者と事業者の間の契約トラブルから消費者を保護する法律"],"answer":1,"exp":"公益通報者保護法は、企業などの法令違反行為を労働者が所定の通報先（事業者内部、行政機関、報道機関等）に通報（内部告発）した場合に、解雇・降格・減給などの不利益な取扱いを受けないよう通報者を保護する法律です。コンプライアンス経営を支える仕組みの一つです。"},
{"id":"S21","field":"S","cat":"経営戦略マネジメント","question":"SWOT分析において、自社の外部環境を分析する要因の組合せとして、適切なものはどれか。","choices":["強み、弱み","強み、機会","機会、脅威","弱み、脅威"],"answer":2,"exp":"SWOT分析は、内部環境を「強み（Strength）」「弱み（Weakness）」、外部環境を「機会（Opportunity）」「脅威（Threat）」に分けて整理する手法です。自社でコントロールできる要因（技術力、ブランドなど）が内部環境、市場動向・法規制・競合などコントロールできない要因が外部環境です。"},
{"id":"S22","field":"S","cat":"経営戦略マネジメント","question":"PPM（Product Portfolio Management）において、市場成長率が低く、市場占有率が高い事業を表すものはどれか。","choices":["花形","金のなる木","問題児","負け犬"],"answer":1,"exp":"PPMは市場成長率と市場占有率の2軸で事業を4つに分類します。\n・花形＝成長率高・占有率高（維持に投資が必要）\n・金のなる木＝成長率低・占有率高（安定した資金源）\n・問題児＝成長率高・占有率低（投資判断が必要）\n・負け犬＝成長率低・占有率低（撤退検討）\n「金のなる木」で得た資金を「問題児」に投資するのが定石です。"},
{"id":"S23","field":"S","cat":"経営戦略マネジメント","question":"マーケティングミックスの4Pに含まれないものはどれか。","choices":["製品（Product）","価格（Price）","流通（Place）","プロセス（Process）"],"answer":3,"exp":"4Pは売り手側の視点によるProduct（製品）、Price（価格）、Place（流通チャネル）、Promotion（販売促進）です。買い手側の視点で対応させたものが4C（顧客価値・顧客コスト・利便性・コミュニケーション）です。"},
{"id":"S24","field":"S","cat":"経営戦略マネジメント","question":"コアコンピタンスの説明として、最も適切なものはどれか。","choices":["他社との業務提携によって獲得した販売チャネル","競合他社にはまねのできない、自社ならではの中核となる能力","業界内の全ての企業が共通して保有している標準的な技術","外部から調達した経営資源"],"answer":1,"exp":"コアコンピタンスは、長年の企業活動により蓄積された、他社が容易に模倣できない中核的な強み（独自技術・ノウハウなど）です。これを軸に競争優位を築く経営をコアコンピタンス経営といいます。"},
{"id":"S25","field":"S","cat":"経営戦略マネジメント","question":"CRM（Customer Relationship Management）の目的として、最も適切なものはどれか。","choices":["生産計画に基づいて資材の所要量を計算し、在庫を最適化する","顧客に関する情報を一元管理・分析し、顧客との長期的な関係を築いて顧客満足度と収益の向上を図る","従業員の勤怠情報を管理し、給与計算を自動化する","部品の調達から製品の販売までの物流を最適化する"],"answer":1,"exp":"CRM（顧客関係管理）は、購買履歴や問合せ履歴など顧客情報を一元管理・共有し、一人ひとりに合った対応で顧客満足度を高め、長期的な関係（顧客生涯価値：LTV）を最大化する経営手法です。資材所要量計算はMRP、物流最適化はSCMです。"},
{"id":"S26","field":"S","cat":"経営戦略マネジメント","question":"バランススコアカード（BSC）で用いられる四つの視点として、適切な組合せはどれか。","choices":["財務、顧客、業務プロセス、学習と成長","財務、技術、市場、組織","売上、利益、資産、負債","計画、実行、評価、改善"],"answer":0,"exp":"バランススコアカードは、財務の視点だけでなく「財務」「顧客」「（内部）業務プロセス」「学習と成長」の4視点から企業のビジョンと戦略を具体的な目標・評価指標（KPI）に落とし込み、バランスよく業績を管理する手法です。"},
{"id":"S27","field":"S","cat":"経営戦略マネジメント","question":"ニッチ戦略の説明として、適切なものはどれか。","choices":["市場全体を対象に、低価格を武器としてシェア拡大を図る戦略","大手企業が参入していない特定の隙間市場に経営資源を集中し、その市場での優位を築く戦略","競合他社の製品を模倣して、開発コストを抑える戦略","複数の企業が共同で新しい市場を開拓する戦略"],"answer":1,"exp":"ニッチ戦略は、大企業が狙わない小規模で専門性の高い市場（隙間市場）に経営資源を集中して独自の地位を築く戦略で、経営資源の限られる中小企業に適しています。市場全体を低価格で狙うのはコストリーダーシップ戦略です。"},
{"id":"S28","field":"S","cat":"経営戦略マネジメント","question":"アンゾフの成長マトリクスにおいて、既存の製品を新しい市場に投入して成長を図る戦略はどれか。","choices":["市場浸透","市場開拓","製品開発","多角化"],"answer":1,"exp":"アンゾフの成長マトリクスは製品（既存／新規）と市場（既存／新規）の組合せで4つの成長戦略を示します。\n・既存製品×既存市場＝市場浸透\n・既存製品×新市場＝市場開拓（例：海外進出）\n・新製品×既存市場＝製品開発\n・新製品×新市場＝多角化"},
{"id":"S29","field":"S","cat":"技術戦略マネジメント","question":"技術経営において、研究開発の成果を事業化につなげる際に存在する障壁のうち、「死の谷」の説明として適切なものはどれか。","choices":["基礎研究の成果を製品開発に結び付ける際の障壁","開発した製品を事業化し、収益を上げるまでに存在する資金や人材などの障壁","事業化した製品が市場で他社との競争に生き残る際の障壁","新技術が社会に受け入れられず普及しない障壁"],"answer":1,"exp":"技術経営の3つの障壁は、\n・魔の川：研究→開発（製品化）の障壁\n・死の谷：開発→事業化の障壁（資金・人材の不足）\n・ダーウィンの海：事業化→産業化の障壁（市場での競争）\nです。「死の谷」は開発に成功しても事業化までの資金調達などで挫折しやすいことを表します。"},
{"id":"S30","field":"S","cat":"技術戦略マネジメント","question":"新製品の普及において、初期採用者（アーリーアダプタ）と前期追随者（アーリーマジョリティ）の間に存在する、普及の大きな障壁を表す用語はどれか。","choices":["イノベーションのジレンマ","キャズム","ハッカソン","カニバリゼーション"],"answer":1,"exp":"キャズム（深い溝）は、新しもの好きの初期市場からメインストリーム市場へ移行する際の大きな溝を指します。ここを越えられないと製品は普及しません。イノベーションのジレンマは、大企業が既存製品の改良に注力するあまり破壊的イノベーションに対応できず市場地位を失う現象です。"},
{"id":"S31","field":"S","cat":"技術戦略マネジメント","question":"オープンイノベーションの説明として、最も適切なものはどれか。","choices":["自社の研究部門だけで新技術の開発を完結させること","大学、他企業、スタートアップなど外部の技術やアイディアを積極的に取り入れて、革新的な価値を創出すること","自社技術の特許を取得せず、無償で公開すること","製品の設計図を社内の全部門で共有すること"],"answer":1,"exp":"オープンイノベーションは、組織の内部と外部の知識・技術を意図的に組み合わせて新たな価値を生み出す取組です。産学連携、スタートアップとの協業、API公開などが例です。自社内だけで完結する従来型はクローズドイノベーションと呼ばれます。"},
{"id":"S32","field":"S","cat":"技術戦略マネジメント","question":"技術ロードマップの説明として、適切なものはどれか。","choices":["技術者の育成計画を職位ごとに整理した表","将来の市場ニーズや技術動向を予測し、自社の技術開発の目標と道筋を時間軸上に示したもの","現在保有している特許の一覧","製品の製造工程を図示したもの"],"answer":1,"exp":"技術ロードマップは、横軸に時間、縦軸に市場・製品・技術などを取り、将来の技術進展の見通しと自社の研究開発戦略を時系列で示した図です。関係者間で将来ビジョンを共有し、研究開発投資の判断に活用します。"},
{"id":"S33","field":"S","cat":"ビジネスインダストリ","question":"IoT（Internet of Things）の事例として、最も適切なものはどれか。","choices":["会社のPCで表計算ソフトを使って売上を集計する","自宅のエアコンをスマートフォンから遠隔操作し、稼働状況をインターネット経由で確認する","店頭でカタログを見ながら商品を選ぶ","CDに音楽データを記録して配布する"],"answer":1,"exp":"IoTは、家電・自動車・センサなど様々な「モノ」がインターネットにつながり、情報をやり取りする仕組みです。遠隔操作・遠隔監視・データ収集による予知保全などが代表的な活用例です。"},
{"id":"S34","field":"S","cat":"ビジネスインダストリ","question":"RFIDを利用したシステムの特徴として、適切なものはどれか。","choices":["バーコードを1枚ずつスキャナに読み取らせる必要がある","電波を利用して、ICタグの情報を非接触で読み取ることができ、複数のタグを一括して読み取ることも可能である","データの読み取りには必ず目視確認が必要である","タグとリーダを有線で接続する必要がある"],"answer":1,"exp":"RFIDは電波でICタグと交信する自動認識技術です。非接触・一括読取り・箱の中でも読取り可能などの特徴があり、在庫管理、交通系ICカード、アパレルのセルフレジなどに活用されています。バーコードと違い、隠れていても読み取れる点が強みです。"},
{"id":"S35","field":"S","cat":"ビジネスインダストリ","question":"組込みシステムの説明として、適切なものはどれか。","choices":["汎用的な業務処理を行うために、オフィスのPCにインストールされるソフトウェア","家電製品や自動車などの機器に内蔵され、特定の機能を実現するためのコンピュータシステム","インターネット上で提供される検索サービス","大量のデータを保管するためのデータセンター"],"answer":1,"exp":"組込みシステムは、炊飯器・エアコン・自動車・医療機器などの機器に組み込まれ、その機器特有の機能を制御する専用のコンピュータシステムです。リアルタイム性や省資源性が求められます。IoTの普及により重要性が高まっています。"},
{"id":"S36","field":"S","cat":"ビジネスインダストリ","question":"個人がフリーマーケットアプリを使って、不要になった私物を他の個人に販売する電子商取引の形態はどれか。","choices":["BtoB","BtoC","CtoC","BtoE"],"answer":2,"exp":"C（Consumer：消費者）同士の取引なのでCtoCです。フリマアプリやネットオークションが代表例です。BtoBは企業間取引、BtoCは企業対消費者（ネット通販など）、BtoEは企業対従業員の取引です。"},
{"id":"S37","field":"S","cat":"ビジネスインダストリ","question":"POSシステムの説明として、適切なものはどれか。","choices":["商品の販売時点で、商品名・数量・時刻などの販売情報を収集し、売れ筋分析や在庫管理に活用するシステム","銀行の預金口座間で資金を移動するシステム","企業間で受発注データを電子的に交換するシステム","工場の生産ラインを自動制御するシステム"],"answer":0,"exp":"POS（Point Of Sale：販売時点情報管理）システムは、レジで商品バーコードを読み取り、「何が・いつ・いくつ売れたか」をリアルタイムに収集します。売れ筋・死に筋分析や発注の最適化に活用されます。企業間の受発注データ交換はEDIです。"},
{"id":"S38","field":"S","cat":"ビジネスインダストリ","question":"フィンテック（FinTech）の説明として、最も適切なものはどれか。","choices":["金融とITを融合させて、スマートフォン決済やロボアドバイザによる資産運用など、革新的な金融サービスを生み出す取組","工場の生産性を向上させるための自動化技術","農業にITを活用して生産性を高める取組","教育分野にITを導入して学習効果を高める取組"],"answer":0,"exp":"FinTechはFinance（金融）とTechnology（技術）を組み合わせた造語です。キャッシュレス決済、仮想通貨（暗号資産）、クラウドファンディング、AIによる与信審査などが例です。農業×ITはアグリテック、教育×ITはEdTechと呼ばれます。"},
{"id":"S39","field":"S","cat":"ビジネスインダストリ","question":"業務で生成AIを利用する際の留意点として、最も適切なものはどれか。","choices":["生成AIの出力は常に正確なので、確認せずにそのまま利用してよい","生成AIの出力には誤り（ハルシネーション）が含まれることがあるため、人間が内容の正確性を確認してから利用する","機密情報を入力しても、外部に漏えいするおそれはない","生成AIが出力した文章に著作権上の問題が生じることはない"],"answer":1,"exp":"生成AIは、事実と異なる内容をもっともらしく出力する「ハルシネーション」を起こすことがあるため、人間による事実確認が不可欠です。また、入力した機密情報が学習に利用され漏えいするリスクや、出力が既存著作物に類似して著作権を侵害するリスクにも注意が必要です。"},
{"id":"S40","field":"S","cat":"ビジネスインダストリ","question":"MaaS（Mobility as a Service）の説明として、最も適切なものはどれか。","choices":["自動車の製造工程を自動化するサービス","電車、バス、タクシー、シェアサイクルなど複数の交通手段を、ITを活用して検索・予約・決済まで一括して提供するサービス","カーナビゲーションシステムのソフトウェアを更新するサービス","ガソリンスタンドの営業情報を提供するサービス"],"answer":1,"exp":"MaaSは、出発地から目的地までの移動を一つのサービスとして捉え、複数の交通手段の検索・予約・決済をスマートフォンアプリなどでシームレスに提供する概念です。地域の交通課題解決や観光振興への活用が期待されています。"},
{"id":"S41","field":"S","cat":"システム戦略","question":"ERP（Enterprise Resource Planning）パッケージの説明として、適切なものはどれか。","choices":["販売部門だけで利用する顧客管理ソフトウェア","会計、人事、生産、販売、在庫などの企業の基幹業務のデータを統合的に管理し、経営資源の全体最適を図るためのソフトウェア","電子メールとスケジュール管理だけを行うソフトウェア","Webサイトのアクセス状況を分析するソフトウェア"],"answer":1,"exp":"ERPは「企業資源計画」で、基幹業務（会計・人事・生産・販売・物流など）のデータを一つのデータベースで統合管理し、経営資源（ヒト・モノ・カネ・情報）の全体最適化と迅速な経営判断を支援します。"},
{"id":"S42","field":"S","cat":"システム戦略","question":"BPR（Business Process Reengineering）の説明として、最も適切なものはどれか。","choices":["既存の業務プロセスを前提として、部分的な改善を繰り返すこと","既存の組織や業務プロセスを抜本的に見直し、業務の流れを再設計すること","業務プロセスを文書化して保管すること","業務を海外の企業に委託すること"],"answer":1,"exp":"BPRは、既存の業務のやり方を白紙から見直し、業務プロセスを抜本的に再設計する取組です。部分的・継続的な改善・管理を行うのはBPM（Business Process Management）で、抜本的（BPR）か継続的（BPM）かで区別します。"},
{"id":"S43","field":"S","cat":"システム戦略","question":"クラウドサービスのうち、アプリケーションソフトウェアをインターネット経由で利用者に提供するサービスはどれか。","choices":["IaaS","PaaS","SaaS","DaaS"],"answer":2,"exp":"クラウドサービスは提供する層で分類されます。\n・SaaS：アプリケーションまで提供（例：Gmail、Microsoft 365）\n・PaaS：アプリ開発・実行環境（OS・ミドルウェア）を提供\n・IaaS：サーバ・ストレージなどインフラを提供\n・DaaS：仮想デスクトップ環境を提供"},
{"id":"S44","field":"S","cat":"システム戦略","question":"RPA（Robotic Process Automation）の導入効果として、最も適切なものはどれか。","choices":["工場の組立作業を産業用ロボットが代替する","データ入力や転記などの定型的な事務作業をソフトウェアが代行し、作業時間の短縮とミスの削減が期待できる","経営戦略の立案をAIが完全に代行する","顧客との商談をロボットが行う"],"answer":1,"exp":"RPAは、PCで行う定型的な事務作業（データ入力、転記、照合など）をソフトウェアロボットで自動化する技術です。単純作業から人間を解放し、生産性向上とヒューマンエラー削減が期待できます。物理的なロボットではない点、非定型業務は苦手な点がポイントです。"},
{"id":"S45","field":"S","cat":"システム戦略","question":"BYOD（Bring Your Own Device）の説明として、適切なものはどれか。","choices":["会社が貸与したPCを自宅に持ち帰って業務を行うこと","従業員が私物のスマートフォンやPCなどを業務に利用すること","会社が全従業員に同一機種のスマートフォンを支給すること","業務用の機器を廃棄する際のルール"],"answer":1,"exp":"BYODは従業員の私物端末を業務利用することです。端末調達コストの削減や利便性向上が期待できる一方、私物端末は会社の管理が及びにくく、情報漏えいやマルウェア感染などのセキュリティリスクへの対策（MDM導入やルール整備）が課題となります。"},
{"id":"S46","field":"S","cat":"システム戦略","question":"BI（Business Intelligence）ツールの活用方法として、最も適切なものはどれか。","choices":["蓄積された販売データや顧客データを分析・可視化し、経営上の意思決定に役立てる","文書ファイルを暗号化して保管する","電子メールを一斉配信する","Webサイトを作成する"],"answer":0,"exp":"BIツールは、企業内に蓄積された大量のデータを集計・分析し、グラフやダッシュボードで可視化して意思決定を支援するツールです。データに基づいて判断する「データ駆動型（データドリブン）経営」を支える基盤となります。"},
{"id":"S47","field":"S","cat":"システム戦略","question":"DX（デジタルトランスフォーメーション）の説明として、最も適切なものはどれか。","choices":["紙の書類をスキャンして電子ファイルとして保存すること","既存の業務プロセスをそのままにして、新しいPCを導入すること","データとデジタル技術を活用して、製品・サービスやビジネスモデル、業務や組織、企業文化までも変革し、競争上の優位性を確立すること","社内の全システムをクラウドに移行すること"],"answer":2,"exp":"DXは単なるデジタル化（デジタイゼーション／デジタライゼーション）にとどまらず、データとデジタル技術を活用してビジネスモデルや組織・文化そのものを変革し、競争優位を確立する取組です。「ITの導入」自体が目的ではなく「変革」が本質です。"},
{"id":"S48","field":"S","cat":"システム企画","question":"RFP（Request For Proposal）の説明として、適切なものはどれか。","choices":["システム開発を委託する候補のベンダーに対して、調達対象システムの概要や要件を示し、提案書の提出を依頼する文書","ベンダーが発注者に対して見積金額を回答する文書","システムの利用者マニュアル","ベンダーとの間で締結する秘密保持契約書"],"answer":0,"exp":"RFP（提案依頼書）は、発注側がベンダー候補に「こういうシステムを作りたいので提案してください」と依頼する文書で、システムの目的・要件・予算・スケジュールなどを記載します。その前段階で情報収集のために発行する文書はRFI（情報提供依頼書）です。"},
{"id":"S49","field":"S","cat":"システム企画","question":"システムの要件定義プロセスに関する記述として、最も適切なものはどれか。","choices":["要件定義は開発者だけで行い、利用部門は関与しない方がよい","システムに必要な機能や性能を明確にする活動であり、利用部門も積極的に参画する必要がある","要件定義はプログラミングが完了した後に行う","要件はシステム稼働後に決めればよい"],"answer":1,"exp":"要件定義は、システム化する業務の内容や必要な機能・性能を明確にする工程です。業務を最もよく知るのは利用部門なので、開発者任せにせず利用部門が主体的に参画することが重要です。要件の漏れや誤りは後工程での手戻りコスト増大につながります。"},
{"id":"S50","field":"S","cat":"システム企画","question":"システム調達において、発注者が行う作業の順序として、適切なものはどれか。","choices":["RFP提示 → RFI提示 → 提案書の評価 → 契約締結","RFI提示 → RFP提示 → 提案書の評価 → 契約締結","提案書の評価 → RFI提示 → RFP提示 → 契約締結","契約締結 → RFP提示 → RFI提示 → 提案書の評価"],"answer":1,"exp":"調達の一般的な流れは、①RFI（情報提供依頼書）で各ベンダーから製品・技術情報を収集 → ②RFP（提案依頼書）で具体的な提案を依頼 → ③提出された提案書・見積書を評価してベンダーを選定 → ④契約締結、の順です。"},
{"id":"S51","field":"S","cat":"システム企画","question":"グリーン調達の説明として、適切なものはどれか。","choices":["最も価格の安い製品を優先して調達すること","環境負荷の小さい製品やサービスを、環境保全に積極的に取り組む事業者から優先して調達すること","自社と資本関係のある企業から優先して調達すること","海外の企業から優先して調達すること"],"answer":1,"exp":"グリーン調達は、製品・サービスを調達する際に価格や品質だけでなく環境への負荷を考慮し、環境負荷の小さいものを優先的に選ぶ取組です。グリーンIT（IT機器の省エネ化や、ITを活用した社会の省エネ化）とあわせて押さえておきましょう。"},
{"id":"S52","field":"S","cat":"システム企画","question":"システム化計画の立案において、最初に行うべきこととして、最も適切なものはどれか。","choices":["プログラム言語の選定","経営戦略との整合性を踏まえた、システム化の対象と目的の明確化","開発担当者の勤務シフト表の作成","サーバ機器の発注"],"answer":1,"exp":"システム化計画では、まず経営戦略・事業目標と整合を取りながら「何のために」「どの業務を」システム化するのかを明確にし、費用対効果やリスクを分析して全体計画を立てます。技術的な詳細（言語選定や機器発注）は後の工程で決定します。"},
{"id":"M01","field":"M","cat":"システム開発技術","question":"ソフトウェア開発の工程を実施する順序として、適切なものはどれか。","choices":["システム設計 → 要件定義 → プログラミング → テスト","要件定義 → システム設計 → プログラミング → テスト","プログラミング → 要件定義 → システム設計 → テスト","要件定義 → プログラミング → システム設計 → テスト"],"answer":1,"exp":"ソフトウェア開発は、①要件定義（何を作るかを明確化）→②システム設計（どう作るかを設計）→③プログラミング（コードを書く）→④テスト（正しく動くか検証）の順で進めます。ウォータフォールモデルではこの工程を後戻りしないよう順番に進めます。"},
{"id":"M02","field":"M","cat":"システム開発技術","question":"システム開発におけるテストのうち、発注者（利用者）が実際の運用と同じ条件で、要求どおりにシステムが動作するかを最終確認するテストはどれか。","choices":["単体テスト","結合テスト","システムテスト","受入れテスト"],"answer":3,"exp":"テストは、単体テスト（プログラム単位）→結合テスト（モジュール間の連携）→システムテスト（システム全体、開発者側の総合テスト）→受入れテスト（発注者・利用者が確認）の順で行います。受入れテストは発注者側が主体となって実施する点がポイントです。"},
{"id":"M03","field":"M","cat":"システム開発技術","question":"プログラムの内部構造には着目せず、入力と出力の関係が仕様どおりであるかを確認するテスト手法はどれか。","choices":["ホワイトボックステスト","ブラックボックステスト","リグレッションテスト","トップダウンテスト"],"answer":1,"exp":"ブラックボックステストは、プログラムを「中の見えない箱」とみなし、仕様に基づいて入力と出力だけで動作を検証します。一方、ホワイトボックステストは内部構造（分岐や経路）に着目して網羅的に検証します。"},
{"id":"M04","field":"M","cat":"システム開発技術","question":"ソフトウェアの修正を行った際に、その修正が他の部分に予期しない影響を及ぼしていないかを確認するテストはどれか。","choices":["リグレッションテスト（回帰テスト）","負荷テスト","受入れテスト","結合テスト"],"answer":0,"exp":"リグレッションテスト（回帰テスト・退行テスト）は、プログラムの修正・変更によって、これまで正常に動作していた部分に新たな不具合（デグレード）が生じていないかを確認するテストです。保守作業の際に特に重要です。"},
{"id":"M05","field":"M","cat":"システム開発技術","question":"ファンクションポイント法の説明として、適切なものはどれか。","choices":["過去の類似プロジェクトの実績を基に開発規模を見積もる方法","入出力画面や帳票の数、ファイル数などを基に機能の量を数値化し、開発規模を見積もる方法","プログラムのステップ数（行数）を基に開発規模を見積もる方法","開発者の人数と開発期間の積で開発規模を見積もる方法"],"answer":1,"exp":"ファンクションポイント（FP）法は、システムがもつ機能（入出力画面、帳票、ファイルなど）の数と複雑さを点数化して開発規模を見積もる手法です。利用者から見える機能を基準とするため、発注者にも根拠が分かりやすい利点があります。"},
{"id":"M06","field":"M","cat":"システム開発技術","question":"設計書やプログラムの欠陥を早期に発見するために、作成者を含む複数の関係者が集まって成果物を検討し合う活動はどれか。","choices":["レビュー","デバッグ","リファクタリング","マイグレーション"],"answer":0,"exp":"レビューは、成果物（要件定義書・設計書・ソースコードなど）を複数人で検討し、欠陥や曖昧さを早期に発見・除去する活動です。工程の早い段階で欠陥を見つけるほど修正コストが小さく済みます。デバッグはプログラム誤りの特定・修正作業です。"},
{"id":"M07","field":"M","cat":"システム開発技術","question":"ソフトウェア保守に該当するものはどれか。","choices":["開発中のプログラムに対する単体テストでのバグ修正","本番稼働中のシステムに対して、法改正に対応するためのプログラム修正を行うこと","新規システムの要件定義","受入れテストでの不具合修正"],"answer":1,"exp":"ソフトウェア保守は、システムの本番稼働開始後に行う修正・改良（バグ修正、法改正対応、機能追加など）を指します。稼働前の開発中に行う修正はテスト工程の一部であり、保守には含まれません。「稼働後かどうか」が判断ポイントです。"},
{"id":"M08","field":"M","cat":"システム開発技術","question":"ソフトウェアの品質特性のうち、「使用性」の説明として適切なものはどれか。","choices":["必要なときに使用でき、障害が起こりにくい度合い","利用者にとって理解しやすく、操作しやすい度合い","他の環境へ移しやすい度合い","処理が速く、資源を効率的に使う度合い"],"answer":1,"exp":"使用性（ユーザビリティ）は「使いやすさ・分かりやすさ」の品質特性です。信頼性は障害の起こりにくさ、移植性は他環境への移しやすさ、効率性（性能効率性）は処理速度や資源効率を表します。"},
{"id":"M09","field":"M","cat":"ソフトウェア開発管理技術","question":"アジャイル開発の説明として、最も適切なものはどれか。","choices":["全ての要件を確定させてから、設計・開発・テストを順番に一度だけ行う開発手法","短い期間の開発サイクルを繰り返しながら、動作するソフトウェアを段階的に成長させていく開発手法","開発作業を全て外部に委託する開発手法","プログラムを自動生成するツールを使う開発手法"],"answer":1,"exp":"アジャイル開発は、「イテレーション（スプリント）」と呼ばれる短い期間（1〜4週間程度）で計画・開発・テスト・リリースを繰り返し、動くソフトウェアを少しずつ成長させる手法です。仕様変更に柔軟に対応できるのが特徴です。全工程を一度だけ順に行うのはウォータフォールモデルです。"},
{"id":"M10","field":"M","cat":"ソフトウェア開発管理技術","question":"アジャイル開発手法の一つであるスクラムに関する記述として、適切なものはどれか。","choices":["スプリントと呼ばれる一定の期間ごとに、動作するソフトウェアをつくり上げていく","プログラムを2人1組で作成する手法のことである","開発の最初に全ての設計書を完成させる","テストを省略して開発スピードを高める"],"answer":0,"exp":"スクラムは、スプリント（1〜4週間の固定期間）を単位に開発を繰り返すアジャイルのフレームワークです。毎日の短い会議（デイリースクラム）、スプリントレビューなどのイベントと、プロダクトオーナー・スクラムマスター・開発者の役割が定義されています。2人1組での作成はXPのペアプログラミングです。"},
{"id":"M11","field":"M","cat":"ソフトウェア開発管理技術","question":"XP（エクストリームプログラミング）のプラクティスの一つで、2人のプログラマが1台のコンピュータに向かい、対話しながら共同でプログラムを作成する手法はどれか。","choices":["テスト駆動開発","ペアプログラミング","リファクタリング","モブレビュー"],"answer":1,"exp":"ペアプログラミングは、2人1組で1台のPCに向かい、1人がコードを書き、もう1人がその場でレビューしながら開発する手法です。品質向上と知識共有が期待できます。テスト駆動開発はテストを先に書いてから実装する手法、リファクタリングは外部から見た動作を変えずに内部構造を改善することです。"},
{"id":"M12","field":"M","cat":"ソフトウェア開発管理技術","question":"DevOpsの説明として、最も適切なものはどれか。","choices":["開発担当者と運用担当者が密接に連携・協力し、システムの開発からリリース、運用までを迅速かつ柔軟に進める取組","開発作業を全て自動化して人手を不要にする取組","運用部門が開発部門を監査する取組","開発と運用を完全に分離して責任を明確化する取組"],"answer":0,"exp":"DevOpsはDevelopment（開発）とOperations（運用）を組み合わせた造語で、両者が連携・協力し、ツールによる自動化（CI/CDなど）も活用して、リリースの迅速化とサービスの安定運用を両立させる取組・文化です。"},
{"id":"M13","field":"M","cat":"ソフトウェア開発管理技術","question":"リバースエンジニアリングの説明として、適切なものはどれか。","choices":["設計書を基にプログラムを作成すること","既存のソフトウェアの動作を解析するなどして、プログラムの仕様や設計情報を導き出すこと","ソフトウェアの著作権を登録すること","古いプログラム言語を新しい言語に書き換えること"],"answer":1,"exp":"リバースエンジニアリングは、既存の製品やプログラムを解析して、その仕様・設計情報・ソースコードなどを抽出することです。設計書が失われた古いシステムの保守などに活用されます。通常の開発（設計→実装）と逆方向であることからこう呼ばれます。"},
{"id":"M14","field":"M","cat":"プロジェクトマネジメント","question":"WBS（Work Breakdown Structure）を作成する目的として、適切なものはどれか。","choices":["プロジェクトの作業を階層的に細分化して、作業内容や成果物を明確にする","プロジェクトメンバーの人件費を計算する","システムの画面レイアウトを設計する","プロジェクトの投資対効果を評価する"],"answer":0,"exp":"WBSは、プロジェクト全体の作業をトップダウンで階層的に分解した構成図です。作業の抜け漏れを防ぎ、見積り・スケジュール作成・担当割当ての基礎となります。分解した最小単位はワークパッケージと呼ばれます。"},
{"id":"M15","field":"M","cat":"プロジェクトマネジメント","question":"あるプロジェクトでは、作業Aの完了後に作業Bと作業Cを並行して行い、両方が完了したら作業Dを行う。作業A＝2日、作業B＝5日、作業C＝3日、作業D＝2日のとき、プロジェクト全体の最短所要日数は何日か。","choices":["7日","9日","10日","12日"],"answer":1,"exp":"BとCは並行作業なので、両方の完了を待つには長い方（B＝5日）が基準になります。\n全体＝A（2日）＋max(B, C)（5日）＋D（2日）＝9日。\nこの最長経路（A→B→D）をクリティカルパスといい、この経路上の作業の遅れは全体の遅れに直結します。"},
{"id":"M16","field":"M","cat":"プロジェクトマネジメント","question":"作業の開始時期・終了時期を横棒で表し、進捗状況を視覚的に把握するのに適した図はどれか。","choices":["アローダイアグラム","ガントチャート","パレート図","特性要因図"],"answer":1,"exp":"ガントチャートは、縦軸に作業項目、横軸に時間を取り、各作業の予定期間と実績を横棒で表した図で、進捗管理に広く使われます。アローダイアグラムは作業の順序関係と所要日数を矢印で表し、クリティカルパスの分析に使われます。"},
{"id":"M17","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクトのリスク対応のうち、損害保険に加入することはどれに該当するか。","choices":["リスク回避","リスク転嫁（移転）","リスク軽減","リスク受容"],"answer":1,"exp":"リスク対応の4分類：\n・回避＝リスクの原因自体を取り除く（その活動をやめる）\n・転嫁（移転）＝保険加入や外部委託でリスクを第三者に移す\n・軽減＝発生確率や影響度を下げる対策を打つ\n・受容＝対策せず受け入れる（影響が小さい場合）\n保険加入は損害を保険会社に肩代わりさせるので「転嫁」です。"},
{"id":"M18","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクトの特性として、適切なものはどれか。","choices":["同じ作業を反復・継続して行う","明確な開始と終了があり（有期性）、独自の成果物やサービスを生み出す（独自性）","組織の定常業務として恒久的に行われる","成果物は常に同一である"],"answer":1,"exp":"プロジェクトは「有期性（始まりと終わりがある）」と「独自性（唯一の成果物・サービスを生み出す）」を特徴とする活動です。反復・継続的に行われる定常業務とは区別されます。"},
{"id":"M19","field":"M","cat":"プロジェクトマネジメント","question":"開発規模が20人月のプロジェクトを4人のメンバーで開始したが、3か月経過した時点で完了した作業は8人月分であった。残りの作業を2か月で完了させるためには、あと何人の増員が必要か。ここで、メンバーの生産性は全員同じで一定とする。","choices":["1人","2人","4人","6人"],"answer":1,"exp":"残作業＝20−8＝12人月。これを2か月で終えるには 12÷2＝6人必要です。現在4人いるので、増員は 6−4＝2人。\nなお実際には、増員直後は教育コストなどで生産性が下がる点（ブルックスの法則）も知られています。"},
{"id":"M20","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクトにおけるステークホルダの説明として、適切なものはどれか。","choices":["プロジェクトの費用を負担する経営者だけを指す","顧客、経営者、プロジェクトメンバー、利用部門など、プロジェクトに関わり影響を受ける全ての利害関係者","プロジェクトマネージャ1人を指す","システムの開発を担当するプログラマだけを指す"],"answer":1,"exp":"ステークホルダは、プロジェクトの実施や結果によって影響を受ける（または影響を与える）全ての個人・組織を指します。顧客・スポンサー・メンバー・利用部門・協力会社などが含まれ、プロジェクトマネジメントでは彼らの要求・期待の把握と調整が重要です。"},
{"id":"M21","field":"M","cat":"サービスマネジメント","question":"ITサービスマネジメントのベストプラクティス（成功事例）を体系的にまとめたフレームワークはどれか。","choices":["ITIL","PMBOK","SWOT","ERP"],"answer":0,"exp":"ITIL（Information Technology Infrastructure Library）は、ITサービスの計画・提供・運用・改善に関するベストプラクティスをまとめた書籍群・フレームワークで、ITサービスマネジメントの事実上の標準です。PMBOKはプロジェクトマネジメントの知識体系です。"},
{"id":"M22","field":"M","cat":"サービスマネジメント","question":"SLA（Service Level Agreement）の説明として、適切なものはどれか。","choices":["サービスの利用マニュアル","サービスの提供者と利用者の間で、サービスの内容や品質（稼働率、障害復旧時間など）の保証水準について合意した文書","サービス提供者の社内の業務分担表","サービスの広告宣伝資料"],"answer":1,"exp":"SLA（サービスレベル合意書）は、提供するサービスの範囲と品質目標（稼働率99.9％、障害時の復旧時間、サポート受付時間など）を提供者と利用者が合意して明文化したものです。合意したサービスレベルを維持・改善する活動をSLM（サービスレベル管理）といいます。"},
{"id":"M23","field":"M","cat":"サービスマネジメント","question":"ITサービスマネジメントにおけるインシデント管理の目的として、最も適切なものはどれか。","choices":["障害の根本原因を徹底的に究明すること","サービスの中断や品質低下が発生した際に、できるだけ迅速にサービスを復旧させ、事業への影響を最小限に抑えること","システムの変更作業を承認すること","新しいサービスを企画すること"],"answer":1,"exp":"インシデント管理の最優先目標は「迅速なサービス復旧」です。応急処置（回避策）でもよいので、まず利用者がサービスを使える状態に戻します。一方、根本原因の究明と恒久対策は「問題管理」の役割です。この2つの違いは頻出です。"},
{"id":"M24","field":"M","cat":"サービスマネジメント","question":"ITサービスマネジメントにおける問題管理の活動として、適切なものはどれか。","choices":["利用者からの問合せに単一窓口で対応する","インシデントの根本原因を分析・特定し、再発防止策を講じる","サービスの利用料金を請求する","サーバ室の入退室を管理する"],"answer":1,"exp":"問題管理は、インシデント（障害）の背後にある根本原因を究明し、恒久的な対策や再発防止策を実施する活動です。インシデント管理（迅速な復旧）とセットで理解しましょう。単一窓口での問合せ対応はサービスデスクの役割です。"},
{"id":"M25","field":"M","cat":"サービスマネジメント","question":"サービスデスクに関する記述として、最も適切なものはどれか。","choices":["利用者からの問合せや障害報告を受け付ける単一の窓口（SPOC）として機能し、必要に応じて専門部署へエスカレーションする","システムの開発を専門に行う部署である","経営戦略を立案する部署である","サーバやネットワーク機器を製造する部署である"],"answer":0,"exp":"サービスデスクは利用者との単一接点（SPOC：Single Point Of Contact）として問合せ・障害報告・要望を一元的に受け付け、自部署で解決できないものは専門部署へエスカレーション（引継ぎ）します。近年はチャットボットやFAQによる自己解決支援も活用されます。"},
{"id":"M26","field":"M","cat":"サービスマネジメント","question":"ファシリティマネジメントの観点から実施する施策として、適切なものはどれか。","choices":["プログラムの単体テストを実施する","停電に備えて無停電電源装置（UPS）を設置する","営業担当者に販売目標を設定する","新製品の広告を出稿する"],"answer":1,"exp":"ファシリティマネジメントは、建物・設備などの施設環境を最適に保つ管理活動です。IT分野では、サーバ室の空調・耐震対策、UPS（無停電電源装置）や自家発電装置の設置、入退室管理などが該当します。UPSは停電時に短時間電力を供給し、システムを安全に停止させる装置です。"},
{"id":"M27","field":"M","cat":"システム監査","question":"システム監査人に求められる要件として、最も適切なものはどれか。","choices":["監査対象の情報システムを開発した本人であること","監査対象部門から独立した立場であること","監査対象部門の上司であること","経営者と利害関係があること"],"answer":1,"exp":"システム監査人には、監査の客観性・信頼性を確保するため、監査対象部門からの「独立性」（外観上および精神上の独立）が求められます。自分が開発したシステムを自分で監査すると公正な評価ができないため、認められません。"},
{"id":"M28","field":"M","cat":"システム監査","question":"システム監査の実施手順として、適切な順序はどれか。","choices":["監査計画の策定 → 予備調査 → 本調査 → 評価・結論 → 監査報告","本調査 → 監査計画の策定 → 予備調査 → 監査報告 → 評価・結論","予備調査 → 監査計画の策定 → 監査報告 → 本調査 → 評価・結論","監査報告 → 予備調査 → 本調査 → 評価・結論 → 監査計画の策定"],"answer":0,"exp":"システム監査は、①監査計画の策定 → ②予備調査（対象の概要把握）→ ③本調査（証拠の収集・検証）→ ④評価・結論 → ⑤監査報告（改善勧告を含む）→ フォローアップ（改善状況の確認）の順で実施します。"},
{"id":"M29","field":"M","cat":"システム監査","question":"内部統制における職務分掌の例として、適切なものはどれか。","choices":["申請者と承認者を同一人物にして手続を効率化する","経費の申請者とその承認者を別の人にして、不正やミスを防止する","全ての権限を一人の管理者に集中させる","全従業員が全システムの管理者権限をもつ"],"answer":1,"exp":"職務分掌は、一連の業務の担当（申請と承認、実施と確認など）を複数人に分けて、相互けん制を働かせる内部統制の基本的な仕組みです。一人に権限が集中すると不正やミスを発見できなくなるため、担当を分離します。"},
{"id":"M30","field":"M","cat":"システム監査","question":"内部統制の整備・運用に関する記述のうち、適切なものはどれか。","choices":["内部統制の整備・運用の最終的な責任は経営者にある","内部統制は情報システム部門だけが取り組めばよい","内部統制は上場企業以外には全く関係がない","内部統制の目的は業務の効率を下げることである"],"answer":0,"exp":"内部統制は、業務の有効性・効率性、財務報告の信頼性、法令遵守、資産の保全を合理的に保証するために組織内に組み込まれる仕組みで、その整備・運用の最終責任は経営者が負います。全部門・全従業員が関わるものであり、ITを利用した統制（IT統制）はその重要な要素です。"},
{"id":"T01","field":"T","cat":"基礎理論","question":"10進数の13を2進数で表したものはどれか。","choices":["1011","1101","1110","10011"],"answer":1,"exp":"13を2で割っていき、余りを下から読みます。\n13÷2=6 余り1、6÷2=3 余り0、3÷2=1 余り1、1÷2=0 余り1 → 1101。\n検算：8＋4＋0＋1＝13。2進数⇔10進数の変換は毎回のように出題される基本です。"},
{"id":"T02","field":"T","cat":"基礎理論","question":"2つの入力がともに1のときだけ出力が1になる論理演算はどれか。","choices":["OR（論理和）","AND（論理積）","XOR（排他的論理和）","NOT（否定）"],"answer":1,"exp":"AND（論理積）は「両方とも1のときだけ1」です。\n・OR：どちらか一方でも1なら1\n・XOR：2つの入力が異なるときだけ1\n・NOT：入力を反転（1→0、0→1）\n真理値表を書けるようにしておきましょう。"},
{"id":"T03","field":"T","cat":"基礎理論","question":"1バイト（8ビット）で表現できる情報の数は最大で何通りか。","choices":["8通り","128通り","255通り","256通り"],"answer":3,"exp":"nビットで表現できる情報は2のn乗通りです。8ビットなら2⁸＝256通り（0〜255の256種類）。「表現できる数の個数（256）」と「表現できる最大値（255）」を混同しないよう注意しましょう。"},
{"id":"T04","field":"T","cat":"基礎理論","question":"データ「2, 3, 5, 7, 13」の中央値（メジアン）はどれか。","choices":["3","5","6","7"],"answer":1,"exp":"中央値は、データを小さい順に並べたときに中央に位置する値です。5個のデータなら3番目の「5」が中央値です。平均値は(2+3+5+7+13)÷5＝6ですが、中央値は外れ値（極端な値）の影響を受けにくい特徴があります。最頻値（モード）は最も多く出現する値です。"},
{"id":"T05","field":"T","cat":"基礎理論","question":"機械学習における「教師あり学習」の説明として、適切なものはどれか。","choices":["正解のラベルを付けた学習データを与えて、入力と正解の関係を学習させる方法","正解を与えずに、データの構造やグループ分けをコンピュータ自身に発見させる方法","試行錯誤の結果に対する報酬を基に、最適な行動を学習させる方法","人間がすべてのルールをプログラムとして記述する方法"],"answer":0,"exp":"機械学習の3分類：\n・教師あり学習＝正解付きデータで学習（例：画像の分類、売上予測）\n・教師なし学習＝正解なしでデータの構造を発見（例：顧客のグループ分け／クラスタリング）\n・強化学習＝行動への報酬を最大化するよう学習（例：囲碁AI、ロボット制御）"},
{"id":"T06","field":"T","cat":"基礎理論","question":"ディープラーニングの説明として、最も適切なものはどれか。","choices":["人間の脳の神経回路を模したニューラルネットワークを多層化して、コンピュータ自身がデータの特徴を抽出して学習する技術","あらかじめ人間が定義したルールに従って推論する技術","データを暗号化して安全に保管する技術","コンピュータ同士を高速な回線で接続する技術"],"answer":0,"exp":"ディープラーニング（深層学習）は、多層のニューラルネットワークを用いる機械学習の一手法で、画像認識・音声認識・自然言語処理などで高い性能を発揮します。従来は人間が設計していた「特徴量」を、データから自動的に抽出できる点が大きな特徴です。"},
{"id":"T07","field":"T","cat":"基礎理論","question":"10億分の1（10⁻⁹）を表す接頭語はどれか。","choices":["ミリ（m）","マイクロ（μ）","ナノ（n）","ピコ（p）"],"answer":2,"exp":"小さい方の接頭語は、ミリ（10⁻³）→マイクロ（10⁻⁶）→ナノ（10⁻⁹）→ピコ（10⁻¹²）の順です。大きい方はキロ（10³）→メガ（10⁶）→ギガ（10⁹）→テラ（10¹²）→ペタ（10¹⁵）。処理速度（ナノ秒）や記憶容量（ギガバイト）の計算で必須の知識です。"},
{"id":"T08","field":"T","cat":"アルゴリズムとプログラミング","question":"2分探索法でデータを探索するための前提条件として、適切なものはどれか。","choices":["データがランダムに並んでいること","データが昇順又は降順に整列されていること","データの件数が奇数であること","データに重複がないこと"],"answer":1,"exp":"2分探索法は「探索範囲の中央の値と比較して、範囲を半分に絞り込む」ことを繰り返す高速な探索方法で、データが整列済みであることが前提です。整列されていないデータには、先頭から順に調べる線形探索を使います。"},
{"id":"T09","field":"T","cat":"アルゴリズムとプログラミング","question":"後に格納したデータを先に取り出す、後入れ先出し（LIFO）のデータ構造はどれか。","choices":["キュー","スタック","木構造","配列"],"answer":1,"exp":"スタックはLIFO（Last In First Out：後入れ先出し）のデータ構造で、データの格納をプッシュ、取り出しをポップといいます。本を積み上げるイメージです。キューはFIFO（先入れ先出し）で、行列（待ち行列）のイメージです。"},
{"id":"T10","field":"T","cat":"アルゴリズムとプログラミング","question":"手続の流れが次のとき、出力されるxの値はどれか。\n\n① x に 1 を代入する\n② 次の処理を5回繰り返す：「x の値を2倍して x に代入する」\n③ x の値を出力する","choices":["10","16","32","64"],"answer":2,"exp":"xは1から始まり、2倍を5回繰り返します。\n1→2→4→8→16→32。\nつまり x＝1×2⁵＝32 です。繰返し（ループ）処理のトレース（変数の変化を1回ずつ追うこと）は、擬似言語問題の基本テクニックです。"},
{"id":"T11","field":"T","cat":"アルゴリズムとプログラミング","question":"Webブラウザ上で動作し、Webページに動きや対話性を加えるために広く使われているスクリプト言語はどれか。","choices":["HTML","JavaScript","COBOL","アセンブリ言語"],"answer":1,"exp":"JavaScriptはWebブラウザ上で実行されるスクリプト言語で、Webページの動的な表示・操作に広く使われます。HTMLは言語ですがプログラム言語ではなく、文書の構造を記述するマークアップ言語です。なおJavaとJavaScriptは名前が似ていますが別の言語です。"},
{"id":"T12","field":"T","cat":"アルゴリズムとプログラミング","question":"マークアップ言語に関する記述のうち、適切なものはどれか。","choices":["HTMLは、タグを使ってWebページの見出しや段落などの構造を記述する言語である","HTMLで記述したプログラムはCPUが直接実行する","XMLは画像データを圧縮するための言語である","マークアップ言語は表計算ソフトのマクロ言語の総称である"],"answer":0,"exp":"マークアップ言語は、タグ（<h1>など）で文書の構造や意味を記述する言語です。HTMLはWebページ記述用、XMLは独自のタグを定義できデータ交換などに使われます。プログラムのように処理手順を記述するものではありません。"},
{"id":"T13","field":"T","cat":"アルゴリズムとプログラミング","question":"AI開発やデータ分析の分野で広く利用されており、豊富なライブラリをもつプログラム言語はどれか。","choices":["Python","Fortran","BASIC","Perl"],"answer":0,"exp":"Pythonは文法がシンプルで学びやすく、機械学習・データ分析用のライブラリ（NumPy、pandas、TensorFlowなど）が充実しているため、AI開発の分野で最も広く使われている言語の一つです。ITパスポートの擬似言語問題の背景知識としても押さえておきましょう。"},
{"id":"T14","field":"T","cat":"コンピュータ構成要素","question":"CPUのクロック周波数に関する記述として、適切なものはどれか。","choices":["クロック周波数が高いほど、CPU内部の動作のテンポが速くなり、一般に処理速度が向上する","クロック周波数が高いほど、記憶できるデータ量が増える","クロック周波数は、ディスプレイの解像度を表す","クロック周波数が低いほど処理速度は向上する"],"answer":0,"exp":"クロック周波数は、CPU内部の動作タイミングを刻む信号の周波数（Hz）で、高いほど1秒間の動作回数が多く、一般に処理速度が向上します。ただし処理性能はコア数やキャッシュ容量などにも左右されます。記憶容量とは無関係です。"},
{"id":"T15","field":"T","cat":"コンピュータ構成要素","question":"キャッシュメモリの役割として、適切なものはどれか。","choices":["CPUと主記憶の速度差を埋めるために、使用頻度の高いデータを格納する高速なメモリ","電源を切ってもデータを保持する補助記憶装置","ディスプレイに表示する画像データ専用のメモリ","キーボードからの入力を一時的に蓄えるメモリ"],"answer":0,"exp":"キャッシュメモリは、CPUと主記憶（メインメモリ）の間に置かれる小容量・高速なメモリで、よく使うデータを先に置いておくことでCPUの待ち時間を減らします。記憶装置は「レジスタ＞キャッシュ＞主記憶＞補助記憶」の順に高速（かつ高価・小容量）です。"},
{"id":"T16","field":"T","cat":"コンピュータ構成要素","question":"PCの主記憶に使われるDRAMの特徴として、適切なものはどれか。","choices":["電源を切っても記憶内容が保持される","電源を切ると記憶内容が失われる揮発性のメモリであり、定期的なリフレッシュ動作が必要である","一度だけ書き込みができる読出し専用メモリである","磁気を利用してデータを記録する"],"answer":1,"exp":"DRAMは主記憶に使われる揮発性メモリで、電源を切ると内容が消え、記憶保持のために定期的なリフレッシュが必要です。読出し専用はROM、電源を切っても消えない書換え可能なメモリはフラッシュメモリ（SSDやUSBメモリに使用）です。"},
{"id":"T17","field":"T","cat":"コンピュータ構成要素","question":"USBに関する記述として、適切なものはどれか。","choices":["PCと周辺機器を接続するためのシリアルインタフェースであり、ハブを使って複数の機器を接続でき、機器によってはバスパワーによる電力供給も受けられる","無線でデータを送受信するインタフェースである","ディスプレイ専用の接続規格である","データを赤外線で転送する規格である"],"answer":0,"exp":"USBは最も普及している有線のシリアルインタフェースです。ハブによる多段接続、ホットプラグ（電源を入れたまま抜き差し）、バスパワー（ケーブル経由の電力供給）が特徴です。無線のインタフェースにはBluetoothなどがあります。"},
{"id":"T18","field":"T","cat":"コンピュータ構成要素","question":"GPUの説明として、最も適切なものはどれか。","choices":["音声データを処理する専用プロセッサ","画像処理に特化したプロセッサであり、多数のコアによる並列計算能力を生かしてAIの学習処理などにも活用される","ネットワーク通信専用のプロセッサ","電源電圧を制御するプロセッサ"],"answer":1,"exp":"GPU（Graphics Processing Unit）は本来3次元グラフィックスなどの画像処理用プロセッサですが、単純な計算を大量に並列処理する能力が高いため、ディープラーニングの学習や科学技術計算にも広く活用されています。"},
{"id":"T19","field":"T","cat":"コンピュータ構成要素","question":"記憶装置を処理速度が速い順に並べたものはどれか。","choices":["主記憶 → レジスタ → キャッシュメモリ → SSD","レジスタ → キャッシュメモリ → 主記憶 → SSD","キャッシュメモリ → レジスタ → SSD → 主記憶","SSD → 主記憶 → キャッシュメモリ → レジスタ"],"answer":1,"exp":"CPUに近いほど高速です：レジスタ（CPU内部）＞キャッシュメモリ＞主記憶（メインメモリ）＞補助記憶（SSD・HDD）。速いものほど容量当たりの単価が高いため小容量になっており、この階層構造で速度とコストのバランスを取っています。"},
{"id":"T20","field":"T","cat":"システム構成要素","question":"同じ構成のシステムを2系統用意し、通常は一方を稼働させ、もう一方は待機させておく方式はどれか。","choices":["デュアルシステム","デュプレックスシステム","シンプレックスシステム","グリッドコンピューティング"],"answer":1,"exp":"デュプレックスシステムは主系＋待機系の構成で、主系の障害時に待機系へ切り替えます。デュアルシステムは2系統で同じ処理を同時に行い結果を照合し合う方式で、より信頼性が高い（が高コスト）構成です。両者の違いは頻出です。"},
{"id":"T21","field":"T","cat":"システム構成要素","question":"稼働率0.9の装置を2台直列に接続したシステム全体の稼働率はいくらか。","choices":["0.81","0.90","0.99","1.80"],"answer":0,"exp":"直列システムは全装置が動いて初めて稼働するので、稼働率は掛け算：0.9×0.9＝0.81。\n並列（どちらか一方が動けばよい）の場合は「1−（両方壊れる確率）」＝1−0.1×0.1＝0.99。直列は掛ける、並列は「1−故障率の積」と覚えましょう。"},
{"id":"T22","field":"T","cat":"システム構成要素","question":"システムに障害が発生したとき、あらかじめ安全な状態になるように制御する設計思想はどれか。","choices":["フェールセーフ","フェールソフト","フールプルーフ","フォールトトレランス"],"answer":0,"exp":"・フェールセーフ＝故障時に安全側へ制御（例：信号機の故障時は赤にする）\n・フェールソフト＝故障部分を切り離し、機能を落としてでも稼働継続\n・フールプルーフ＝人間の誤操作を防ぐ設計（例：ふたを閉めないと動かない洗濯機）\n・フォールトトレランス＝構成要素を冗長化し、故障しても全体は正常動作を続ける"},
{"id":"T23","field":"T","cat":"システム構成要素","question":"サーバの仮想化の説明として、適切なものはどれか。","choices":["1台の物理サーバ上で複数の仮想的なサーバを動作させる技術","サーバを物理的に複数の場所に分散配置すること","サーバの外観をデザインすること","サーバを冷却する技術"],"answer":0,"exp":"サーバ仮想化は、仮想化ソフトウェアにより1台の物理サーバ上に複数の仮想サーバ（仮想マシン）を構築・稼働させる技術です。ハードウェア資源の有効活用、サーバ台数・消費電力の削減、環境構築の迅速化などの利点があり、クラウドサービスの基盤技術となっています。"},
{"id":"T24","field":"T","cat":"システム構成要素","question":"シンクライアントシステムの特徴として、適切なものはどれか。","choices":["端末側にアプリケーションやデータをもたせず、サーバ側で処理・保管を行うため、端末からの情報漏えいリスクを低減できる","端末側で全ての処理を行うため、サーバが不要になる","端末の価格が必ず高価になる","ネットワークに接続せずに全機能を利用できる"],"answer":0,"exp":"シンクライアントは、端末（クライアント）には最小限の機能だけをもたせ、アプリケーションの実行やデータの保存はサーバ側で行う方式です。端末にデータが残らないため、紛失・盗難時の情報漏えい対策として有効で、テレワーク環境でも活用されます。"},
{"id":"T25","field":"T","cat":"システム構成要素","question":"NAS（Network Attached Storage）の説明として、適切なものはどれか。","choices":["ネットワークに直接接続して使用するファイルサーバ専用機であり、複数のPCからファイルを共有できる","PCに内蔵されるハードディスク","CPUの処理速度を高める装置","ネットワークの通信経路を制御する装置"],"answer":0,"exp":"NASはLANに直接接続するストレージ（記憶装置）で、複数の利用者・機器からのファイル共有に使われます。家庭やオフィスでのデータの一元管理・バックアップ先として普及しています。通信経路の制御はルータの役割です。"},
{"id":"T26","field":"T","cat":"ソフトウェア","question":"OS（オペレーティングシステム）の役割として、適切なものはどれか。","choices":["文書の作成や表計算などの特定の業務処理を行う","ハードウェア資源（CPU、メモリ、周辺機器など）を管理し、アプリケーションソフトウェアに共通の基盤機能を提供する","Webページを閲覧する","電子メールを送受信する"],"answer":1,"exp":"OSは、CPU・メモリ・ファイル・周辺機器などの資源管理、タスク管理（複数プログラムの並行実行）、利用者管理などを行う基本ソフトウェアです。Windows、macOS、Linux、Android、iOSなどが代表例です。文書作成などを行うのは応用ソフトウェア（アプリケーション）です。"},
{"id":"T27","field":"T","cat":"ソフトウェア","question":"階層型ファイルシステムにおいて、最上位の階層から目的のファイルまでの経路を全て記述する指定方法はどれか。","choices":["相対パス","絶対パス","ショートカット","ハイパリンク"],"answer":1,"exp":"絶対パスはルートディレクトリ（最上位）から目的ファイルまでの経路を全て記述する方法、相対パスは現在のディレクトリ（カレントディレクトリ）を基準に記述する方法です。「..」は一つ上のディレクトリを表します。"},
{"id":"T28","field":"T","cat":"ソフトウェア","question":"データのバックアップに関する記述として、最も適切なものはどれか。","choices":["バックアップは元のデータと同じ記憶装置に保存するのが望ましい","障害や誤操作によるデータ消失に備えて、定期的にバックアップを取得し、元のデータとは別の場所に保管することが望ましい","バックアップは一度取得すれば、その後は取得し直す必要はない","バックアップの取得中もデータを自由に更新してよい"],"answer":1,"exp":"バックアップは、故障・誤操作・ランサムウェアなどによるデータ喪失に備えた複製です。元データと同じ装置に置くと同時に失われるため、別の媒体・場所（遠隔地やクラウドなど）に保管し、定期的に取得します。フル・差分・増分などの方式と世代管理も押さえておきましょう。"},
{"id":"T29","field":"T","cat":"ソフトウェア","question":"表計算ソフトで、セルD2に式「=B$1+$A2」を入力し、これをセルE3に複写（コピー）したとき、セルE3に入る式はどれか。","choices":["=B$1+$A2","=C$1+$A3","=C$1+$B3","=B$2+$A3"],"answer":1,"exp":"$付きの行・列は複写しても固定され、$なしは移動量に応じて変わります。D2→E3は「右へ1列、下へ1行」の移動です。\n・B$1：列Bは固定なし→C、行1は$で固定→1 ⇒ C$1\n・$A2：列Aは$で固定→A、行2は固定なし→3 ⇒ $A3\nよって =C$1+$A3 です。"},
{"id":"T30","field":"T","cat":"ソフトウェア","question":"OSSであるOSはどれか。","choices":["Windows 11","Linux","iOS","MS-DOS"],"answer":1,"exp":"LinuxはOSSの代表的なOSで、サーバやスーパーコンピュータ、組込み機器などで広く使われています（AndroidもLinuxベースです）。ほかの代表的なOSSには、Firefox（ブラウザ）、Apache（Webサーバ）、MySQL（データベース）などがあります。"},
{"id":"T31","field":"T","cat":"ハードウェア","question":"IoTシステムにおいて、温度や湿度、加速度などの物理量を検出して電気信号に変換する装置はどれか。","choices":["アクチュエータ","センサ","ルータ","プリンタ"],"answer":1,"exp":"センサは物理量（温度・湿度・光・加速度・位置など）を検出して電気信号に変える装置です。逆に、電気信号を受けて物理的な動き（モーターの回転など）に変換する装置がアクチュエータです。IoTでは「センサで収集→ネットワークで送信→分析→アクチュエータで制御」という流れを押さえましょう。"},
{"id":"T32","field":"T","cat":"ハードウェア","question":"IoT機器において、電気信号を物理的な動作（バルブの開閉やモーターの回転など）に変換する装置はどれか。","choices":["センサ","アクチュエータ","GPU","メモリ"],"answer":1,"exp":"アクチュエータは、コンピュータからの電気信号をモーターの回転・バルブの開閉などの物理的な動きに変換する駆動装置です。センサ（検出）と対になる存在で、スマート農業の自動散水やロボットの関節制御などに使われます。"},
{"id":"T33","field":"T","cat":"ハードウェア","question":"有機ELディスプレイの特徴として、適切なものはどれか。","choices":["バックライトが必須である","画素自体が発光するためバックライトが不要で、薄型化や高コントラスト化がしやすい","ブラウン管を使用している","表示にインクを使用する"],"answer":1,"exp":"有機ELディスプレイは、有機化合物に電圧をかけると自ら発光する性質を利用します。液晶と違いバックライトが不要なため、薄く・軽く・黒の表現（コントラスト）に優れ、スマートフォンやテレビに採用されています。"},
{"id":"T34","field":"T","cat":"情報デザイン","question":"ユニバーサルデザインの考え方として、最も適切なものはどれか。","choices":["文化、言語、年齢、性別、障害の有無などにかかわらず、できるだけ多くの人が利用できるように製品やサービスを設計すること","デザインを全て統一して1種類にすること","高齢者専用の製品を設計すること","コストを最優先して設計すること"],"answer":0,"exp":"ユニバーサルデザインは「できるだけ多くの人が最初から使えるように」設計する考え方です。例：シャンプー容器の突起、多言語対応のピクトグラム、段差のない入口。特定の人向けの配慮（バリアフリー）よりも広い概念です。"},
{"id":"T35","field":"T","cat":"情報デザイン","question":"言葉が通じなくても意味が直感的に伝わるように、情報を単純化した絵や図で表現したものはどれか。","choices":["ピクトグラム","ワイヤフレーム","シグニファイア","スタイルシート"],"answer":0,"exp":"ピクトグラムは非常口マークやトイレマークのように、情報を単純な絵記号で表したものです。言語に依存せず直感的に伝わるため、公共施設や観光案内で広く使われています。ワイヤフレームはWebページのレイアウト設計図です。"},
{"id":"T36","field":"T","cat":"情報デザイン","question":"Webアクセシビリティの説明として、最も適切なものはどれか。","choices":["Webページの表示速度を高めること","高齢者や障害のある人を含む誰もが、Webサイトで提供される情報やサービスを支障なく利用できること","Webページのデザインを流行に合わせること","Webサイトへのアクセス数を増やすこと"],"answer":1,"exp":"アクセシビリティは「利用しやすさ・到達しやすさ」で、視覚障害者向けの代替テキスト、十分なコントラスト、キーボードのみでの操作対応などが例です。似た用語のユーザビリティ（使いやすさ・満足度）とセットで押さえましょう。"},
{"id":"T37","field":"T","cat":"情報メディア","question":"1,000×800画素、1画素24ビットカラーの画像を圧縮せずに保存する場合、必要な記憶容量はおよそ何Mバイトか。","choices":["0.8Mバイト","2.4Mバイト","19.2Mバイト","24Mバイト"],"answer":1,"exp":"総画素数＝1,000×800＝800,000画素。\n1画素24ビット＝3バイトなので、800,000×3＝2,400,000バイト＝2.4Mバイト。\n「ビットをバイトに直す（÷8）」のを忘れると19.2Mバイトを選んでしまいます。この換算ミスを誘う選択肢が定番です。"},
{"id":"T38","field":"T","cat":"情報メディア","question":"動画データの圧縮方式の標準規格はどれか。","choices":["JPEG","MPEG","MP3","PNG"],"answer":1,"exp":"MPEGは動画圧縮の標準規格です（MPEG-4など）。JPEGは静止画（写真）の圧縮、PNGは静止画の可逆圧縮、MP3は音声の圧縮規格です。「J＝静止画（写真）、M＝動画・音声」と対応を整理して覚えましょう。"},
{"id":"T39","field":"T","cat":"情報メディア","question":"ストリーミングの説明として、適切なものはどれか。","choices":["動画や音声のデータを全てダウンロードし終えてから再生する方式","動画や音声のデータを受信しながら、同時に再生する方式","動画を編集する技術","データを暗号化して送信する方式"],"answer":1,"exp":"ストリーミングは、データを受信しながら順次再生する方式で、全ファイルのダウンロード完了を待つ必要がありません。動画配信サービスやインターネットラジオで使われます。再生後に端末へデータが残らないため、コンテンツ保護の面でも利点があります。"},
{"id":"T40","field":"T","cat":"データベース","question":"関係データベースの主キーに関する記述として、適切なものはどれか。","choices":["主キーの値は表の中で重複してもよい","主キーには空値（NULL）を設定できる","主キーは表の中の行（レコード）を一意に識別するための項目であり、値の重複や空値は許されない","一つの表に主キーは設定できない"],"answer":2,"exp":"主キーは各行を一意に識別する列（または列の組合せ）で、①値が重複しない（一意性制約）、②空値（NULL）を含まない、という条件を満たす必要があります。例：社員番号、学籍番号。複数列を組み合わせた複合キーも可能です。"},
{"id":"T41","field":"T","cat":"データベース","question":"関係データベースにおける外部キーの役割として、適切なものはどれか。","choices":["表の行を昇順に並べ替える","他の表の主キーを参照することによって、表と表の間の関連付けを行う","データを暗号化する","表の列数を制限する"],"answer":1,"exp":"外部キーは、他の表の主キーを参照する列です。例えば「注文」表の「顧客番号」列が「顧客」表の主キーを参照することで、2つの表が関連付けられます。存在しない顧客番号を登録できないようにする仕組みを参照整合性といいます。"},
{"id":"T42","field":"T","cat":"データベース","question":"データベースの正規化を行う主な目的はどれか。","choices":["データの重複や矛盾を排除して、データの整合性を保ちやすくする","データの検索速度を必ず向上させる","データを圧縮して記憶容量を節約する","データを暗号化して機密性を高める"],"answer":0,"exp":"正規化は、表を適切に分割してデータの重複をなくす設計手法です。同じデータが複数箇所にあると、更新時に矛盾（更新漏れ）が生じやすくなります。正規化によりデータの一貫性・整合性を維持しやすくなります。"},
{"id":"T43","field":"T","cat":"データベース","question":"関係データベースの操作のうち、表から条件に合致した行だけを取り出す操作はどれか。","choices":["射影","選択","結合","挿入"],"answer":1,"exp":"関係データベースの基本操作：\n・選択＝条件に合う「行」を取り出す\n・射影＝特定の「列」を取り出す\n・結合＝複数の表を共通の列でつなぐ\n「行を選択、列を射影」とセットで覚えましょう。"},
{"id":"T44","field":"T","cat":"データベース","question":"複数の利用者が同じデータを同時に更新しようとしたときに、データの矛盾を防ぐためにDBMSが行う制御はどれか。","choices":["正規化","排他制御","バックアップ","デフラグ"],"answer":1,"exp":"排他制御は、あるトランザクションがデータを更新している間、そのデータをロックして他の利用者の更新を待たせる仕組みです。例えば座席予約システムで同じ席が二重に予約されるのを防ぎます。ロックの粒度や解放のタイミングが性能に影響します。"},
{"id":"T45","field":"T","cat":"データベース","question":"トランザクション処理中に障害が発生した場合に、トランザクション開始前の状態までデータベースを戻す処理はどれか。","choices":["コミット","ロールバック","ロールフォワード","チェックポイント"],"answer":1,"exp":"ロールバックは、更新途中で障害が起きたトランザクションを取り消し、開始前の状態に戻す処理です（ログの更新前情報を使用）。コミットは更新の確定、ロールフォワードはバックアップ取得後の更新をログ（更新後情報）で再現してデータベースを復旧する処理です。"},
{"id":"T46","field":"T","cat":"ネットワーク","question":"DNSの役割として、適切なものはどれか。","choices":["ドメイン名とIPアドレスを対応付ける","電子メールを暗号化する","コンピュータにIPアドレスを自動的に割り当てる","ネットワークの通信量を制限する"],"answer":0,"exp":"DNS（Domain Name System）は、人間が覚えやすいドメイン名（example.co.jpなど）と、コンピュータが使うIPアドレスを相互に変換（名前解決）する仕組みです。IPアドレスの自動割当てはDHCPの役割です。この2つの取り違えを狙った出題が定番です。"},
{"id":"T47","field":"T","cat":"ネットワーク","question":"ネットワークに接続するPCなどに、IPアドレスを自動的に割り当てるプロトコルはどれか。","choices":["DNS","DHCP","FTP","NTP"],"answer":1,"exp":"DHCPは、ネットワークに接続した機器にIPアドレスなどの設定情報を自動的に割り当てるプロトコルです。手作業での設定ミスや重複を防げます。DNSは名前解決、FTPはファイル転送、NTPは時刻同期のプロトコルです。"},
{"id":"T48","field":"T","cat":"ネットワーク","question":"URLが「https://」で始まるWebサイトに関する記述として、適切なものはどれか。","choices":["Webサイトの内容が政府によって保証されている","WebブラウザとWebサーバの間の通信がTLSによって暗号化されている","Webサイトに掲載されている情報が全て真実である","通信速度が通常より速い"],"answer":1,"exp":"HTTPSはHTTPにTLS（旧称SSL）による暗号化を加えたもので、通信内容の盗聴・改ざん防止とサーバの認証を行います。ただし「通信が暗号化されている」ことと「サイトの内容が信頼できる」ことは別です。フィッシングサイトもHTTPSを使うことがあるため注意が必要です。"},
{"id":"T49","field":"T","cat":"ネットワーク","question":"電子メールの宛先に関する記述のうち、適切なものはどれか。","choices":["Ccに指定した宛先は、他の受信者からは見えない","Bccに指定した宛先は、他の受信者からは見えない","Toに指定できる宛先は1件だけである","Bccに指定した宛先には、メールは届かない"],"answer":1,"exp":"To（宛先）とCc（写し）のアドレスは全受信者に表示されますが、Bcc（Blind Carbon Copy）のアドレスは他の受信者には見えません。複数の顧客へ一斉送信する際にToやCcを使うと、メールアドレスの漏えい事故になります。Bccの使い分けは実務でも重要です。"},
{"id":"T50","field":"T","cat":"ネットワーク","question":"電子メールの送信に使われるプロトコルはどれか。","choices":["POP3","SMTP","HTTP","FTP"],"answer":1,"exp":"SMTPはメールの送信・転送用プロトコル、POP3はメールサーバから自分の端末へメールを受信（ダウンロード）するプロトコルです。IMAPはサーバ上にメールを置いたまま複数端末から閲覧できる受信プロトコルです。「送信＝SMTP、受信＝POP3／IMAP」と覚えましょう。"},
{"id":"T51","field":"T","cat":"ネットワーク","question":"プライベートIPアドレスに関する記述として、適切なものはどれか。","choices":["インターネット上で一意に割り当てられるアドレスである","組織内のLANなどで自由に利用でき、そのままではインターネット上の通信相手との通信に使用できないアドレスである","国が個人に割り当てるアドレスである","電子メールのアドレスのことである"],"answer":1,"exp":"プライベートIPアドレスは組織内ネットワーク用のアドレスで、異なる組織内で同じアドレスを使っても問題ありません。インターネットとの通信時は、ルータのNAT（アドレス変換）機能でグローバルIPアドレスに変換されます。"},
{"id":"T52","field":"T","cat":"ネットワーク","question":"移動通信システムの5Gの特徴として、適切な組合せはどれか。","choices":["高速大容量、低遅延、多数同時接続","低速、小容量、少数接続","有線接続、高遅延、単独接続","近距離無線、低速、省電力"],"answer":0,"exp":"5Gの3大特徴は①超高速・大容量、②超低遅延（リアルタイム性が必要な遠隔手術・自動運転などに活用）、③多数同時接続（IoT機器の大量接続）です。なお、IoT向けに低消費電力・広域通信を実現する無線技術はLPWAと呼ばれます。"},
{"id":"T53","field":"T","cat":"ネットワーク","question":"スマートフォンをアクセスポイントのように利用して、PCやタブレットなどをインターネットに接続する機能はどれか。","choices":["ローミング","テザリング","ストリーミング","ペアリング"],"answer":1,"exp":"テザリングは、スマートフォンの移動体通信回線を経由して、他の機器（PC・タブレットなど)をインターネットに接続する機能です。ローミングは契約事業者のサービス範囲外でも提携事業者の回線を利用できる仕組み、ペアリングはBluetooth機器同士の接続設定です。"},
{"id":"T54","field":"T","cat":"ネットワーク","question":"通信速度が100Mビット/秒の回線を使って、500Mバイトのファイルを転送するのに必要なおよその時間はどれか。ここで、回線の利用効率は100％とする。","choices":["5秒","20秒","40秒","80秒"],"answer":2,"exp":"単位をそろえます。500Mバイト＝500×8＝4,000Mビット。\n転送時間＝4,000Mビット÷100Mビット/秒＝40秒。\n「バイト→ビットは×8」の換算が最大のポイントです。実際は利用効率（例：50％なら2倍の時間）を考慮させる出題もあります。"},
{"id":"T55","field":"T","cat":"セキュリティ","question":"情報セキュリティの3要素（CIA）のうち、「可用性」の説明として適切なものはどれか。","choices":["許可された者だけが情報にアクセスできること","情報が正確で、改ざんされていないこと","許可された者が、必要なときに中断されることなく情報やシステムを利用できること","通信相手が本人であることを確認できること"],"answer":2,"exp":"情報セキュリティの3要素：\n・機密性（Confidentiality）＝許可された者だけがアクセスできる\n・完全性（Integrity）＝情報が正確・完全で改ざんされていない\n・可用性（Availability）＝必要なときにいつでも使える\n可用性を高める対策には、システムの冗長化・バックアップ・UPS設置などがあります。"},
{"id":"T56","field":"T","cat":"セキュリティ","question":"共通鍵暗号方式に関する記述として、適切なものはどれか。","choices":["暗号化と復号に同じ鍵を使い、その鍵は通信相手以外に知られないように管理する必要がある","暗号化と復号に異なる鍵を使う","鍵を公開してもよい","デジタル署名にのみ使われる方式である"],"answer":0,"exp":"共通鍵暗号方式は暗号化と復号に同じ鍵を使うため、鍵を相手と安全に共有し、秘密に管理する必要があります。処理は高速ですが、通信相手が増えると鍵の数が急増する（n人ではn(n-1)/2個）のが課題です。公開鍵暗号方式は暗号化用（公開鍵）と復号用（秘密鍵）が別です。"},
{"id":"T57","field":"T","cat":"セキュリティ","question":"公開鍵暗号方式で、AさんがBさんに機密のメッセージを暗号化して送るとき、暗号化に使用する鍵はどれか。","choices":["Aさんの公開鍵","Aさんの秘密鍵","Bさんの公開鍵","Bさんの秘密鍵"],"answer":2,"exp":"機密性を守る暗号化では「受信者の公開鍵」で暗号化し、受信者だけがもつ「受信者の秘密鍵」で復号します。誰でも暗号化できるが、開けるのは受信者だけ、という仕組みです。逆に「送信者の秘密鍵」で署名し「送信者の公開鍵」で検証するのがデジタル署名です。"},
{"id":"T58","field":"T","cat":"セキュリティ","question":"デジタル署名によって確認できることとして、適切な組合せはどれか。","choices":["通信の高速化と圧縮率","送信者が本人であること（なりすましがないこと）と、内容が改ざんされていないこと","受信者が本人であることと、通信経路の安定性","ウイルスが含まれていないことと、送達時刻"],"answer":1,"exp":"デジタル署名は、送信者が自分の秘密鍵で署名し、受信者が送信者の公開鍵で検証します。これにより①送信者のなりすましがないこと（真正性）、②内容が改ざんされていないこと（完全性）を確認できます。ウイルスの有無や通信速度は確認できません。"},
{"id":"T59","field":"T","cat":"セキュリティ","question":"多要素認証の例として、最も適切なものはどれか。","choices":["パスワードと秘密の質問の答えを組み合わせて認証する","パスワード（知識）とスマートフォンに送られるワンタイムパスワード（所持）を組み合わせて認証する","2つの異なるパスワードで2回認証する","利用者IDを2回入力させる"],"answer":1,"exp":"認証の3要素は「知識（パスワードなど）」「所持（スマートフォン、ICカードなど）」「生体（指紋、顔など）」です。多要素認証は異なる要素を2つ以上組み合わせることを指します。パスワード＋秘密の質問はどちらも「知識」なので多要素にはなりません。"},
{"id":"T60","field":"T","cat":"セキュリティ","question":"生体認証（バイオメトリクス認証）に関する記述として、適切なものはどれか。","choices":["指紋、静脈、虹彩、顔など身体的特徴や、署名の筆跡などの行動的特徴を用いて本人確認を行う","パスワードを長くする認証方式である","ICカードを用いた認証方式である","認証の誤りが一切発生しない方式である"],"answer":0,"exp":"生体認証は身体的・行動的特徴で本人確認する方式で、忘却や紛失の心配がない利点があります。ただし、他人を誤って受け入れる「他人受入率」と本人を誤って拒否する「本人拒否率」があり、誤りをゼロにはできません。両者はトレードオフの関係にあります。"},
{"id":"T61","field":"T","cat":"セキュリティ","question":"ランサムウェアの説明として、適切なものはどれか。","choices":["PC内のファイルを勝手に暗号化するなどして使用不能にし、復元と引換えに金銭を要求するマルウェア","キーボードの入力履歴を記録して盗み出すマルウェア","大量の広告を表示するマルウェア","自分自身を複製してネットワーク上に拡散するだけのマルウェア"],"answer":0,"exp":"ランサムウェア（Ransom＝身代金）は、ファイルの暗号化やシステムのロックで業務を妨害し、復旧と引換えに金銭を要求するマルウェアです。近年は「支払わなければ盗んだデータを公開する」と脅す二重恐喝も増えています。対策の基本はオフラインを含むバックアップです。キーボード入力を盗むのはキーロガーです。"},
{"id":"T62","field":"T","cat":"セキュリティ","question":"フィッシングの説明として、適切なものはどれか。","choices":["金融機関などをかたった偽の電子メールで偽のWebサイトに誘導し、暗証番号やクレジットカード番号などを入力させてだまし取る手口","サーバに大量のパケットを送り付けてサービスを停止させる攻撃","無線LANの通信を傍受する行為","プログラムの脆弱性を突いてサーバに侵入する攻撃"],"answer":0,"exp":"フィッシングは、実在の企業を装ったメールやSMS（スミッシング）で本物そっくりの偽サイトへ誘導し、認証情報やカード情報を詐取する手口です。対策として、メール内のリンクを安易にクリックしない、URLを確認する、正規アプリ・ブックマークからアクセスすることなどが有効です。"},
{"id":"T63","field":"T","cat":"セキュリティ","question":"ソーシャルエンジニアリングに該当する行為はどれか。","choices":["システム管理者になりすまして電話をかけ、利用者にパスワードを聞き出す","プログラムの脆弱性を利用してシステムに侵入する","ウイルスを添付したメールを送信する","通信データを盗聴するプログラムを仕掛ける"],"answer":0,"exp":"ソーシャルエンジニアリングは、技術ではなく人間の心理や行動の隙を突いて情報を盗む手法です。なりすましの電話、肩越しの画面ののぞき見（ショルダーハック）、ごみ箱あさり（トラッシング）などが該当します。対策は本人確認の徹底、のぞき見防止フィルタ、書類の裁断などです。"},
{"id":"T64","field":"T","cat":"セキュリティ","question":"社内ネットワークとインターネットの間に設置され、外部に公開するWebサーバなどを配置するネットワーク領域はどれか。","choices":["イントラネット","DMZ","VPN","LAN"],"answer":1,"exp":"DMZ（非武装地帯）は、ファイアウォールによって外部（インターネット）とも内部（社内LAN）とも隔離された中間領域です。公開WebサーバやメールサーバをDMZに置くことで、万一サーバが乗っ取られても内部ネットワークへの侵入を防ぎやすくなります。"},
{"id":"T65","field":"T","cat":"セキュリティ","question":"ISMS（情報セキュリティマネジメントシステム）に関する記述として、最も適切なものはどれか。","choices":["ウイルス対策ソフトの製品名である","組織が情報セキュリティを確保するための仕組みであり、リスクアセスメントに基づいて対策を決定し、PDCAサイクルで継続的に改善する","一度構築すれば見直しは不要である","技術的対策だけを対象とし、人的・物理的対策は含まない"],"answer":1,"exp":"ISMSは、組織的に情報セキュリティを管理する仕組みです。リスクアセスメント（リスクの特定・分析・評価）に基づき対策を決め、PDCAサイクルで継続的に改善します。技術的対策だけでなく、人的（教育など）・物理的（入退室管理など）・組織的対策を含みます。JIS Q 27001が認証基準です。"},
{"id":"T66","field":"T","cat":"セキュリティ","question":"情報セキュリティポリシーに関する記述として、最も適切なものはどれか。","choices":["情報セキュリティ基本方針は、経営陣（トップマネジメント）が確立し、組織内外に示すものである","情報セキュリティポリシーは、システム管理者だけが知っていればよい","情報セキュリティポリシーには、罰則や対策の内容を含めてはならない","一般従業員が各自で自由に基本方針を定める"],"answer":0,"exp":"情報セキュリティポリシーは一般に「基本方針・対策基準・実施手順」の階層で構成され、最上位の基本方針は経営陣が情報セキュリティへの取組姿勢を宣言するものです。全従業員に周知され、教育・訓練を通じて組織全体で実践されることが重要です。"},
{"id":"T67","field":"T","cat":"セキュリティ","question":"ワンタイムパスワードを利用する目的として、適切なものはどれか。","choices":["パスワードの入力を省略する","一度しか使えないパスワードを用いることで、パスワードが盗聴されても不正利用されるリスクを低減する","パスワードを全社員で共有する","パスワードを永久に変更しなくて済むようにする"],"answer":1,"exp":"ワンタイムパスワードは、トークンやスマートフォンアプリなどで生成される使い捨てのパスワードです。仮に盗聴・詐取されても次回は使えないため、なりすましのリスクを大幅に減らせます。ネットバンキングの取引認証などで広く使われ、多要素認証の「所持」要素としても機能します。"},
{"id":"T68","field":"T","cat":"セキュリティ","question":"ゼロトラストの考え方として、最も適切なものはどれか。","choices":["社内ネットワークからのアクセスは無条件で信頼する","社内・社外を問わず、全てのアクセスを信頼せずに毎回検証してから許可する","一度認証に成功した利用者は永久に信頼する","ファイアウォールさえ設置すれば内部の対策は不要である"],"answer":1,"exp":"ゼロトラストは「境界の内側だから安全」という従来の考え方（境界型防御）を捨て、社内外を問わず全てのアクセスを検証するセキュリティモデルです。クラウド利用やテレワークの普及で社内外の境界が曖昧になったことを背景に重要性が高まっています。"},
{"id":"S53","field":"S","cat":"企業活動","question":"CIO（Chief Information Officer）の役割として、最も適切なものはどれか。","choices":["経営戦略に沿った情報化戦略の立案と実行に責任をもつ","資金調達と財務報告に責任をもつ","人事制度の設計と運用に責任をもつ","製品の製造工程の管理に責任をもつ"],"answer":0,"exp":"CIOは最高情報責任者で、経営戦略と整合したIT戦略・情報化投資の立案と実行に責任をもつ役員です。財務はCFO、経営全体はCEOが担います。"},
{"id":"S54","field":"S","cat":"企業活動","question":"売上高が1,000万円、売上原価が600万円、販売費及び一般管理費が250万円のとき、営業利益は何万円か。","choices":["150万円","250万円","400万円","750万円"],"answer":0,"exp":"売上総利益（粗利益）＝売上高−売上原価＝1,000−600＝400万円。\n営業利益＝売上総利益−販売費及び一般管理費＝400−250＝150万円。\n利益の階層（売上総利益→営業利益→経常利益→当期純利益）を押さえましょう。"},
{"id":"S55","field":"S","cat":"企業活動","question":"ROE（自己資本利益率）を求める計算式として、適切なものはどれか。","choices":["当期純利益 ÷ 総資産 × 100","当期純利益 ÷ 自己資本 × 100","営業利益 ÷ 売上高 × 100","自己資本 ÷ 総資産 × 100"],"answer":1,"exp":"ROEは株主が出資した自己資本を使ってどれだけ効率よく利益を上げたかを示す指標で、当期純利益÷自己資本×100で求めます。総資産に対する利益率はROA、自己資本÷総資産は自己資本比率です。"},
{"id":"S56","field":"S","cat":"企業活動","question":"SDGsの説明として、最も適切なものはどれか。","choices":["日本の中小企業のIT導入を促進する補助金制度","国連で採択された、2030年までに達成すべき17の持続可能な開発目標","企業の財務情報を国際的に統一する会計基準","温室効果ガスの排出量を取引する制度"],"answer":1,"exp":"SDGs（Sustainable Development Goals：持続可能な開発目標）は2015年に国連サミットで採択された2030年までの国際目標で、貧困・教育・エネルギー・気候変動など17のゴールから成ります。企業活動でもSDGsへの貢献が重視されています。"},
{"id":"S57","field":"S","cat":"企業活動","question":"問題解決に用いる図のうち、結果とそれに影響を及ぼす要因の関係を魚の骨のような形で整理する図はどれか。","choices":["パレート図","特性要因図","管理図","散布図"],"answer":1,"exp":"特性要因図（フィッシュボーン図）は、結果（特性）に対して影響する要因を大骨・小骨のように枝分かれさせて整理する図で、品質問題の原因分析などに使われます。QC七つ道具の一つです。"},
{"id":"S58","field":"S","cat":"法務","question":"労働基準法に基づき、法定労働時間を超えて労働者に時間外労働をさせるために必要な手続はどれか。","choices":["労働者の代表と36協定を締結し、労働基準監督署に届け出る","社内の掲示板で時間外労働を告知する","労働者から個別に口頭で同意を得る","特に手続は必要ない"],"answer":0,"exp":"法定労働時間（1日8時間・週40時間）を超えて労働させるには、労働者の過半数代表と書面による労使協定（労働基準法36条に基づく「36協定」）を結び、労働基準監督署へ届け出る必要があります。"},
{"id":"S59","field":"S","cat":"法務","question":"不正競争防止法で保護される「営業秘密」の3要件として、適切な組合せはどれか。","choices":["秘密管理性、有用性、非公知性","新規性、進歩性、産業上の利用可能性","独自性、経済性、公開性","機密性、完全性、可用性"],"answer":0,"exp":"営業秘密として保護されるには、①秘密として管理されている（秘密管理性）、②事業に有用な情報である（有用性）、③公然と知られていない（非公知性）の3要件を満たす必要があります。新規性・進歩性は特許の要件、機密性・完全性・可用性は情報セキュリティの3要素です。"},
{"id":"S60","field":"S","cat":"法務","question":"匿名加工情報に関する記述として、適切なものはどれか。","choices":["特定の個人を識別できないように加工し、復元できないようにした情報であり、本人の同意なく第三者提供できる","氏名を削除しただけの情報であり、本人の同意がなければ利用できない","病歴や犯罪歴などの取扱いに配慮を要する情報である","本人の氏名・住所・生年月日をまとめた情報である"],"answer":0,"exp":"匿名加工情報は、特定の個人を識別できず、元の個人情報に復元できないように加工した情報です。一定のルールの下で本人の同意なく第三者提供や利活用ができ、ビッグデータ活用を促進する仕組みです。病歴などは要配慮個人情報です。"},
{"id":"S61","field":"S","cat":"経営戦略マネジメント","question":"3C分析の3つのCに該当する組合せとして、適切なものはどれか。","choices":["顧客、競合、自社","コスト、品質、納期","計画、実行、評価","文化、慣習、コミュニケーション"],"answer":0,"exp":"3C分析は、Customer（市場・顧客）、Competitor（競合）、Company（自社）の3つの視点で事業環境を分析するフレームワークです。市場のニーズと競合の動向を踏まえ、自社の戦略を導き出します。"},
{"id":"S62","field":"S","cat":"経営戦略マネジメント","question":"KPIの説明として、最も適切なものはどれか。","choices":["最終的な目標の達成度を測る指標","目標達成に向けたプロセスの実行状況を測る中間指標","目標達成のために特に重要となる成功要因","従業員の勤務評定に使う人事評価項目"],"answer":1,"exp":"KPI（重要業績評価指標）は、目標達成に向けた活動の進捗を測る中間指標です（例：訪問件数、成約率）。最終目標の達成度を測るのはKGI（例：売上高○億円）、目標達成のカギとなる要因はCSFです。KGI・KPI・CSFの関係は頻出です。"},
{"id":"S63","field":"S","cat":"経営戦略マネジメント","question":"RFM分析で顧客の評価に用いる指標の組合せとして、適切なものはどれか。","choices":["年齢、性別、職業","最終購買日、購買頻度、購買金額","認知度、好感度、購入意向","市場成長率、市場占有率、売上高"],"answer":1,"exp":"RFM分析はRecency（最終購買日）、Frequency（購買頻度）、Monetary（購買金額）の3指標で顧客をランク付けし、優良顧客の識別やキャンペーン対象の選定に活用する手法です。"},
{"id":"S64","field":"S","cat":"技術戦略マネジメント","question":"デザイン思考の説明として、最も適切なものはどれか。","choices":["製品の外観を美しくデザインすることを最優先する考え方","利用者への共感から課題を定義し、試作と検証を繰り返しながら解決策を生み出す思考法","デザイナーだけがアイディアを出す開発体制","過去の成功事例をそのまま模倣する手法"],"answer":1,"exp":"デザイン思考は、共感→問題定義→アイディア創出→プロトタイプ→テストのプロセスで、利用者視点に立って課題解決を図る思考法です。見た目のデザインではなく「設計のアプローチ」である点がポイントです。"},
{"id":"S65","field":"S","cat":"技術戦略マネジメント","question":"PoC（Proof of Concept）の説明として、適切なものはどれか。","choices":["新しい技術やアイディアの実現可能性を、試作などによって検証すること","製品の量産体制を確立すること","特許を出願すること","製品の販売価格を決定すること"],"answer":0,"exp":"PoC（概念実証）は、新技術・新アイディアが実際に機能するか、効果があるかを本格導入前に小規模な試作・実験で確かめる取組です。AIやIoT導入プロジェクトの初期段階でよく実施されます。"},
{"id":"S66","field":"S","cat":"ビジネスインダストリ","question":"ロングテールの説明として、最も適切なものはどれか。","choices":["売れ筋の上位2割の商品が売上の8割を占める現象","インターネット販売において、販売機会の少ないニッチな商品群の売上合計が全体の大きな割合を占めること","商品の流行が長期間継続すること","店舗の行列が長くなること"],"answer":1,"exp":"ロングテールは、実店舗では扱えない販売数の少ない商品でも、在庫制約の小さいネット販売では品ぞろえでき、その積み上げが大きな売上になるという考え方です。上位2割が8割を占めるのはパレートの法則（80:20の法則）で、ロングテールはその逆の発想です。"},
{"id":"S67","field":"S","cat":"ビジネスインダストリ","question":"NFTの特徴として、最も適切なものはどれか。","choices":["デジタルデータを何度でも複製できるようにする技術","ブロックチェーン技術によって、デジタルデータに唯一性（本物であること）をもたせる仕組み","現金をデジタル化した中央銀行発行の通貨","ネットワークの通信速度を高める技術"],"answer":1,"exp":"NFT（Non-Fungible Token：非代替性トークン）は、ブロックチェーン上で発行される代替不可能なトークンで、デジタルアートなどに「唯一の本物」という価値を持たせられます。複製が容易なデジタルデータに希少性を与える仕組みとして注目されています。"},
{"id":"S68","field":"S","cat":"ビジネスインダストリ","question":"エスクローサービスの説明として、適切なものはどれか。","choices":["商品の配送を高速化するサービス","個人間の売買において、第三者が代金を一時的に預かり、商品の受渡し確認後に売り手へ支払う仲介サービス","商品の広告を代行するサービス","ネットショップの開設を支援するサービス"],"answer":1,"exp":"エスクローサービスは、ネットオークションやフリマアプリなどの個人間取引で、信頼できる第三者が代金を預かることで「お金を払ったのに商品が届かない」といったトラブルを防ぐ仕組みです。"},
{"id":"S69","field":"S","cat":"システム戦略","question":"オンプレミスの説明として、適切なものはどれか。","choices":["自社の施設内に情報システムの機器を設置し、自社で運用する形態","インターネット経由でソフトウェアを利用する形態","システムの運用を全て外部に委託する形態","私物の端末を業務に利用する形態"],"answer":0,"exp":"オンプレミスは自社内でシステムを保有・運用する従来型の形態です。カスタマイズの自由度が高い一方、初期投資や運用負担が大きくなります。クラウドと対比して問われることが多い用語です。"},
{"id":"S70","field":"S","cat":"システム戦略","question":"SoEに分類されるシステムとして、最も適切なものはどれか。","choices":["会計データを正確に記録する経理システム","顧客とのつながりを深めるためのスマートフォンアプリ","給与計算を行う人事システム","在庫数を管理する倉庫システム"],"answer":1,"exp":"SoE（Systems of Engagement）は顧客との関係構築・エンゲージメントを重視するシステムで、顧客向けアプリやSNS連携サービスが該当します。一方、正確な記録を重視する基幹系（会計・人事・在庫など）はSoR（Systems of Record）です。"},
{"id":"S71","field":"S","cat":"システム企画","question":"非機能要件に該当するものはどれか。","choices":["受注データを入力できること","月次の売上集計表を出力できること","システムの応答時間が3秒以内であること","顧客情報を検索できること"],"answer":2,"exp":"非機能要件は、機能そのもの以外の要件（性能・可用性・セキュリティ・運用保守性など）です。応答時間・稼働率・同時接続数などが典型例です。「〜できること」という業務機能は機能要件に当たります。"},
{"id":"M31","field":"M","cat":"システム開発技術","question":"ソフトウェアの品質特性のうち、「移植性」の説明として適切なものはどれか。","choices":["障害が発生しにくく、安定して動作する度合い","別のOSやハードウェア環境へ移しやすい度合い","処理速度が速く、資源を効率的に使う度合い","機能の修正や変更のしやすさの度合い"],"answer":1,"exp":"移植性（ポータビリティ）は、ソフトウェアを別の環境（OS・ハードウェアなど）へ移しやすい性質です。安定動作は信頼性、処理効率は性能効率性、修正のしやすさは保守性です。品質特性の名称と意味の対応は頻出です。"},
{"id":"M32","field":"M","cat":"システム開発技術","question":"プロトタイピングモデルの利点として、最も適切なものはどれか。","choices":["開発の早い段階で試作品を利用者に確認してもらうことで、要求とのずれを早期に発見できる","設計書を作成する必要がない","テストを省略できる","開発費用が必ず安くなる"],"answer":0,"exp":"プロトタイピングは、早期に試作品（プロトタイプ）を作って利用者に見せることで、要求の認識違いや操作性の問題を早い段階で発見・修正できる開発モデルです。手戻りの大きいウォータフォールの弱点を補います。"},
{"id":"M33","field":"M","cat":"ソフトウェア開発管理技術","question":"リファクタリングの説明として、適切なものはどれか。","choices":["プログラムの機能を追加すること","外部から見た動作を変えずに、プログラムの内部構造を整理・改善すること","プログラムのバグを修正すること","古いシステムを新しいシステムに置き換えること"],"answer":1,"exp":"リファクタリングは、動作（外部仕様）を変えずにコードの内部構造を読みやすく保守しやすい形に改善する活動で、アジャイル開発（XP）の代表的プラクティスの一つです。機能追加やバグ修正とは区別されます。"},
{"id":"M34","field":"M","cat":"ソフトウェア開発管理技術","question":"継続的インテグレーション（CI）の説明として、最も適切なものはどれか。","choices":["コードの変更を頻繁に共有リポジトリに統合し、自動ビルドと自動テストで問題を早期に発見する開発手法","年に1回だけシステムを更新する運用方法","全てのテストを手作業で行う品質管理手法","開発チームを頻繁に交代させる人員管理手法"],"answer":0,"exp":"CI（Continuous Integration）は、開発者がコードを頻繁に統合し、その都度自動でビルド・テストを実行して不具合を早期に発見する手法です。リリースまで自動化を広げたCD（継続的デリバリー）とともにDevOpsを支える実践です。"},
{"id":"M35","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクト憲章の説明として、適切なものはどれか。","choices":["プロジェクトの目的や体制、プロジェクトマネージャの権限などを定め、プロジェクトの開始を正式に承認する文書","日々の作業実績を記録する日報","システムの操作方法を説明する文書","メンバーの勤務時間を管理する表"],"answer":0,"exp":"プロジェクト憲章は、プロジェクトの立上げ時に作成され、目的・成果物の概要・体制・PMの権限・制約条件などを定めてプロジェクトを公式に認可する文書です。"},
{"id":"M36","field":"M","cat":"プロジェクトマネジメント","question":"プロジェクトのスコープに関する記述として、最も適切なものはどれか。","choices":["プロジェクトの予算総額のこと","プロジェクトで作成する成果物と、そのために必要な作業の範囲のこと","プロジェクトメンバーの人数のこと","プロジェクトの開始日と終了日のこと"],"answer":1,"exp":"スコープは、プロジェクトが生み出す成果物と実施すべき作業の範囲です。スコープ・時間（スケジュール）・コストはプロジェクトの3大制約と呼ばれ、互いにトレードオフの関係にあります。範囲が広がれば時間と費用も増えます。"},
{"id":"M37","field":"M","cat":"プロジェクトマネジメント","question":"作業A（4日）とB（6日）は同時に開始でき、作業CはAとBの両方が完了した後に開始できて3日かかる。このプロジェクトの最短完了日数とクリティカルパス上の作業の組合せとして、適切なものはどれか。","choices":["7日、A→C","9日、B→C","10日、A→B→C","13日、A→B→C"],"answer":1,"exp":"Cの開始はAとBの遅い方（B＝6日）に依存するため、最短完了日数＝6＋3＝9日。所要日数を決めている最長経路B→Cがクリティカルパスです。クリティカルパス上の作業（B、C）が遅れると全体が遅れます。"},
{"id":"M38","field":"M","cat":"サービスマネジメント","question":"ITサービスマネジメントにおける変更管理の目的として、最も適切なものはどれか。","choices":["利用者からの問合せに迅速に回答すること","システムへの変更を評価・承認し、リスクを抑えて確実に実施すること","障害の根本原因を分析すること","IT資産の構成情報を記録すること"],"answer":1,"exp":"変更管理は、システム変更の要求（RFC）を受け付け、影響やリスクを評価・承認した上で計画的に実施するプロセスです。無秩序な変更による障害を防ぎます。問合せ対応はサービスデスク、根本原因分析は問題管理、構成情報の管理は構成管理です。"},
{"id":"M39","field":"M","cat":"システム監査","question":"監査証拠の説明として、適切なものはどれか。","choices":["監査人の主観的な感想","監査の結論を裏付けるために監査人が入手する資料や記録","被監査部門が作成した弁明書","監査報告書の表紙"],"answer":1,"exp":"監査証拠は、監査意見（指摘事項・結論）の合理的な根拠となる資料・記録です。監査人はドキュメントの査閲、担当者へのインタビュー、現地調査などで証拠を入手し、監査調書に記録します。"},
{"id":"M40","field":"M","cat":"システム監査","question":"ITガバナンスの説明として、最も適切なものはどれか。","choices":["情報システム部門が日常の運用作業を行うこと","経営陣がITの利活用を方向付け、統制し、企業価値の向上につなげる仕組み","プログラムの品質を検査すること","ネットワークの通信量を監視すること"],"answer":1,"exp":"ITガバナンスは、経営陣（取締役会など）がステークホルダのニーズに基づき、ITの利活用のあるべき姿を示して統制する仕組みです。日常の管理・運用（ITマネジメント）を方向付ける上位の概念である点がポイントです。"},
{"id":"T69","field":"T","cat":"基礎理論","question":"16進数のAを10進数で表したものはどれか。","choices":["8","10","12","16"],"answer":1,"exp":"16進数は0〜9の後にA（10）、B（11）、C（12）、D（13）、E（14）、F（15）を使います。よってA＝10です。16進数は2進数4桁を1桁で表せるため、コンピュータの世界で広く使われます。"},
{"id":"T70","field":"T","cat":"基礎理論","question":"AIの機械学習における過学習の説明として、適切なものはどれか。","choices":["学習に使ったデータには高い精度を示すが、未知のデータに対する予測精度が低くなる状態","学習の回数が不足して精度が上がらない状態","学習データが少なすぎて学習できない状態","複数のAIが互いに学習し合う仕組み"],"answer":0,"exp":"過学習（オーバーフィッティング）は、モデルが訓練データの細かな特徴やノイズまで覚え込みすぎて、汎化性能（未知データへの対応力）が落ちる現象です。データを増やす、モデルを単純にするなどの対策があります。"},
{"id":"T71","field":"T","cat":"基礎理論","question":"大規模言語モデル（LLM）の説明として、最も適切なものはどれか。","choices":["大量のテキストデータで学習し、文章の理解や生成ができるAIモデル","大容量のファイルを圧縮するアルゴリズム","データベースの容量を拡張する技術","高解像度の画像を処理する専用ハードウェア"],"answer":0,"exp":"LLM（Large Language Model）は、インターネット上の膨大なテキストを学習して言語のパターンを獲得したAIモデルで、対話型生成AIの基盤技術です。文章生成・要約・翻訳・質問応答など幅広い言語タスクに対応できます。"},
{"id":"T72","field":"T","cat":"アルゴリズムとプログラミング","question":"先に格納したデータを先に取り出す、先入れ先出し（FIFO）のデータ構造はどれか。","choices":["スタック","キュー","木構造","2分木"],"answer":1,"exp":"キューはFIFO（First In First Out）のデータ構造で、レジの行列のように先に並んだものから処理されます。プリンタの印刷待ちなどに使われます。スタックはLIFO（後入れ先出し）で対になる構造です。"},
{"id":"T73","field":"T","cat":"アルゴリズムとプログラミング","question":"ノーコード開発の説明として、最も適切なものはどれか。","choices":["プログラムのコードを一切記述せず、画面上の部品の組合せなどでアプリケーションを開発する手法","プログラムのコメントを書かない開発手法","暗号化されていないコードで開発する手法","1人でコードを書く開発手法"],"answer":0,"exp":"ノーコードはプログラミング不要でアプリを開発できる手法、ローコードは少ないコード記述で開発できる手法です。専門のIT人材でなくても業務アプリを作れるため、開発の内製化や市民開発の手段として注目されています。"},
{"id":"T74","field":"T","cat":"コンピュータ構成要素","question":"SSDの特徴として、HDDと比較した場合に適切なものはどれか。","choices":["磁気ディスクを回転させて読み書きするため、衝撃に強い","フラッシュメモリを使用しており、読み書きが高速で衝撃に強い","電源を切ると記憶内容が消える","容量当たりの単価が必ず安い"],"answer":1,"exp":"SSDはフラッシュメモリを使う補助記憶装置で、機械的な可動部品がないため高速・静音・耐衝撃・省電力です。HDDは磁気ディスクを回転させるため衝撃に弱い一方、容量当たりの単価は一般に安価です。"},
{"id":"T75","field":"T","cat":"システム構成要素","question":"稼働率0.8の装置を2台並列に接続したシステム全体の稼働率はいくらか。ここで、どちらか一方が稼働していればシステムは稼働しているものとする。","choices":["0.64","0.80","0.96","1.60"],"answer":2,"exp":"並列システムは「両方同時に故障したときだけ停止」します。\n故障率＝1−0.8＝0.2。両方故障する確率＝0.2×0.2＝0.04。\n稼働率＝1−0.04＝0.96。並列化（冗長化）で信頼性が大きく向上することが分かります。"},
{"id":"T76","field":"T","cat":"システム構成要素","question":"MTBFとMTTRに関する記述として、適切なものはどれか。","choices":["MTBFは平均修理時間を表し、短いほど信頼性が高い","MTBFは平均故障間隔を表し、長いほど信頼性が高い","MTTRは平均故障間隔を表し、長いほど保守性が高い","MTTRが長いほど稼働率は高くなる"],"answer":1,"exp":"MTBF（Mean Time Between Failures）は故障と故障の間の平均稼働時間で、長いほど信頼性が高いといえます。MTTR（Mean Time To Repair）は平均修理時間で、短いほど保守性が良好です。稼働率＝MTBF÷（MTBF＋MTTR）で計算します。"},
{"id":"T77","field":"T","cat":"ソフトウェア","question":"GPLライセンスのOSSに関する記述として、適切なものはどれか。","choices":["改変して再配布する場合、ソースコードの公開が求められる","商用利用は一切禁止されている","著作権が放棄されている","改変は禁止されている"],"answer":0,"exp":"GPLはコピーレフト型の代表的なOSSライセンスで、GPLのコードを改変・組込みして配布する場合は派生物もGPLで（ソースコードを公開して）提供する必要があります。商用利用や改変自体は可能で、著作権も放棄されていません。"},
{"id":"T78","field":"T","cat":"情報デザイン","question":"Webページの画面設計において、複数の選択肢から1つだけ選ばせたい場合に使う画面部品として、適切なものはどれか。","choices":["チェックボックス","ラジオボタン","テキストボックス","スクロールバー"],"answer":1,"exp":"ラジオボタンは複数の選択肢から1つだけを選ぶ部品です（性別の選択など）。複数選択を許すのはチェックボックス、自由入力はテキストボックスです。用途に応じた部品の使い分けが問われます。"},
{"id":"T79","field":"T","cat":"情報メディア","question":"可逆圧縮と非可逆圧縮に関する記述のうち、適切なものはどれか。","choices":["JPEGは可逆圧縮なので、圧縮後も完全に元の画像に戻せる","ZIPは非可逆圧縮なので、解凍してもファイルは元に戻らない","可逆圧縮は完全に元のデータに復元でき、文書やプログラムの圧縮に適している","非可逆圧縮は圧縮率が低いという欠点がある"],"answer":2,"exp":"可逆圧縮（ZIP、PNGなど）は完全に元に戻せるため、1ビットでも欠けると困る文書・プログラムに使います。非可逆圧縮（JPEG、MP3、MPEGなど）は人間が知覚しにくい情報を捨てて高圧縮率を実現しますが、元には戻せません。"},
{"id":"T80","field":"T","cat":"データベース","question":"トランザクションのACID特性のうち、「一連の処理が全て実行されるか、全く実行されないかのどちらかであることを保証する」性質はどれか。","choices":["原子性（Atomicity）","一貫性（Consistency）","独立性（Isolation）","耐久性（Durability）"],"answer":0,"exp":"原子性は「全部実行か、全部取消しか」を保証する性質です。銀行振込で「出金だけ実行されて入金されない」事態を防ぎます。一貫性はデータの整合性維持、独立性は同時実行しても互いに干渉しないこと、耐久性は確定した結果が障害でも失われないことです。"},
{"id":"T81","field":"T","cat":"データベース","question":"デッドロックの説明として、適切なものはどれか。","choices":["データベースの容量が不足して書き込めなくなること","複数のトランザクションが、互いに相手がロックした資源の解放を待ち続けて処理が進まなくなること","ネットワークが切断されてデータベースにアクセスできないこと","誤ってデータを削除してしまうこと"],"answer":1,"exp":"デッドロックは、トランザクションAが資源1をロックして資源2を待ち、トランザクションBが資源2をロックして資源1を待つ、というように互いに待ち合って動けなくなる状態です。DBMSは一方を強制的にロールバックして解消します。"},
{"id":"T82","field":"T","cat":"ネットワーク","question":"プロキシサーバの役割として、最も適切なものはどれか。","choices":["内部ネットワークのコンピュータに代わってインターネットへのアクセスを代理で行う","ドメイン名をIPアドレスに変換する","メールを保管して受信を待つ","IPアドレスを自動的に割り当てる"],"answer":0,"exp":"プロキシ（代理）サーバは、社内PCの代わりに外部Webサイトへアクセスし、その結果を中継します。内部のIPアドレスを隠せるほか、アクセス内容の記録・フィルタリングやキャッシュによる高速化にも使われます。"},
{"id":"T83","field":"T","cat":"ネットワーク","question":"IPv6がIPv4に代わって導入された主な理由として、適切なものはどれか。","choices":["通信速度を高速化するため","IPアドレスの枯渇に対応してアドレス空間を拡大するため","無線通信を可能にするため","通信料金を安くするため"],"answer":1,"exp":"IPv4のアドレスは32ビット（約43億個）で、インターネットの普及により枯渇しました。IPv6はアドレスを128ビットに拡張し、事実上無限のアドレス空間を確保しています。IoTで機器数が爆発的に増える時代の基盤です。"},
{"id":"T84","field":"T","cat":"ネットワーク","question":"MVNOの説明として、適切なものはどれか。","choices":["自前の無線通信回線網をもち、他社に回線を貸し出す事業者","大手通信事業者から回線を借りて、自社ブランドで移動通信サービスを提供する事業者","インターネット上で動画を配信する事業者","海外でスマートフォンを利用できるようにするサービス"],"answer":1,"exp":"MVNO（仮想移動体通信事業者）は、自前の回線網をもたず、大手キャリア（MNO）から回線を借りてサービスを提供する事業者です。設備投資が不要なため、低価格のサービス（格安SIM）を実現しやすいのが特徴です。"},
{"id":"T85","field":"T","cat":"セキュリティ","question":"パスワードリスト攻撃の説明として、適切なものはどれか。","choices":["辞書にある単語を順に試す攻撃","他のサービスから流出したIDとパスワードの組を使ってログインを試みる攻撃","全ての文字の組合せを総当たりで試す攻撃","パスワードをメモした紙を盗み見る行為"],"answer":1,"exp":"パスワードリスト攻撃は、流出したID・パスワードのリストを他のサービスで試す攻撃です。同じパスワードを複数サービスで使い回していると被害が連鎖するため、サービスごとに異なるパスワードを設定することが最大の対策です。"},
{"id":"T86","field":"T","cat":"セキュリティ","question":"ゼロデイ攻撃の説明として、適切なものはどれか。","choices":["攻撃を開始してから1日以内に終わる攻撃","脆弱性が公表されてから、修正プログラムが提供される前に行われる攻撃","毎日決まった時刻に行われる攻撃","1日だけ有効なパスワードを盗む攻撃"],"answer":1,"exp":"ゼロデイ攻撃は、脆弱性の発見から修正プログラム（パッチ）提供までの「無防備な期間」を突く攻撃です。パッチ適用だけでは防げないため、EDRによる侵入後の検知や多層防御が重要になります。"},
{"id":"T87","field":"T","cat":"セキュリティ","question":"標的型攻撃メールの特徴として、最も適切なものはどれか。","choices":["不特定多数に同じ内容で大量に送信される","業務に関係がありそうな件名や実在の関係者を装った内容で、特定の組織に送られる","件名が全て英語で書かれている","添付ファイルは必ず実行形式ファイルである"],"answer":1,"exp":"標的型攻撃は特定の組織を狙い、業務連絡や取引先を装った巧妙なメールでマルウェア感染や情報詐取を図ります。無差別なばらまき型と異なり見分けが難しいため、不審な添付ファイルを開かない訓練や、開封後の検知・対応体制（CSIRT等）が重要です。"},
{"id":"T88","field":"T","cat":"セキュリティ","question":"公開鍵基盤（PKI）における認証局（CA）の役割として、適切なものはどれか。","choices":["通信データを暗号化する","電子証明書を発行し、公開鍵とその所有者の対応を保証する","パスワードを保管する","ウイルスを検知して駆除する"],"answer":1,"exp":"認証局（CA）は、公開鍵が確かに本人のものであることを電子証明書の発行によって保証する信頼できる第三者機関です。この仕組み全体をPKI（公開鍵基盤）といい、HTTPSのサーバ証明書やデジタル署名を支えています。"},
{"id":"T89","field":"T","cat":"セキュリティ","question":"リスク対応のうち「リスク回避」に該当するものはどれか。","choices":["情報漏えい保険に加入する","リスクの原因となる業務や活動自体を取りやめる","アクセス制御を強化して発生確率を下げる","影響が小さいため対策せずそのまま受け入れる"],"answer":1,"exp":"リスク回避は、リスクの原因そのものを断つ対応です（例：リスクの高いサービスの提供中止、機密情報の保持自体をやめる）。保険加入はリスク共有（移転）、発生確率や影響を下げるのはリスク低減、受け入れるのはリスク保有（受容）です。"},
{"id":"T90","field":"T","cat":"セキュリティ","question":"シングルサインオン（SSO）の説明として、適切なものはどれか。","choices":["1つのパスワードを全員で共有する仕組み","一度の認証で、許可された複数のシステムやサービスを利用できる仕組み","1台のPCを複数人で使う仕組み","サインイン（ログイン）を1日1回に制限する仕組み"],"answer":1,"exp":"SSOは一度の認証で複数のシステムを利用できる仕組みです。利用者はパスワードを何度も入力せずに済み、管理するパスワードの数も減るため利便性とセキュリティの両面で効果があります。クラウドサービスの普及で重要性が増しています。"},
{"id":"T91","field":"T","cat":"AI・生成AI","question":"生成AI（Generative AI）の説明として、最も適切なものはどれか。","choices":["あらかじめ登録された定型文を、条件に応じて選択して表示するシステム","学習したデータの特徴を基に、文章・画像・音声などの新しいコンテンツを作り出すAI","人間の操作を記録して、同じ操作を自動で繰り返すソフトウェア","データを高速に検索して、該当する既存の文書をそのまま提示するシステム"],"answer":1,"exp":"生成AIは、大量のデータから学習した特徴やパターンを基に、新しい文章・画像・音声・プログラムコードなどを生成するAIです。既存データの検索や定型文の選択（ア・エ）、操作の自動化（RPA：ウ）とは異なり、「新しいコンテンツを作り出す」点が特徴です。"},
{"id":"T92","field":"T","cat":"AI・生成AI","question":"大規模言語モデル（LLM：Large Language Model）の説明として、適切なものはどれか。","choices":["大量のテキストデータを学習し、文脈に応じた自然な文章の生成や質問応答を行うAIモデル","大規模なデータベースを高速に検索するための索引構造","プログラミング言語の文法誤りを自動で修正するツール","音声を文字に変換する専用のハードウェア"],"answer":0,"exp":"LLMは、インターネット上の文書など膨大なテキストを学習し、「次に来る確率が高い言葉」を予測することで自然な文章を生成する言語モデルです。ChatGPTなどの対話型生成AIの中核技術で、質問応答・要約・翻訳・文章作成など幅広いタスクに対応できます。"},
{"id":"T93","field":"T","cat":"AI・生成AI","question":"生成AIに対する「プロンプトエンジニアリング」の説明として、最も適切なものはどれか。","choices":["AIのプログラムを修正して機能を追加すること","AIから意図した回答を得られるよう、指示文（プロンプト）の内容や構成を工夫すること","AIの学習に使うデータを収集・整理すること","AIの回答を人間が採点して、モデルを再学習させること"],"answer":1,"exp":"プロンプトエンジニアリングは、生成AIへの指示文（プロンプト）を工夫して、より適切な出力を引き出す技術です。役割を与える、例を示す、出力形式を指定する、手順を分けるなどの工夫があります。プログラム修正（ア）やデータ整備（ウ）、人間のフィードバックによる再学習（エ）とは区別されます。"},
{"id":"T94","field":"T","cat":"AI・生成AI","question":"生成AIの「ハルシネーション」の説明として、適切なものはどれか。","choices":["AIが学習データを暗記してしまい、同じ回答しかできなくなる現象","AIが事実と異なる内容を、もっともらしく生成してしまう現象","AIの応答速度が遅くなる現象","AIが著作権のある文章をそのまま出力してしまう現象"],"answer":1,"exp":"ハルシネーション（幻覚）は、生成AIが事実に基づかない情報を、あたかも正しいことのように自然な文章で出力してしまう現象です。生成AIは「もっともらしい言葉の並び」を予測しているため、存在しない文献や誤った数値を示すことがあります。重要な用途では人間による事実確認（ファクトチェック）が不可欠です。"},
{"id":"T95","field":"T","cat":"AI・生成AI","question":"学習済みのAIモデルに、特定の業務分野のデータを追加で学習させて、その分野に適した応答ができるように調整することを何と呼ぶか。","choices":["ファインチューニング","スケールアウト","リファクタリング","ノーマライゼーション"],"answer":0,"exp":"ファインチューニングは、汎用の学習済みモデルに自社データや専門分野のデータを追加学習させ、特定の用途に最適化する手法です。ゼロから学習するより少ないデータと計算資源で済みます。スケールアウトはサーバの台数を増やす拡張方法、リファクタリングはプログラムの内部構造の改善、ノーマライゼーションはデータベースの正規化です。"},
{"id":"T96","field":"T","cat":"AI・生成AI","question":"機械学習のうち「教師あり学習」の説明として、適切なものはどれか。","choices":["正解（ラベル）付きのデータを学習させ、未知のデータの分類や予測を行わせる手法","正解を与えず、データの構造や類似性からグループ分けなどを行わせる手法","試行錯誤の結果に報酬を与えることで、最適な行動を学習させる手法","人間の教師がAIの回答を毎回添削する手法"],"answer":0,"exp":"教師あり学習は「入力と正解のペア」を学習させる手法で、迷惑メール判定や売上予測などに使われます。正解を与えずにデータのグループ分け（クラスタリング）などを行うのは教師なし学習（イ）、報酬を手がかりに行動を学習するのは強化学習（ウ）です。この3分類は頻出なので必ず区別できるようにしましょう。"},
{"id":"T97","field":"T","cat":"AI・生成AI","question":"ディープラーニング（深層学習）の説明として、最も適切なものはどれか。","choices":["人間があらかじめ定義したルールに従って判断を行う手法","人間の脳の神経回路を模したニューラルネットワークを多層化し、データから特徴を自動的に抽出して学習する手法","過去の事例をそのまま記憶し、最も似た事例の答えを返す手法","乱数を使って解の候補を大量に生成し、最も良いものを選ぶ手法"],"answer":1,"exp":"ディープラーニングは、多層のニューラルネットワークを用いて、画像の特徴などを人間が指定しなくてもデータから自動的に学習する手法です。画像認識・音声認識・自然言語処理の精度を飛躍的に向上させ、生成AIの基盤にもなっています。ルールベースの判断（ア）は従来型のエキスパートシステムに近い考え方です。"},
{"id":"T98","field":"T","cat":"AI・生成AI","question":"機械学習における「過学習（オーバーフィッティング）」の説明として、適切なものはどれか。","choices":["学習時間が長すぎて計算資源を使い切ってしまうこと","学習データに過剰に適合してしまい、未知のデータに対する予測精度が低下すること","学習データが多すぎてモデルに読み込めないこと","複数のAIが同じデータを重複して学習すること"],"answer":1,"exp":"過学習は、モデルが学習データの細かな特徴やノイズまで覚え込んでしまい、学習データでは高い正解率なのに、未知のデータではうまく機能しなくなる状態です。対策には、学習データを増やす、モデルを単純化する、検証用データで確認しながら学習を打ち切るなどがあります。"},
{"id":"T99","field":"T","cat":"AI・生成AI","question":"ディープフェイクがもたらす社会的リスクとして、最も適切なものはどれか。","choices":["AIの学習に大量の電力が消費される","実在の人物が話しているかのような偽動画により、偽情報の拡散や詐欺、名誉毀損が起こる","AIモデルのファイルサイズが大きくなり保存領域を圧迫する","プログラムの処理速度が低下する"],"answer":1,"exp":"ディープフェイクは、AIで人物の顔や声を合成し、本人が実際には行っていない発言や行動の動画・音声を作る技術です。偽ニュースの拡散、なりすまし詐欺（経営者の声を偽装した送金指示など）、名誉毀損といった悪用が社会問題になっています。見破る技術や発信元の確認など、受け手側のリテラシーも重要です。"},
{"id":"T100","field":"T","cat":"AI・生成AI","question":"企業で生成AIを業務利用する際の留意点として、最も適切なものはどれか。","choices":["生成AIの出力はすべて正確なので、確認せずにそのまま利用する","顧客の個人情報や社外秘の情報を安易に入力せず、出力内容は事実確認と権利侵害の確認を行ってから利用する","生成AIの利用は情報システム部門だけに限定しなければならないと法律で定められている","生成AIが作成した文章には著作権が発生しないので、他人の生成物を自由に自社の著作物として販売できる"],"answer":1,"exp":"生成AIの業務利用では、①入力した情報がAIの学習や外部に利用されるおそれがあるため機密情報・個人情報を入力しない、②ハルシネーションがあるため出力の事実確認を行う、③既存の著作物に類似した出力になる可能性があるため権利侵害を確認する、といった注意が必要です。多くの企業が利用ガイドラインを定めて運用しています。"},
{"id":"T101","field":"T","cat":"AI・生成AI","question":"テキスト・画像・音声など複数の種類のデータをまとめて扱えるAIを表す用語として、適切なものはどれか。","choices":["マルチモーダルAI","マルチタスクOS","マルチメディアデータベース","マルチキャスト"],"answer":0,"exp":"マルチモーダルAIは、テキスト・画像・音声・動画など複数の形式（モダリティ）の情報を組み合わせて理解・生成できるAIです。例えば「画像を見せて内容を文章で説明させる」「音声で指示して画像を生成させる」といった使い方ができます。近年の生成AIの主要な進化の方向です。"},
{"id":"T102","field":"T","cat":"AI・生成AI","question":"機械学習の学習データを作成するために、画像や文章に「これは猫」「これは肯定的な意見」などの正解ラベルを付与する作業を何と呼ぶか。","choices":["アノテーション","マイグレーション","インデクシング","レンダリング"],"answer":0,"exp":"アノテーションは、データに正解ラベルや注釈を付ける作業で、教師あり学習の学習データ作成に不可欠です。ラベルの品質がAIの精度を左右します。マイグレーションはシステムやデータの移行、インデクシングは検索用の索引作成、レンダリングは描画処理です。"},
{"id":"T103","field":"T","cat":"セキュリティ","question":"ゼロトラストの考え方として、最も適切なものはどれか。","choices":["社内ネットワークの内側は安全とみなし、境界の防御を強化する","「何も信頼しない」を前提に、社内外を問わずすべてのアクセスを検証してから許可する","信頼できる従業員には認証を省略して利便性を高める","一度認証に成功した端末は、その後の検証を省略する"],"answer":1,"exp":"ゼロトラストは「境界の内側なら安全」という従来の考え方（境界型防御）を捨て、利用者・端末・場所を問わず、アクセスのたびに認証・認可と状態の検証を行うセキュリティモデルです。クラウド利用やテレワークの普及で社内外の境界が曖昧になったことを背景に広まりました。"},
{"id":"T104","field":"T","cat":"セキュリティ","question":"多要素認証の組合せとして、最も適切なものはどれか。","choices":["パスワードと秘密の質問","パスワードとスマートフォンに送信されるワンタイムパスワード","指紋と顔認証","2つの異なるパスワード"],"answer":1,"exp":"多要素認証は「知識（パスワードなど）」「所持（スマートフォン・ICカードなど）」「生体（指紋・顔など）」のうち、異なる2つ以上の要素を組み合わせる認証です。パスワード＋秘密の質問は知識＋知識、指紋＋顔は生体＋生体で、いずれも同一要素の組合せなので多要素認証にはなりません。"},
{"id":"T105","field":"T","cat":"セキュリティ","question":"ランサムウェア対策として、最も有効なものはどれか。","choices":["データのバックアップを取得し、ネットワークから切り離した場所にも保管する","パソコンの画面ロックを設定する","ハードディスクを暗号化する","長いパスワードを設定する"],"answer":0,"exp":"ランサムウェアはデータを暗号化して身代金を要求する攻撃です。感染してもデータを復元できるよう、バックアップの取得が最も有効な備えです。近年はバックアップまで暗号化される被害があるため、ネットワークから切り離した（オフライン）保管や別拠点保管が推奨されます。画面ロックやディスク暗号化は盗難・のぞき見対策です。"},
