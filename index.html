  <div class="card">
    <div class="qhead">
      <span class="chip field-${q.field}">${FIELDS[q.field]}</span>
      <span class="chip cat">${q.cat}</span>
      <span class="sp"></span>
      <button class="bmbtn ${bm?"on":""}" onclick="toggleBM('${q.id}',this)">⭐</button>
    </div>
    <div class="qtext">${esc(q.question)}</div>
    <div id="choices">${q.choices.map((c,i)=>`
      <button class="choice" onclick="answer(${i})"><span class="n">${KANA[i]}</span><span>${esc(c)}</span></button>`).join("")}
    </div>
    <div id="after"></div>
  </div>`;
}
function toggleBM(id,btn){
  const i=store.bm.indexOf(id);
  i>=0?store.bm.splice(i,1):store.bm.push(id);
  save();btn.classList.toggle("on");
}
function answer(sel){
  if(quiz.answered)return;
  quiz.answered=true;
  const q=quiz.list[quiz.i];
  const ok=sel===q.answer;
  if(ok)quiz.ok++;
  rec(q.id,ok);
  quiz.results.push({id:q.id,ok});
  const btns=document.querySelectorAll("#choices .choice");
  btns.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer)b.classList.add("correct");
    else if(i===sel)b.classList.add("wrong");
  });
  document.getElementById("after").innerHTML=`
    <div class="judge ${ok?"ok":"ng"}">${ok?"○ 正解":"× 不正解"}</div>
    <div class="expbox"><b>【解説】正解は「${KANA[q.answer]}」</b>\n${esc(q.exp)}</div>
    <button class="btn" onclick="nextQ()">${quiz.i+1<quiz.list.length?"次の問題へ":"結果を見る"}</button>`;
  window.scrollTo({top:document.getElementById("after").offsetTop-80,behavior:"smooth"});
}
function nextQ(){
  quiz.i++;quiz.answered=false;
  quiz.i<quiz.list.length?renderQ():finishQuiz();
}
function quitQuiz(){
  if(quiz&&quiz.results.length&&quiz.i<quiz.list.length){
    if(!confirm("演習を終了しますか？"))return;
  }
  quiz=null;go("practice");
}
function finishQuiz(){
  const n=quiz.list.length,ok=quiz.ok;
  const rate=Math.round(ok/n*100);
  view.innerHTML=`
  <div class="card">
    <div class="score-big"><div class="n">${ok}<small style="font-size:20px;color:var(--sub)">/${n}</small></div>
    <div class="d">正答率 ${rate}%</div></div>

function startMock(conf){
  conf=conf||MOCK_CONF;
  const pick=(f,n)=>shuffle(QUESTIONS.filter(q=>q.field===f)).slice(0,n);
  const list=shuffle([...pick("S",conf.S),...pick("M",conf.M),...pick("T",conf.T)]);
  mock={list,i:0,ans:new Array(list.length).fill(null),flag:new Array(list.length).fill(false)};
  mockLeft=conf.minutes*60;
  mockTimer=setInterval(()=>{
    mockLeft--;
    const el=document.getElementById("mtimer");
    if(el){el.textContent=fmtTime(mockLeft);el.classList.toggle("low",mockLeft<300);}
    if(mockLeft<=0){stopTimer();alert("試験時間が終了しました。採点します。");gradeMock();}
  },1000);
  renderMockQ();
}
function stopTimer(){if(mockTimer){clearInterval(mockTimer);mockTimer=null;}}
function fmtTime(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

  const q=mock.list[mock.i];

    ${q.choices.map((c,i)=>`

function confirmEndMock(){
  const un=mock.ans.filter(a=>a===null).length;

function gradeMock(){
  const per={S:{o:0,n:0},M:{o:0,n:0},T:{o:0,n:0}};
  const results=[];
  mock.list.forEach((q,i)=>{
    const ok=mock.ans[i]===q.answer;
    per[q.field].n++;if(ok)per[q.field].o++;
    rec(q.id,ok);
    results.push({id:q.id,ok,sel:mock.ans[i]});

  const okAll=results.filter(r=>r.ok).length;
  const total=Math.round(okAll/mock.list.length*1000);
  const fs={};
  for(const f of ["S","M","T"])fs[f]=Math.round(per[f].o/per[f].n*1000);
  const pass=total>=600&&fs.S>=300&&fs.M>=300&&fs.T>=300;

        <span class="txt">${esc(q.question.slice(0,24))}…</span></button>`;
    }).join("")}
    <button class="btn" style="margin-top:14px" onclick="go('mock')">模試トップへ</button>
  </div>`;
  mock=null;
}

/* ================= フラッシュカード ================= */
let flash=null;
function allTerms(){
  const a=[];TERMGROUPS.forEach(g=>g.i.forEach(it=>a.push({t:it[0],d:it[1],h:!!it[2],f:g.f})));
  return a;
}
function startFlash(n){
  n=n||10;
  const all=allTerms();
  let pool=all.filter(x=>store.flash[x.t]!==1);
  if(pool.length<n)pool=all;
  const hot=shuffle(pool.filter(x=>x.h)),rest=shuffle(pool.filter(x=>!x.h));
  flash={list:shuffle(hot.slice(0,Math.ceil(n*0.7)).concat(rest).slice(0,n)),i:0,open:false,know:0,miss:[]};
  renderFlash();
}
function renderFlash(){
  const c=flash.list[flash.i];
  view.innerHTML=`
  <div class="topbar">
    <button class="iconbtn" onclick="flash=null;go('terms')">← 終了</button>
    <span class="sp"></span>
    <span style="font-size:13px;color:var(--sub)">${flash.i+1} / ${flash.list.length}</span>
  </div>
  <div class="pbar"><i style="width:${flash.i/flash.list.length*100}%"></i></div>
  <div class="card" style="min-height:300px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer" onclick="if(!flash.open){flash.open=true;renderFlash();}">
    <div style="font-size:12px;color:var(--sub);margin-bottom:8px">${FIELDS[c.f]}${c.h?" ⭐頻出":""}</div>
    <div style="font-size:22px;font-weight:800;margin-bottom:14px">${esc(c.t)}</div>
    ${flash.open?`
      <div style="font-size:14.5px;line-height:1.8;text-align:left;background:#eff6ff;border-radius:12px;padding:14px">${esc(c.d)}</div>`:`
      <div style="color:var(--sub);font-size:13px">タップして意味を表示</div>`}
  </div>
  ${flash.open?`
  <div class="grid2">
    <button class="btn" style="background:var(--ok)" onclick="flashAns(1)">😊 わかった</button>
    <button class="btn" style="background:var(--danger)" onclick="flashAns(0)">😵 まだ</button>
  </div>`:""}`;
}
function flashAns(know){
  const c=flash.list[flash.i];
  store.flash[c.t]=know;
  if(know)flash.know++;else flash.miss.push(c);
  bump("fl");
  flash.i++;flash.open=false;
  if(flash.i<flash.list.length){renderFlash();return;}
  const known=allTerms().filter(x=>store.flash[x.t]===1).length;
  view.innerHTML=`
  <div class="card">
    <div class="score-big"><div class="n">${flash.know}<small style="font-size:20px;color:var(--sub)">/${flash.list.length}</small></div>
    <div class="d">わかった！</div></div>
    <div class="note" style="text-align:center">累計「わかった」${known}/${allTerms().length}語</div>
    ${flash.miss.length?`<h3 class="sec">まだの用語（あとで再登場します）</h3>
      ${flash.miss.map(c=>`<div class="linkrow"><div class="ti">${esc(c.t)}</div><div class="dt" style="font-size:12px">${esc(c.d)}</div></div>`).join("")}`:""}
    <div class="grid2" style="margin-top:14px">
      <button class="btn warn" onclick="startFlash()">もう10枚</button>
      <button class="btn ghost" onclick="flash=null;go('home')">ホームへ</button>
    </div>
  </div>`;
  flash=null;
}

/* ================= 用語リスト ================= */
let termFilter="ALL",termQuery="";
function renderTerms(){
  view.innerHTML=`
  <div class="card">
    <h2>📖 重要用語リスト（<span id="tcount"></span>語）</h2>
    <button class="btn warn" style="margin-bottom:10px" onclick="startFlash()">⚡ フラッシュカードで暗記（10枚）</button>
    <div class="note" style="margin:-4px 0 10px">「わかった」${allTerms().filter(x=>store.flash[x.t]===1).length}/${allTerms().length}語。まだの用語が優先的に出ます。通勤などのすき間時間に。</div>
    <input id="tsearch" type="search" placeholder="用語・略語・説明文から検索"
      style="width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:inherit;margin-bottom:8px"
      value="${esc(termQuery)}">
    <div id="tfilters" style="margin-bottom:4px">
      ${["ALL","S","M","T"].map(f=>`<button class="btn sm ${termFilter===f?"":"gray"}" data-f="${f}" style="margin:0 6px 6px 0">${f==="ALL"?"すべて":FIELDS[f]}</button>`).join("")}
    </div>
    <div class="note">試験直前は⭐マーク（頻出）だけでも見直しましょう。用語をタップすると関連過去問があれば演習できます。</div>
  </div>
  <div id="tlist"></div>`;
  document.getElementById("tsearch").addEventListener("input",e=>{termQuery=e.target.value;drawTerms();});
  document.getElementById("tfilters").addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b)return;
    termFilter=b.dataset.f;renderTerms();
  });
  drawTerms();
}
function drawTerms(){
  const q=termQuery.trim().toLowerCase();
  let total=0;
  const html=TERMGROUPS.map(g=>{
    if(termFilter!=="ALL"&&g.f!==termFilter)return "";
    const items=g.i.filter(it=>!q||(it[0]+" "+it[1]).toLowerCase().includes(q));
    if(!items.length)return "";
    total+=items.length;
    return `<div class="card"><h2 style="font-size:13.5px"><span class="chip field-${g.f}">${FIELDS[g.f]}</span> ${g.c}（${items.length}）</h2>
    ${items.map(it=>`
      <div class="linkrow" style="cursor:pointer" onclick="termQuiz(this.dataset.t)" data-t="${esc(it[0])}">
        <div class="ti">${it[2]?"⭐ ":""}${esc(it[0])}</div>
        <div class="dt" style="font-size:12.5px;line-height:1.6">${esc(it[1])}</div>
      </div>`).join("")}
    </div>`;
  }).join("");
  document.getElementById("tcount").textContent=total;
  document.getElementById("tlist").innerHTML=html||'<div class="card"><div class="empty">該当する用語がありません</div></div>';
}
function termQuiz(name){
  const key=name.replace(/（.*?）/g,"").split("／")[0].toLowerCase();
  const hits=QUESTIONS.filter(q=>(q.question+q.choices.join("")+q.exp).toLowerCase().includes(key));
  if(!hits.length)return;
  if(!confirm(`「${name}」に関連する問題が${hits.length}問あります。演習しますか？`))return;
  quiz={list:shuffle(hits).slice(0,10),i:0,ok:0,answered:false,results:[]};
  renderQ();
}
